      - $ref: '#/components/parameters/RpaVersionParam'
    post:
      tags: [rpa]
      summary: Retire a version.
      operationId: rpa_job_type_versions_retire
      responses:
        '200':
          description: Version state changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJobTypeVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/rpa/specs:
    parameters:
      - $ref: '#/components/parameters/RpaProjectRefParam'
    get:
      tags: [rpa]
      summary: List a project's RPA specifications.
      operationId: rpa_specs_list
      parameters:
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Specifications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaSpecList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [rpa]
      summary: Create an RPA specification binding a job type to the project.
      operationId: rpa_specs_create
      description: Requires `system:rpa.create`. The referenced job type must have an active version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RpaSpecRequest' }
      responses:
        '201':
          description: Specification created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaSpec' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/rpa/specs/{spec_id}:
    parameters:
      - $ref: '#/components/parameters/RpaProjectRefParam'
      - $ref: '#/components/parameters/RpaSpecIdParam'
    get:
      tags: [rpa]
      summary: Read an RPA specification.
      operationId: rpa_specs_read
      responses:
        '200':
          description: Specification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaSpec' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [rpa]
      summary: Edit a specification (bumps its revision).
      operationId: rpa_specs_update
      requestBody:
