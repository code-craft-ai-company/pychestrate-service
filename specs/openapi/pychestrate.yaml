      tags: [pipelines]
      summary: Preview a matrix expansion into shards.
      operationId: pipelines_expand_matrix
      x-pychestrate-status: planned
      description: |
        Pure compute/preview surface: expands a supplied matrix
        spec into the concrete shard set the named sharding
        strategy would produce. Writes no rows, emits no events,
        and triggers nothing. The matrix is supplied entirely in
        the request body, so this is a project-scoped action with
        no `pipeline_id`. The default strategy is `cartesian`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatrixExpandRequest' }
      responses:
        '200':
          description: Expanded shard set preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShardExpansion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

