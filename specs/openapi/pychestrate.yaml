  /ext:
    get:
      tags: [plugin_api]
      summary: List extension-contributed REST endpoints.
      description: >-
        Operator-facing listing of the extension REST endpoints the
        host discovered at startup, under the
        `/api/v1/ext/<extension_name>/...` namespace. At startup the
        host mounts every route whose extension names a handler;
        each item says whether it is `mounted`, and `dynamic_mount`
        is `mounted` once mounting has run in this process. A mounted
        route requires a signed-in caller holding the route's
        `required_permissions`, and the extension must hold its
        `required_capabilities` in the extension sandbox (else 403).
        `packs` says what became of each installed extension pack
        (loaded, or the error it failed with) and `packs_enabled`
        whether loading installed packs is on.
        RBAC-gated on `system:plugin_api.read`.
      operationId: plugin_api_list_ext
      responses:
        '200':
          description: Discovered extension endpoints.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, dynamic_mount, packs, packs_enabled]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExtensionRoute' }
                  total: { type: integer }
                  dynamic_mount:
                    type: string
                    enum: [deferred, mounted]
                  packs:
                    type: array
                    items: { $ref: '#/components/schemas/ExtensionPack' }
                  packs_enabled:
                    type: boolean
                    description: "False when loading installed packs is turned off (`PYCHESTRATE_LOAD_EXTENSIONS=0`)."
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
