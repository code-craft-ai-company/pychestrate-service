    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: environment_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [drift]
      summary: Read the current drift status of an environment.
      operationId: drift_status_read
      x-pychestrate-status: planned
      description: |
        Returns the latest drift run for the environment as its
