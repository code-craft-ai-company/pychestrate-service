  /plugin-api/_meta/catalog:
    get:
      tags: [plugin_api]
      summary: List the plugin-API protocol catalog.
      operationId: plugin_api_list_catalog
      responses:
        '200':
          description: Catalog.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PluginApiProtocol' }
  /plugin-api/_meta/catalog/{protocol_name}:
    parameters:
      - in: path
        name: protocol_name
        required: true
        schema: { type: string }
    get:
      tags: [plugin_api]
      summary: Read one plugin-API protocol's metadata.
      operationId: plugin_api_get_protocol
      responses:
        '200':
          description: Protocol metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginApiProtocol' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plugin-api/_meta/mounts:
    get:
      tags: [plugin_api]
      summary: List extension mounts.
      operationId: plugin_api_list_mounts
      responses:
        '200':
          description: Mounts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PluginApiMount' }

  # =====================================================================
  # PLANNED — runs / test_runs / test_catalog / progress / dispatch /
  #            results / artifacts
  #
  # These endpoints are NOT yet implemented in the codebase. They are
  # declared here so that:
  #   1. The generated client surfaces them as soon as the spec lands.
  #   2. Parallel implementation PRs target a stable, agreed-upon shape.
  #
  # Each operation carries `x-pychestrate-status: planned`.
  # =====================================================================

  /runs:
    get:
      tags: [runs]
      summary: List runs (with filters).
      operationId: runs_list
      x-pychestrate-status: planned
      parameters:
        - in: query
          name: project_id
          schema: { type: string, format: uuid }
        - in: query
          name: pod_id
          schema: { type: string, format: uuid }
        - in: query
          name: state
          schema: { $ref: '#/components/schemas/RunState' }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
  /runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunIdParam'
    get:
      tags: [runs]
      summary: Read a run.
      operationId: runs_get_by_id
      x-pychestrate-status: planned
      responses:
        '200':
          description: Run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/RunIdParam'
    get:
      tags: [runs]
      summary: Subscribe to run events via Server-Sent Events.
      operationId: runs_subscribe_events
      x-pychestrate-status: planned
      description: |
        Long-lived response stream encoded as `text/event-stream`
        (Server-Sent Events). Each SSE frame's `data:` payload is a
        JSON document conforming to the `RunEvent` schema; the SSE
        `event:` line carries the event type
        (`state_changed` | `progress` | `result_manifest` | `heartbeat`).

        Clients should send `Accept: text/event-stream` and reconnect
        with `Last-Event-ID` to resume from a known sequence number.
      responses:
        '200':
          description: SSE stream of run events.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/RunEvent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{run_id}/dispatch-ack:
    parameters:
      - $ref: '#/components/parameters/RunIdParam'
    post:
      tags: [dispatch]
      summary: Client agent acknowledges receipt of a dispatched envelope.
      operationId: dispatch_ack_run
      x-pychestrate-status: planned
      description: |
        Posted by the pod client agent over mTLS after it has accepted
        a dispatch and minted a local run identifier. Signals that the
        envelope was received and is being prepared for execution; the
        server transitions the run's state from `DISPATCHING` to
        `DISPATCHED` on success.
      security:
        - pychestrate_mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispatchAck' }
      responses:
        '204':
          description: Ack recorded.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /runs/{run_id}/progress:
    parameters:
      - $ref: '#/components/parameters/RunIdParam'
    post:
      tags: [progress]
      summary: Ingest a live-progress frame for a run.
      operationId: progress_post_frame
      x-pychestrate-status: planned
      description: |
        Posted by the pod client agent over mTLS at intervals during the
        run. Payload shape matches the `automojo-testbase`
        `ProgressConcentratorServer` / `ForwardingInfo` contract so an
        unmodified testbase client can post directly without
        translation.

        Returns 202 on accept; the ingester is passive and never blocks
        the caller. Errors in downstream parsing are surfaced via the
        `RunEvent` SSE stream rather than the HTTP response.
      security:
        - pychestrate_mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressFrame' }
      responses:
        '202':
          description: Progress frame accepted.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{run_id}/results/complete:
    parameters:
      - $ref: '#/components/parameters/RunIdParam'
    post:
      tags: [results]
      summary: Signal that the result tree for a run is fully uploaded.
      operationId: results_post_complete
      x-pychestrate-status: planned
      description: |
        Posted by the pod client agent over mTLS once it has finished
        writing a run's result tree to the shared results backend.

        The handler is job-kind-aware -- it branches on the
        manifest's `format_tag`:

        * `testbase` -- the uploaded tree is a testbase result tree
          (`testrun_summary.json`, `testrun_results_stream.jsos`,
          `testrun_results.json`, `testsummary.html`, plus the
          `artifacts/`, `taskings/`, `tc-by-products/`,
          `diagnostics/` subtrees). The server kicks off the
          `result_tree_parser` extension chain.
        * `build` / `provision` -- the run is a build / provisioning
          run. The uploaded tree carries raw artifact files only
          (no per-test records), so the server takes a direct
          completion path: it advances the `BuildRun` / `InfraRun`
          to a terminal state and, for build runs, registers the
          uploaded artifacts as a build-artifacts manifest.

        In every case the server transitions the run to a terminal
        state (`COMPLETED` / `FAILED`) based on the manifest's
        `terminal_outcome` field.
      security:
        - pychestrate_mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResultManifest' }
      responses:
        '202':
          description: Manifest accepted; result-tree parsing scheduled.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /envelope-signing-keys:
    get:
      tags: [dispatch]
      summary: List the Ed25519 public keys used to sign job envelopes.
      operationId: envelope_signing_keys_list
      x-pychestrate-status: planned
      description: |
        A JWKS-style public-key distribution endpoint. The pod-client
        agent calls this to obtain the Ed25519 public key(s) it must
        verify signed job envelopes against — without the operator
        installing the key out-of-band.

        Auth: a signing *public* key is not a secret, so the endpoint
        accepts **any authenticated principal** — a cookie session, an
        API key, OR a verified mTLS client certificate. A
        freshly-enrolled pod client already holds its mTLS identity, so
        the mTLS path covers the client's use case. Anonymous requests
        get a 401. The endpoint returns 503 when no signing key has
        been provisioned.

        The response carries one or more keys to support rotation: at
        most one key is `active` and any others are `retiring`
        (grace-window verify keys). The same key set is also bundled in
        the `POST /enrollment-tokens/redeem` response so the happy path
        needs zero extra calls.
      responses:
        '200':
          description: The active envelope-signing public-key set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningKeySet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /runs/{run_id}/artifacts:
    parameters:
      - $ref: '#/components/parameters/RunIdParam'
    get:
      tags: [artifacts]
      summary: List artifacts for a run.
      operationId: artifacts_list_for_run
      x-pychestrate-status: planned
      parameters:
        - in: query
          name: prefix
          description: Limit results to artifacts whose path starts with this prefix.
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of artifact entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactEntryPage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{run_id}/artifacts/{artifact_path}:
    parameters:
      - $ref: '#/components/parameters/RunIdParam'
      - in: path
        name: artifact_path
        required: true
        description: Slash-delimited artifact path relative to the run's results root.
        schema: { type: string }
    get:
      tags: [artifacts]
      summary: Read metadata for one artifact entry.
      operationId: artifacts_get_entry
      x-pychestrate-status: planned
      responses:
        '200':
          description: Artifact entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{run_id}/artifacts:presign:
    parameters:
      - $ref: '#/components/parameters/RunIdParam'
    post:
      tags: [results]
      summary: Mint presigned PUT URLs for a run's result-tree upload.
      operationId: artifacts_presign_upload
      x-pychestrate-status: planned
      description: |
        Posted by the pod client agent over mTLS to obtain
        short-lived presigned PUT URLs for the relative artifact
        paths it discovered while walking its testbase result tree.

        The agent PUTs each artifact's bytes directly to the
        returned `put_url`, then calls
        `POST /runs/{run_id}/results/complete`. Object-store
        credentials never leave the server -- the credentialed
        transfer is encoded entirely in the presigned URL.

        On the dev / alpha deploy there is no S3-compatible object
        store, so the server mints **local-filesystem fallback**
        URLs that point back at
        `PUT /runs/{run_id}/artifacts/_local-upload`. The URL
        carries an HMAC signature over `run_id` + path + expiry, so
        the fallback needs no object-store credential while staying
        tamper-proof. The agent's code path is identical either way.

        Auth: the verified mTLS client common-name must match the
        `client_id` that owns the run's current dispatch receipt --
        only the client running the job may upload its results. A
        run that has already reached a terminal state no longer
        accepts uploads (409).
      security:
        - pychestrate_mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactPresignRequest' }
      responses:
        '200':
          description: Presigned upload targets minted, one per requested path.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPresignResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /runs/{run_id}/artifacts/_local-upload:
    parameters:
      - $ref: '#/components/parameters/RunIdParam'
      - in: query
        name: path
        required: true
        description: Canonicalized relative artifact path the bytes are stored under.
        schema: { type: string }
      - in: query
        name: expires
        required: true
        description: Expiry of the presigned URL as a Unix epoch second.
        schema: { type: integer }
      - in: query
        name: signature
        required: true
        description: HMAC-SHA256 signature over run_id + path + expiry.
        schema: { type: string }
    put:
      tags: [results]
      summary: Upload sink for the local-filesystem presign fallback.
      operationId: artifacts_local_upload
      x-pychestrate-status: planned
      description: |
        The upload sink the `:presign` operation's local-filesystem
        fallback URLs point at. Used only when the deploy has no
        S3-compatible object store.

        The request body is the raw artifact bytes. The handler
        re-verifies the `signature` query parameter against the
        server-held HMAC secret before writing the bytes under the
        run's allocated `backend_key_prefix`. A forged or expired
        signature is rejected with 403; the signature -- not a
        permission check -- is this endpoint's auth contract, so no
        object-store credential is involved.
      security:
        - pychestrate_mtls: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Artifact bytes written to the result tree.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactLocalUploadResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /projects/{project_id}/test-runs:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    post:
      tags: [test_runs]
      summary: Trigger a new test run on a project.
      operationId: test_runs_trigger
      x-pychestrate-status: planned
      description: |
        Creates a new run from a catalog entry and a pod selector.
        Returns the freshly-created run in `PENDING` state; the
        dispatcher transitions it to `DISPATCHING` asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestRunCreateRequest' }
      responses:
        '202':
          description: Run accepted (queued for dispatch).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{project_id}/test-catalog:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [test_catalog]
      summary: List test-catalog entries for a project.
      operationId: test_catalog_list
      x-pychestrate-status: planned
      parameters:
        - in: query
          name: importer_tag
          schema: { type: string }
        - in: query
          name: include_retired
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of catalog entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCatalogEntryPage' }
    post:
      tags: [test_catalog]
      summary: Upsert a test-catalog entry.
      operationId: test_catalog_upsert
      x-pychestrate-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCatalogEntryUpsertRequest' }
      responses:
        '200':
          description: Entry upserted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCatalogEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /projects/{project_id}/test-catalog:import:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    post:
      tags: [test_catalog]
      summary: Run a test-catalog importer (e.g., testbase project discovery).
      operationId: test_catalog_import
      x-pychestrate-status: planned
      description: |
        Invokes the named importer (resolved via the
        `test_catalog_importer` factory protocol) against the project.
        Each import overwrites entries with the same
        `(project_id, importer_tag, entry_key)` key in place.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCatalogImportRequest' }
      responses:
        '202':
          description: Import accepted (runs asynchronously).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCatalogImportSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/builds:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [builds]
      summary: List build runs for a project.
      operationId: builds_list
      x-pychestrate-status: planned
      description: |
        Returns a paginated page of build runs for the project,
        newest-first. The optional `state` query param filters by
        build-run lifecycle state.
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of build runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildRunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [builds]
      summary: Trigger a new build run on a project.
      operationId: builds_trigger
      x-pychestrate-status: planned
      description: |
        Resolves the named `runner_kind` (via the
        `build_runner_kind` factory protocol), validates the
        runner inputs, computes the reproducibility digest, and
        persists a build run in `PENDING` state. The Layer-5
        dispatch handoff is M2 work -- until then a triggered
        build run remains queued in `PENDING`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildRunCreateRequest' }
      responses:
        '202':
          description: Build run accepted (queued; dispatch is M2).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/builds/{build_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: build_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [builds]
      summary: Read a single build run.
      operationId: builds_read
      x-pychestrate-status: planned
      responses:
        '200':
          description: Build run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/builds/{build_id}/artifacts:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: build_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [builds]
      summary: List the output artifacts of a build run.
      operationId: builds_list_artifacts
      x-pychestrate-status: planned
      description: |
        Returns the artifact-manifest entries synthesized for the
        build run. The page is empty when the build run has not
        synthesized a manifest yet.
      responses:
        '200':
          description: Page of build artifacts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildArtifactPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =====================================================================
  # pipelines
  # =====================================================================

  /projects/{project_id}/pipelines:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [pipelines]
      summary: List pipeline definitions for a project.
      operationId: pipelines_list
      x-pychestrate-status: planned
      description: |
        Returns a paginated page of pipeline-definition documents
        cached for the project, newest-cached first. A pipeline
        definition is the parsed + DAG-validated + canonicalized
        document; its `pipeline_id` is the canonical-document
        SHA-256 digest.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of pipeline definitions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDefinitionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [pipelines]
      summary: Create or upsert a pipeline definition.
      operationId: pipelines_upsert
      x-pychestrate-status: planned
      description: |
        Parses, DAG-validates (cycle detection + stage-reference
        checks), canonicalizes, and caches a pipeline-definition
        document. The definition is content-addressed -- the
        `pipeline_id` is the canonical-document SHA-256 digest, so
        a `POST` with identical content is idempotent and no
        `PATCH` is offered (a content edit is just another upsert).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineDefinitionCreateRequest' }
      responses:
        '200':
          description: Pipeline definition upserted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/pipelines/{pipeline_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: pipeline_id
        required: true
        schema: { type: string }
        description: Canonical-document SHA-256 digest of the definition.
    get:
      tags: [pipelines]
      summary: Read a single pipeline definition.
      operationId: pipelines_read
      x-pychestrate-status: planned
      responses:
        '200':
          description: Pipeline definition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [pipelines]
      summary: Delete a pipeline definition.
      operationId: pipelines_delete
      x-pychestrate-status: planned
      responses:
        '204': { description: Pipeline definition deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/pipelines:validate:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    post:
      tags: [pipelines]
      summary: Validate a pipeline-definition DAG.
      operationId: pipelines_validate
      x-pychestrate-status: planned
      description: |
        Pure DAG validation of a supplied pipeline-definition
        document -- parsing, cycle detection, and stage-reference
        checks. Writes no rows and emits no events. The document
        is supplied entirely in the request body, so this is a
        project-scoped action with no `pipeline_id`. A well-formed
        document returns `200` with the topological stage order; a
        document with a cycle or unknown stage reference returns
        `422` with the issue list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineDefinitionCreateRequest' }
      responses:
        '200':
          description: Pipeline definition is a valid DAG.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DagValidationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

