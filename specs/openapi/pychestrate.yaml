      x-pychestrate-status: planned
      description: |
        Returns a paginated page of provisioning runs for the
        project, newest-first. The optional `state` and
        `environment_id` query params filter the page.
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled, rejected_by_guard]
        - in: query
          name: environment_id
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of provisioning runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningRunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [provisioning]
      summary: Trigger a provisioning run against an environment.
      operationId: provisioning_runs_trigger
      x-pychestrate-status: planned
      description: |
        Resolves the named `driver_name` (via the
        `infra_tool_driver` factory protocol), validates the
        driver inputs and action support against the bound
        environment, and persists a provisioning run in `PENDING`
        state. The infra-runs domain models a run directly --
        the `plan` / `apply` / `destroy` action is encoded on the
        run row; there is no separate provisioning-plan resource.
        The Layer-5 dispatch handoff is M2 work -- until then a
        triggered run remains queued in `PENDING`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisioningRunCreateRequest' }
      responses:
        '202':
          description: Provisioning run accepted (queued; dispatch is M2).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/provisioning-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: run_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [provisioning]
      summary: Read a single provisioning run.
      operationId: provisioning_runs_read
      x-pychestrate-status: planned
      responses:
