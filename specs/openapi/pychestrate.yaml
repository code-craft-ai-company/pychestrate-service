          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJobTypeVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rpa/job-types/{type_id}/versions/{version}/retire:
    parameters:
