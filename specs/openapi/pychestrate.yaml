  /projects/{project_id}/pods/{pod_id}/state/transitions:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/PodIdParam'
    post:
      tags: [pods]
      summary: Apply an operator-initiated lifecycle event to a pod.
      operationId: pods_apply_state_transition
      description: |
        Applies one operator-initiated lifecycle event to the
        pod's state machine and returns the updated state row.
        Only `drain` (READY / IN_USE -> DRAINING) and
        `deregister` (DRAINING / FAILED -> RELEASED) are accepted
        -- the remaining lifecycle events are system-driven and
        cannot be forged through the REST surface. An event that
        is not legal from the pod's current state returns `409`.
        Permission-gated by `system:pods.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_kind]
              properties:
                event_kind:
                  type: string
                  enum: [drain, deregister]
                payload:
                  type: object
                  additionalProperties: true
                  nullable: true
