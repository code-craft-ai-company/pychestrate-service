openapi: 3.1.0
info:
  title: Pychestrate Service API
  version: 0.0.17-preview
  description: |
    Authoritative REST contract for the **Pychestrate** continuous integration
    and orchestration service.

    This document is the single source of truth for the `/api/v1/*` HTTP
    surface. It is consumed by:

    * `codecraftai-restclient-base`'s `RestClientGenerator`, which produces the
      typed Python client `codecraftai-restclient-pychestrate`.
    * Server-side route implementations in the `pychestrate-service` repo
      (route handlers are expected to conform to the schemas declared here).
    * External integrators and tooling authors.

    ## Scope

    * Every endpoint the service registers under `/api/v1` is described. A
      test compares this document with the routes the service registers, so
      an endpoint cannot be added or removed without this file changing.
    * An operation flagged `x-pychestrate-status: planned` is described but
      the service does not serve it yet.

    The HTML admin / consumer UI surfaces under `/admin/*`, `/setup/*`,
    `/login`, and the projects / resources blueprints are **not** part of
    this contract; they are server-rendered HTML.

    ## Conventions

    * All paths are versioned under `/api/v1/`.
    * Path / query / request / response field names are `snake_case`.
    * Resource identifiers in paths use snake_case (`run_id`,
      `project_id`, `pod_id`, ...).
    * Non-CRUD verbs on a resource use the colon-action form
      (`/projects/{project_id}/test-catalog:import`).
    * All timestamps are ISO-8601 / RFC 3339 UTC strings
      (`2026-05-17T19:42:00Z`).
    * Every 4xx / 5xx response is a RFC 7807 Problem Document
      (`application/problem+json`) — see the `Problem` schema.
    * Paginated list endpoints return a `Page<T>` envelope (see the
      `Page` schema for the shape) so the codegen surfaces them through
      `ccai.restclient.base.pagedlist.PagedList`.
  contact:
    name: Code Craft AI LLC
    url: https://github.com/code-craft-ai-company/pychestrate-service
  license:
    # Proprietary: the repository's LICENSE.txt is the Pychestrate End
    # User License Agreement. The document used to say Apache-2.0.
    name: Pychestrate End User License Agreement

servers:
  - url: https://{host}/api/v1
    description: Generic templated server; supply the deployment host.
    variables:
      host:
        default: pychestrate.example.com
        description: Hostname of the Pychestrate service.

tags:
  - name: auth
    description: Local-credential authentication and session lifecycle.
  - name: me
    description: Permissions and identity of the currently-authenticated actor.
  - name: system
    description: >-
      Service health for monitoring. (Liveness / readiness probes and
      the Prometheus scrape live outside /api/v1: /livez, /readyz,
      /metrics.)
  - name: api_tokens
    description: |
      API tokens (personal access tokens and service-account tokens)
      that authenticate machine callers as `Authorization: Bearer pyc_...`.
  - name: service_accounts
    description: Non-human identities for CI and automation, authenticated by API tokens.
  - name: meta
    description: The API's own description (the OpenAPI document the pyc CLI reads).
  - name: users
    description: User account administration.
  - name: rbac
    description: Roles, permissions, role bindings, and permission checks.
  - name: audit
    description: Append-only audit log access.
  - name: secrets
    description: >-
      Org / project / user-scoped encrypted-secrets management with full CRUD.
      Metadata responses never carry the secret value; only the dedicated
      value-read endpoint returns plaintext, and only to authorized callers.
  - name: variables
    description: Hierarchical typed configuration variables.
  - name: flags
    description: Feature flags (runtime toggles).
  - name: tagging
    description: Shared tag model across entities.
  - name: retention
    description: Per-data-class retention policies.
  - name: notifications
    description: Notification channels (email, Slack, webhook, ...).
  - name: project_templates
    description: Scaffolded new-project presets.
  - name: projects
    description: Project workspaces — the top-level entity that owns runs,
      pods, members, repositories, builds, and tests.
  - name: clients
    description: Registered pod client agents.
  - name: enrollment
    description: Client-enrollment bootstrap tokens (mTLS issuance).
  - name: agents
    description: Agent rollouts and per-client capability inventory.
  - name: pods
    description: Pod definitions, registrations, topology, and templates.
  - name: plugin_api
    description: Plugin-API catalog metadata for installed extensions.
  - name: embed
    description: >-
      Embeddable-views catalog and signed-URL issuance. The signed
      embed-serving route (`GET /embed/{view_key}`) is token-authed
      and outside the `/api/v1` surface. Not served yet: the feature is
      unfinished, so every operation here is `planned` and the service
      registers the routes only when `PYCHESTRATE_EMBED_ENABLED` is set.
  - name: runs
    description: Run-state reads (`GET /runs/...`).
  - name: test_runs
    description: Trigger a new test run on a project + pod.
  - name: test_catalog
    description: Per-project test-catalog entries.
  - name: dispatch
    description: Pod-client → server dispatch acknowledgements.
  - name: progress
    description: Pod-client → server live progress ingestion.
  - name: results
    description: Pod-client → server final-result manifests.
  - name: artifacts
    description: Artifact listings and browsing for a run.
  - name: builds
    description: Trigger and read build runs for a project.
  - name: rpa
    description: Robotic Process Automation job types, specifications, and jobs (6-rpa-orchestration).
  - name: ui-profile
    description: Automation surfaces the shell presents (9-ui-profiles).
  - name: pipelines
    description: >-
      Pipeline-definition documents (the DAG of build/test/script
      stages) plus DAG validation and matrix-sharding preview.
  - name: source_integrations
    description: Per-project source-integration (SCM) configuration.
  - name: environments
    description: Register and read named target environments for a project.
  - name: provisioning
    description: Trigger and read infrastructure provisioning runs.
  - name: drift
    description: Read drift status and trigger drift checks on environments.
  - name: metrics
    description: >-
      Metric catalog, timeseries queries, and test-result rollups
      for testbase / testplus runs.
  - name: dashboards
    description: Project metric dashboards (named tile collections).
  - name: metric_alerts
    description: Per-project metric-alert rules.
  - name: resource_pools
    description: >-
      Capability-tagged resource pools, pool membership, and pool
      reservations (checkout / release of eligible pool members).
  - name: resources
    description: >-
      Per-resource reads -- the resource record, current health
      probe state, and the resource usage-history timeline.
  - name: blast_radius_guards
    description: >-
      Blast-radius guards -- per-environment attachments of
      registry-defined guard rules that cap provisioning blast
      radius, plus a guard-evaluation preview.
  - name: slos
    description: >-
      SLO definitions and the current burn-rate / error-budget
      status surfaced per SLO.
  - name: release_channels
    description: >-
      Published release-channel entries -- releases advertised on
      the canary / beta / stable channels.
  - name: webhooks
    description: >-
      Inbound and outbound webhook surface -- the unauthenticated
      inbound receiver, operator-facing inbound integration
      configurations and delivery ledger, plus outbound
      subscription CRUD, delivery history, and test events.
  - name: backups
    description: >-
      Backup and disaster-recovery -- backups that snapshot the
      database and the run artifacts into an archive and the key
      material (KEK, password pepper, ...) into a separate key
      bundle, plus backup listing, status / manifest reads, and
      restore verification. The restore itself runs offline
      (`python -m ccai.pychestrate.admin backup restore`).

security:
  - pychestrate_session: []
  - pychestrate_bearer: []
  - pychestrate_api_key: []

paths:

  # =====================================================================
  # auth
  # =====================================================================

  /auth/logout:
    post:
      tags: [auth]
      summary: Close the current session.
      operationId: auth_logout
      description: |
        Close the session named in the request body. Returns
        `{session_id, status: "closed"}` on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Session closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # =====================================================================
  # system
  # =====================================================================

  /system/health:
    get:
      tags: [system]
      summary: Aggregate subsystem health.
      operationId: system_health_read
      description: |
        The overall status of the database, feature-flag backends and
        extension-route host. Callers holding `system:ui.admin.view`
        get the per-subsystem document; every other caller -- including
        an anonymous monitor -- gets the overall status only
        (`details: "restricted"`).
      security:
        - {}
        - pychestrate_session: []
      responses:
        '200':
          description: Health document (full or restricted).
          content:
            application/json:
              example:
                status: ok
                version: 0.0.7-preview
                generated_at: '2026-09-28T23:58:25.920974+00:00'
                subsystems:
                - name: database
                  label: Database
                  status: ok
                  detail: Request-scoped session attached.
                - name: feature-flags
                  label: Feature Flags
                  status: ok
                  detail: All feature-flag backends healthy.
                  backends:
                  - name: local-db
                    status: ok
                    reason: ''
                - name: extension-routes
                  label: Extension Routes
                  status: ok
                  detail: 1 extension route(s) discovered.
                  route_count: 1
                - name: job-loop
                  label: Job Execution Loop
                  status: ok
                  detail: Pods can enroll, receive signed jobs and upload results.
                  backends:
                  - name: envelope-signing-key
                    status: ok
                    reason: Installed (key_id=dev-envelope-ed25519-1).
                  - name: enrollment-ca
                    status: ok
                    reason: Installed (ca_id=dev-enrollment-ca-1, issuer CN=pychestrate-dev-enrollment-ca).
                  - name: result-presign-secret
                    status: ok
                    reason: Configured (PYCHESTRATE_RESULT_PRESIGN_SECRET).
                  - name: dispatch-transport
                    status: ok
                    reason: Long-poll queue active (http-long-poll).
                  - name: client-certificate-proxies
                    status: ok
                    reason: 'Trusted for X-Client-Cert-CN / X-Client-Cert-Verify: 127.0.0.1/32, ::1/128.'
              schema: { $ref: '#/components/schemas/SystemHealth' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # =====================================================================
  # me
  # =====================================================================

  /me/permissions:
    get:
      tags: [me]
      summary: List the current actor's effective permissions.
      operationId: me_get_permissions
      description: |
        Returns the set of permission keys granted to the calling actor by
        the RBAC evaluator, plus the actor's user_id and a list of role
        bindings.
      responses:
        '200':
          description: Effective permission snapshot.
          content:
            application/json:
              example:
                permissions:
                - system:audit.read
                - system:auth.admin
                - system:auth.read
                - system:backups.read
                - system:backups.write
                - system:builds.create
              schema:
                $ref: '#/components/schemas/MePermissions'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/navigation:
    get:
      tags: [me]
      summary: Central, permission-filtered navigation manifest.
      operationId: me_get_navigation
      description: |
        Returns the central site-shell navigation manifest, filtered
        server-side against the calling actor's effective permissions.
        The site shell renders its full sidebar from this manifest on
        every route, so the sidebar is complete even on the bare `/`
        route where no feature bundle is loaded. The manifest is the
        authoritative source of truth for sidebar navigation. Like
        `/me/permissions` this is a UX signal -- the security boundary
        remains the per-action permission check enforced by each
        owning feature's server-side route guard.
      responses:
        '200':
          description: Permission-filtered navigation manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeNavigation'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # =====================================================================
  # meta
  # =====================================================================

  /_meta/openapi.json:
    get:
      tags: [meta]
      summary: This OpenAPI document, as JSON.
      operationId: meta_get_openapi
      description: |
        The REST contract the server implements, rendered from
        `specs/openapi/pychestrate.yaml`, with `servers` set to
        `/api/v1` on the answering host. The `pyc` CLI builds its
        commands from it. 404 when the deployment does not carry the
        spec.
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /_meta/docs:
    get:
      tags: [meta]
      summary: The API reference page, rendered from this document.
      operationId: meta_get_api_docs
      description: |
        A browsable, searchable reference (ReDoc) built from
        `/_meta/openapi.json`. Signed-in callers only. `/api/docs` on the
        same host redirects here. The page sets its own
        Content-Security-Policy: it loads nothing from another host and
        allows the `blob:` worker its search needs.
      responses:
        '200':
          description: The reference page.
          content:
            text/html:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /_meta/docs/assets/{filename}:
    get:
      tags: [meta]
      summary: A script the reference page loads.
      operationId: meta_get_api_docs_asset
      description: |
        Serves the bundled reference renderer to the page above. Only
        the file names the page uses are served (`redoc.standalone.js`);
        any other name is a 404.
      parameters:
        - in: path
          name: filename
          required: true
          schema: { type: string, enum: [redoc.standalone.js] }
      responses:
        '200':
          description: The script.
          content:
            application/javascript:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /_metrics/ui:
    post:
      tags: [system]
      summary: Receive a batch of page-timing measurements from the web UI.
      operationId: system_ingest_ui_metrics
      description: |
        The web UI sends one batch per page view and one per 30 seconds on a
        long-lived page. The whole batch is refused if any entry is
        malformed. Batches from signed-in users are added to the
        `pychestrate_ui_shell_*` series on `/metrics`; a batch without a
        session is checked and acknowledged only. Limits: 200 entries a
        batch, 16 labels an entry, names and label text up to 128
        characters, 120 batches a minute for a signed-in user and 60 a
        minute shared by every anonymous caller.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 200
              items:
                type: object
                required: [metric, value, timestamp_ms]
                properties:
                  metric: { type: string, maxLength: 128, example: pychestrate_ui_shell_tti_seconds }
                  value: { type: number, example: 0.187 }
                  labels:
                    type: object
                    maxProperties: 16
                    additionalProperties: { type: string, maxLength: 128 }
                    example: { route: /admin/users }
                  timestamp_ms: { type: number, example: 1710000000000 }
      responses:
        '200':
          description: The batch was accepted.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, distinct_metrics, recorded]
                properties:
                  accepted: { type: integer, description: Entries in the batch. }
                  distinct_metrics: { type: integer, description: Different metric names in the batch. }
                  recorded: { type: integer, description: Entries added to the aggregates (0 for a batch without a session). }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # =====================================================================
  # machine identity: /me, API tokens, service accounts
  # =====================================================================

  /me:
    get:
      tags: [me]
      summary: Who the caller is and how the request authenticated.
      operationId: me_get_identity
      description: |
        The signed-in principal: identity, account kind (`user` or
        `service_account`), and how the request authenticated -- a
        session, or an API token (with the token's id, name, scope,
        and expiry). `pyc whoami` and `pyc login` use it.
      responses:
        '200':
          description: The caller's identity.
          content:
            application/json:
              example:
                user_id: 053d9ac7-3349-43fe-958c-f56a3ff01b98
                login_name: dev-admin
                display_name: Test Admin
                primary_email: admin@example.com
                status: ACTIVE
                account_kind: user
                authentication:
                  method: session
              schema:
                $ref: '#/components/schemas/MeIdentity'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/api-tokens:
    get:
      tags: [api_tokens]
      summary: List the caller's API tokens.
      operationId: api_tokens_list_mine
      description: |
        The caller's tokens, newest first, including expired and
        revoked ones. Never includes a token secret.
      responses:
        '200':
          description: The caller's tokens.
          content:
            application/json:
              example:
                items:
                - token_id: 7b7022b4-e54b-4620-bec6-c7f8b1a75404
                  user_id: 053d9ac7-3349-43fe-958c-f56a3ff01b98
                  login_name: dev-admin
                  is_service_account: false
                  name: ci-nightly
                  token_hint: pyc_YcQlOP
                  scope: read-only
                  status: active
                  created_at: '2026-09-28T23:58:26.016873+00:00'
                  created_by_user_id: 053d9ac7-3349-43fe-958c-f56a3ff01b98
                  expires_at: '2026-10-28T23:58:26.016873+00:00'
                  last_used_at: null
                  revoked_at: null
                total: 1
              schema:
                $ref: '#/components/schemas/ApiTokenList'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [api_tokens]
      summary: Issue an API token that acts as the caller.
      operationId: api_tokens_create_mine
      description: |
        Issues a token with exactly the caller's permissions (or
        fewer, when `read-only`). The response carries the secret
        in `token` -- the only time it is ever returned -- with
        `Cache-Control: no-store`. Requires a signed-in session: a
        request authenticated with an API token gets 403, so a
        leaked token cannot mint a longer-lived successor.
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: ci-nightly
              expires_in_days: 30
              scope: read-only
            schema:
              $ref: '#/components/schemas/ApiTokenCreateRequest'
      responses:
        '201':
          description: Token issued; `token` is shown once.
          content:
            application/json:
              example:
                token_id: 7b7022b4-e54b-4620-bec6-c7f8b1a75404
                user_id: 053d9ac7-3349-43fe-958c-f56a3ff01b98
                login_name: dev-admin
                is_service_account: false
                name: ci-nightly
                token_hint: pyc_YcQlOP
                scope: read-only
                status: active
                created_at: '2026-09-28T23:58:26.016873+00:00'
                created_by_user_id: 053d9ac7-3349-43fe-958c-f56a3ff01b98
                expires_at: '2026-10-28T23:58:26.016873+00:00'
                last_used_at: null
                revoked_at: null
                token: pyc_YcQlOPOjvCpADtUvhRmH8bTW1jthGh5c_EXAMPLE-ONLY
              schema:
                $ref: '#/components/schemas/IssuedApiToken'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /me/api-tokens/{token_id}:
    parameters:
      - $ref: '#/components/parameters/ApiTokenIdParam'
    get:
      tags: [api_tokens]
      summary: Read one of the caller's API tokens.
      operationId: api_tokens_read_mine
      responses:
        '200':
          description: The token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [api_tokens]
      summary: Revoke one of the caller's API tokens.
      operationId: api_tokens_revoke_mine
      description: |
        Revokes the token immediately. A token may revoke itself.
        Another user's token id answers 404.
      responses:
        '200':
          description: The revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api-tokens:
    get:
      tags: [api_tokens]
      summary: List every API token (administration).
      operationId: api_tokens_list
      description: Requires `system:auth.read`.
      parameters:
        - name: user_id
          in: query
          required: false
          description: Only this user's (or service account's) tokens.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tokens, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api-tokens/{token_id}:
    parameters:
      - $ref: '#/components/parameters/ApiTokenIdParam'
    delete:
      tags: [api_tokens]
      summary: Revoke any API token (administration).
      operationId: api_tokens_revoke
      description: Requires `system:auth.admin`.
      responses:
        '200':
          description: The revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /service-accounts:
    get:
      tags: [service_accounts]
      summary: List service accounts.
      operationId: service_accounts_list
      description: Requires `system:users.read`.
      responses:
        '200':
          description: Service accounts with their count of working tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [service_accounts]
      summary: Create a service account.
      operationId: service_accounts_create
      description: |
        Requires `system:users.write`. A service account is an
        identity user with no password; bind roles to it like any
        user and issue it API tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountCreateRequest'
      responses:
        '201':
          description: Service account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /service-accounts/{user_id}/api-tokens:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'
    get:
      tags: [service_accounts]
      summary: List a service account's API tokens.
      operationId: service_accounts_list_tokens
      description: Requires `system:auth.read`.
      responses:
        '200':
          description: The service account's tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [service_accounts]
      summary: Issue an API token that acts as the service account.
      operationId: service_accounts_create_token
      description: |
        Requires `system:auth.admin` and a signed-in session. The
        secret is returned once. A user id that is not a service
        account answers 404, so no token can impersonate a person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreateRequest'
      responses:
        '201':
          description: Token issued; `token` is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiToken'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
