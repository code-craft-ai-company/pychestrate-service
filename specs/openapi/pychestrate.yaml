  # ---------------------------------------------------------------------
  # Client pull surface — PR p19g (renamed to /clients/ in p19h)
  # ---------------------------------------------------------------------

  /clients/{client_id}/dispatches:next:
    parameters:
      - $ref: '#/components/parameters/ClientIdParam'
    get:
      tags: [clients]
      summary: Long-poll for the next signed dispatch envelope.
      operationId: clients_dispatches_next
      x-pychestrate-status: planned
      description: |
        Long-polling pull endpoint the pod-client calls to fetch
        the next signed envelope queued for it by the server
        dispatcher.

        The server blocks the request for up to `timeout_seconds`
        (default 30, hard cap 60). On a queued dispatch the server
        returns 200 with a `PendingDispatch` body and the record
        is dequeued — the client MUST then POST
        `/runs/{run_id}/dispatch-ack` before the embedded
        `ack_deadline_at`, otherwise the dispatch reconciler will
        roll the attempt back. On a timeout the server returns 204
        and the client immediately re-polls.

        The cert common-name nginx forwards must match the path
        `client_id` — a mismatch returns 403.
      security:
        - pychestrate_mtls: []
      parameters:
        - in: query
          name: timeout_seconds
          description: How long the server may block before returning 204.
          schema:
            type: integer
            minimum: 0
            maximum: 60
            default: 30
      responses:
        '200':
          description: Dispatch dequeued for this client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingDispatch' }
        '204':
          description: No dispatch became available within `timeout_seconds`.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /clients/{client_id}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/ClientIdParam'
    get:
      tags: [clients]
      summary: Pod-client liveness ping.
      operationId: clients_heartbeat
      x-pychestrate-status: planned
      description: |
        Lightweight ping the pod-client calls between long-poll
        cycles to keep its registry row `last_seen` current.
        Rows missing from the registry are logged server-side and
        still answered successfully.

        The heartbeat doubles as the pod's cancel channel. The pod
        has no inbound channel — nginx terminates mTLS in front of
        the service and the pod never listens — so a cancel has to
        be PULLED like the job envelope is. The dispatch long-poll
        cannot carry it: the pod stops polling that endpoint for
        the whole duration of a job, which is exactly when a cancel
        matters. The heartbeat keeps ticking on its own thread while
        a job runs, so it is the only client-bound channel that is
        live during execution.

        When one or more cancel requests are queued for the calling
        client the server answers 200 with a `ClientHeartbeatAck`
        body listing them; otherwise it answers 204 exactly as
        before, so a client built before cancel support is
        unaffected. Delivery is at-least-once: a queued cancel is
        re-sent on every heartbeat until the pod reports a terminal
        outcome of `cancelled` for the run (or the run reaches a
        terminal state on its own), so the pod-side handler must be
        idempotent.
      security:
        - pychestrate_mtls: []
      responses:
        '200':
          description: >-
            Heartbeat recorded and one or more cancellations are
            queued for this client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientHeartbeatAck' }
        '204':
          description: Heartbeat recorded; nothing queued for this client.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

