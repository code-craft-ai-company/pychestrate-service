  # =====================================================================
  # pipelines
  # =====================================================================

  /projects/{project_id}/pipelines:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [pipelines]
      summary: List pipeline definitions for a project.
      operationId: pipelines_list
      description: |
        Returns a paginated page of pipeline-definition documents
        cached for the project, newest-cached first. A pipeline
        definition is the parsed + DAG-validated + canonicalized
        document; its `pipeline_id` is the canonical-document
        SHA-256 digest. A document saved from several commits or
        files is listed once (the newest source), with the older
        sources in `other_sources`; `meta.total` counts distinct
        definitions.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of pipeline definitions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDefinitionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [pipelines]
      summary: Create or upsert a pipeline definition.
      operationId: pipelines_upsert
      description: |
        Parses, DAG-validates (cycle detection + stage-reference
        checks), canonicalizes, and caches a pipeline-definition
        document. The definition is content-addressed -- the
        `pipeline_id` is the canonical-document SHA-256 digest, so
        a `POST` with identical content is idempotent and no
        `PATCH` is offered (a content edit is just another upsert).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineDefinitionCreateRequest' }
      responses:
        '200':
          description: Pipeline definition upserted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/pipelines/{pipeline_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: pipeline_id
        required: true
        schema: { type: string }
        description: Canonical-document SHA-256 digest of the definition.
    get:
      tags: [pipelines]
      summary: Read a single pipeline definition.
      operationId: pipelines_read
      responses:
        '200':
          description: Pipeline definition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [pipelines]
      summary: Delete a pipeline definition.
      operationId: pipelines_delete
      responses:
        '204': { description: Pipeline definition deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/pipelines:validate:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    post:
      tags: [pipelines]
      summary: Validate a pipeline-definition DAG.
      operationId: pipelines_validate
      description: |
        Pure DAG validation of a supplied pipeline-definition
        document -- parsing, cycle detection, and stage-reference
        checks. Writes no rows and emits no events. The document
        is supplied entirely in the request body, so this is a
        project-scoped action with no `pipeline_id`. A well-formed
        document returns `200` with the topological stage order; a
        document with a cycle or unknown stage reference returns
        `422` with the issue list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineDefinitionCreateRequest' }
      responses:
        '200':
          description: Pipeline definition is a valid DAG.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DagValidationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/pipelines:expand-matrix:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    post:
      tags: [pipelines]
      summary: Preview a matrix expansion into shards.
      operationId: pipelines_expand_matrix
      description: |
        Pure compute/preview surface: expands a supplied matrix
        spec into the concrete shard set the named sharding
        strategy would produce. Writes no rows, emits no events,
        and triggers nothing. The matrix is supplied entirely in
        the request body, so this is a project-scoped action with
        no `pipeline_id`. The default strategy is `cartesian`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatrixExpandRequest' }
      responses:
        '200':
          description: Expanded shard set preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShardExpansion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # =====================================================================
  # pipeline-runs
  # =====================================================================

  /projects/{project_id}/pipeline-runs:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [pipelines]
      summary: List pipeline runs for a project.
      operationId: pipeline_runs_list
      description: |
        Returns a paginated page of pipeline runs for the project,
        newest-started first. Each run carries its per-stage and
        per-step status.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of pipeline runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [pipelines]
      summary: Trigger a pipeline run.
      operationId: pipeline_runs_trigger
      description: |
        Triggers a pipeline run from a supplied pipeline-definition
        document, or from a pipeline already saved in the project
        (`pipeline_id`, the digest the pipelines list shows): the saved
        definition is run at the commit and file it was saved from, so
        the caller need not send it again. The DAG-walking
        `PipelineOrchestrator` parses and
        DAG-checks the document, persists a `PipelineRun` plus its
        per-stage and per-step rows, and dispatches the root stages'
        jobs through the existing build / test / provision dispatch.
        A stage becomes eligible once every stage it `needs` has
        completed successfully; a stage failure skips its dependents
        and fails the run. `build` steps build the run's `commit_sha`
        (and the branch named by `ref`) unless the step pins its own.
        `script` steps have no execution path yet: they are reported
        `failed` ("not executed"), never `completed`. A non-empty
        `matrix` is refused with 422 (`reason: matrix_not_supported`)
        because a run executes each stage once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineRunTriggerRequest' }
      responses:
        '201':
          description: Pipeline run triggered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/pipeline-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: run_id
        required: true
        schema: { type: string, format: uuid }
        description: Pipeline-run UUID.
    get:
      tags: [pipelines]
      summary: Read a single pipeline run.
      operationId: pipeline_runs_read
      description: |
        Reads a single pipeline run including its per-stage status
        (each stage's state, the dispatched stage jobs, and the
        per-step outcomes).
      responses:
        '200':
          description: Pipeline run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =====================================================================
  # metrics
  # =====================================================================

  /metrics/catalog:
    get:
      tags: [metrics]
      summary: List the registered metric catalog.
      operationId: metrics_catalog_list
      description: |
        Returns the registered metric definitions -- name, kind,
        and declared label dimensions -- so a UI knows what is
        queryable through the timeseries endpoint.
      responses:
        '200':
          description: Page of metric catalog entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricCatalogPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /metrics/timeseries:
    get:
      tags: [metrics]
      summary: Query a metric timeseries.
      operationId: metrics_timeseries_query
      description: |
        Returns timestamped data points for the named metric,
        newest-first, optionally bounded by the `from` / `to`
        observation window. This is the data behind metric charts.
      parameters:
        - in: query
          name: metric
          required: true
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000 }
      responses:
        '200':
          description: Timeseries query result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeseriesQuery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/test-metrics:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [metrics]
      summary: Read test-result metrics for a project.
      operationId: metrics_test_read
      description: |
        Returns a read-time roll-up of testbase / testplus test
        results for the project: aggregate pass / fail rates, the
        failed-run rate (share of runs with any failed or errored
        test -- no flake detection is performed), run counts, and
        duration trends, plus a recent per-run breakdown. The
        roll-up is computed on read from the persisted result-ingest
        summary rows.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 2000 }
      responses:
        '200':
          description: Test-result metrics summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestMetricsSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/dashboards:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [dashboards]
      summary: List dashboards for a project.
      operationId: dashboards_list
      responses:
        '200':
          description: Page of dashboards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [dashboards]
      summary: Create a dashboard.
      operationId: dashboards_create
      description: |
        Creates a named dashboard with an optional set of
        metric-tile definitions. The dashboard name is UNIQUE
        per project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardCreateRequest' }
      responses:
        '201':
          description: Dashboard created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/dashboards/{dashboard_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: dashboard_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [dashboards]
      summary: Read a single dashboard.
      operationId: dashboards_read
      responses:
        '200':
          description: Dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [dashboards]
      summary: Update a dashboard in place.
      operationId: dashboards_update
      description: |
        Updates a dashboard in place -- only the supplied fields
        change. A supplied `tiles` array replaces the whole tile
        set (per-tile validation applies). Renaming to a name
        already used in the project returns `409`. An optional
        `expected_version` field enables optimistic concurrency:
        a stale version returns `409`. Permission-gated like
        create (`system:dashboards.write`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardUpdateRequest' }
      responses:
        '200':
          description: Dashboard updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [dashboards]
      summary: Delete a dashboard.
      operationId: dashboards_delete
      description: |
        Removes the dashboard and its tiles. Permanent: there is no trash to restore it from. `404` for an
        unknown dashboard or one in another project. Needs `system:dashboards.write`.
      responses:
        '204':
          description: The dashboard is gone.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/metric-alerts:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [metric_alerts]
      summary: List metric-alert rules for a project.
      operationId: metric_alerts_list
      parameters:
        - in: query
          name: enabled_only
          schema: { type: boolean }
      responses:
        '200':
          description: Page of metric-alert rules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricAlertRulePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [metric_alerts]
      summary: Create a metric-alert rule.
      operationId: metric_alerts_create
      description: |
        Creates a metric-alert rule. The rule kind is resolved
        via the `alert_rule_kind` factory protocol and its config
        is validated against the kind. The rule name is UNIQUE
        per project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricAlertRuleCreateRequest'
      responses:
        '201':
          description: Metric-alert rule created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricAlertRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/metric-alerts/{rule_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: rule_id
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [metric_alerts]
      summary: Change a metric-alert rule.
      operationId: metric_alerts_update
      description: |
        Changes a rule. The body is the create body; a field left out keeps its stored value. The `kind` may be
        sent but must be the rule's own: a different kind is a different rule, so it is created anew (`422`).
        The same rules as create apply (`409` for a name another rule in the project has; `422` for a config
        the kind refuses). A change that alters nothing records nothing; otherwise `updated_at` is stamped and
        `entity.alert.rule_updated` names the fields that changed. Needs `system:metric_alerts.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricAlertRuleUpdateRequest'
      responses:
        '200':
          description: The rule after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricAlertRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [metric_alerts]
      summary: Delete a metric-alert rule.
      operationId: metric_alerts_delete
      description: |
        Removes the rule and its live state. Permanent: set `enabled` to false with `PUT` to stop a rule without
        losing it. `404` for an unknown rule or one in another project. Needs `system:metric_alerts.write`.
      responses:
        '204':
          description: The rule is gone.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /environment-kinds:
    get:
      tags: [environments]
      summary: List the environment kinds that are loaded.
      operationId: environment_kinds_list
      description: |
        Returns `{items: [{kind, fields}]}`. Each field describes an attribute
        the kind takes (`name`, `label`, `type` of `text`, `url`, `number` or
        `tags`, `required`, `hint`) so a form can offer them; a kind that does
        not describe its attributes has an empty `fields` list. Needs
        `system:environments.read`.
      responses:
        '200':
          description: The loaded kinds.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, fields]
                      properties:
                        kind: { type: string, description: 'Stable kind name, e.g. `k8s-cluster`.' }
                        fields:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              label: { type: string }
                              type: { type: string, enum: [text, url, number, tags] }
                              required: { type: boolean }
                              hint: { type: string }
                              integer: { type: boolean, description: 'For `number`: only whole numbers are accepted.' }
                              min: { type: number, description: 'For `number`: the smallest accepted value.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{project_id}/environments:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [environments]
      summary: List target environments for a project.
      operationId: environments_list
      description: |
        Returns a paginated page of environments registered for
        the project. The optional `kind` and `state` query params
        filter the page.
      parameters:
        - in: query
          name: kind
          schema: { type: string }
        - in: query
          name: state
          schema:
            type: string
            enum: [active, frozen, archived, destroyed]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of environments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [environments]
      summary: Register a new environment on a project.
      operationId: environments_register
      description: |
        Declares a named environment under a registered
        environment kind (resolved via the `environment_kind`
        factory protocol). The `attrs` object is validated by the
        resolved kind. The `(project, kind_name, name)` triple is
        unique -- a duplicate declare returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvironmentCreateRequest' }
      responses:
        '201':
          description: Environment registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/environments/{environment_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: environment_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [environments]
      summary: Read a single environment.
      operationId: environments_read
      responses:
        '200':
          description: Environment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/provisioning-runs:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [provisioning]
      summary: List provisioning runs for a project.
      operationId: provisioning_runs_list
      description: |
        Returns a paginated page of provisioning runs for the
        project, newest-first. The optional `state` and
        `environment_id` query params filter the page.
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled, rejected_by_guard]
        - in: query
          name: environment_id
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of provisioning runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningRunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [provisioning]
      summary: Trigger a provisioning run against an environment.
      operationId: provisioning_runs_trigger
      description: |
        Resolves the named `driver_name` (via the
        `infra_tool_driver` factory protocol), validates the
        driver inputs and action support against the bound
        environment, and persists a provisioning run in `PENDING`
        state. The infra-runs domain models a run directly --
        the `plan` / `apply` / `destroy` action is encoded on the
        run row; there is no separate provisioning-plan resource.
        The Layer-5 dispatch handoff is M2 work -- until then a
        triggered run remains queued in `PENDING`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisioningRunCreateRequest' }
      responses:
        '202':
          description: Provisioning run accepted (queued; dispatch is M2).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/provisioning-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: run_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [provisioning]
      summary: Read a single provisioning run.
      operationId: provisioning_runs_read
      responses:
        '200':
          description: Provisioning run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/environments/{environment_id}/drift:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: environment_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [drift]
      summary: Read the current drift status of an environment.
      operationId: drift_status_read
      description: |
        Returns the latest drift run for the environment as its
        current drift status. `latest_report` is `null` until a
        drift run has been recorded for the environment.
      responses:
        '200':
          description: Current drift status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriftStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/environments/{environment_id}/drift:check:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: environment_id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [drift]
      summary: Trigger a drift check on an environment.
      operationId: drift_check_trigger
      description: |
        Triggers a manual drift check, persisting a drift run in
        `PENDING` state. The run borrows the environment's drift
        schedule's checker -- an environment with no drift
        schedule returns `409` with `reason: no_drift_schedule`
        (no API creates drift schedules yet). The Layer-5 dispatch handoff is
        M2 work -- until then a triggered drift run remains queued
        in `PENDING`. The 202 body is explicit about this: it
        carries `dispatch_available: false` plus a `detail`
        message stating the check was recorded but automatic
        processing is not yet available.
      responses:
        '202':
          description: >-
            Drift check recorded (persisted in PENDING; automatic
            processing is not available in this release).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriftCheckAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{project_id}/source-integrations:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [source_integrations]
      summary: List source integrations for a project.
      operationId: source_integrations_list
      description: |
        Returns a `{items, meta}` page. A project owns at most one
        source integration in the M1 scaffolding, so the page
        holds zero or one element.
      responses:
        '200':
          description: Page of source integrations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceIntegrationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [source_integrations]
      summary: Register (or update) a project's source integration.
      operationId: source_integrations_register
      description: |
        Binds the project to an SCM provider + repository. The
        `provider_name` resolves to a registered `scm_provider`
        factory implementation. Re-posting overwrites the
        project's existing config in place.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceIntegrationRegisterRequest' }
      responses:
        '200':
          description: Source integration registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceIntegration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/source-integrations/{integration_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: integration_id
        required: true
        schema: { type: string, format: uuid }
        description: |
          Source-integration identifier. In the M1 scaffolding a
          project owns a single source integration keyed on the
          project id, so `integration_id` equals `project_id`.
    get:
      tags: [source_integrations]
      summary: Read a single source integration.
      operationId: source_integrations_read
      responses:
        '200':
          description: Source integration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceIntegration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------
  # 4-resources PR p20p: resource-management REST surface
  # ------------------------------------------------------------------

  /resource-pools:
    get:
      tags: [resource_pools]
      summary: List resource pools for a project.
      operationId: resource_pools_list
      description: |
        Returns a paginated `{items, meta}` page of resource pools.
        The pool-listing service is project-scoped, so the
        `project_id` query parameter is required.
      parameters:
        - in: query
          name: project_id
          required: true
          schema: { type: string, format: uuid }
          description: Owning project identifier.
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200':
          description: Page of resource pools.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePoolPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [resource_pools]
      summary: Create a resource pool.
      operationId: resource_pools_create
      description: |
        Creates a capability-tagged pool. The `(project_id, name)`
        pair is unique -- a duplicate name returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourcePoolCreateRequest' }
      responses:
        '201':
          description: Resource pool created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePool' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /resource-pools/{pool_id}:
    parameters:
      - in: path
        name: pool_id
        required: true
        schema: { type: string, format: uuid }
        description: Resource-pool identifier.
    get:
      tags: [resource_pools]
      summary: Read a resource pool.
      operationId: resource_pools_read
      responses:
        '200':
          description: Resource pool.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePool' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [resource_pools]
      summary: Delete a resource pool.
      operationId: resource_pools_delete
      description: |
        Hard-deletes the pool. Pool-membership rows cascade through
        the `resources_resource_pool_member` foreign key.
      responses:
        '204': { description: Resource pool deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /resource-pools/{pool_id}/resources:
    parameters:
      - in: path
        name: pool_id
        required: true
        schema: { type: string, format: uuid }
        description: Resource-pool identifier.
    get:
      tags: [resource_pools]
      summary: List the resource members of a pool.
      operationId: resource_pools_list_members
      responses:
        '200':
          description: Page of pool members.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePoolMemberPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [resource_pools]
      summary: Add a resource to a pool.
      operationId: resource_pools_add_member
      description: |
        Idempotent -- adding an already-attached resource returns
        the existing membership row.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourcePoolMemberAddRequest' }
      responses:
        '201':
          description: Resource added to the pool.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePoolMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /resource-pools/{pool_id}/resources/{resource_id}:
    parameters:
      - in: path
        name: pool_id
        required: true
        schema: { type: string, format: uuid }
        description: Resource-pool identifier.
      - in: path
        name: resource_id
        required: true
        schema: { type: string, format: uuid }
        description: Resource identifier.
    delete:
      tags: [resource_pools]
      summary: Remove a resource from a pool.
      operationId: resource_pools_remove_member
      description: |
        Idempotent on a missing membership. A `pool_id` or
        `resource_id` that is not a UUID names nothing and answers
        `404`.
      responses:
        '204': { description: Resource removed from the pool. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /resource-pools/{pool_id}/reservations:
    parameters:
      - in: path
        name: pool_id
        required: true
        schema: { type: string, format: uuid }
        description: Resource-pool identifier.
    get:
      tags: [resource_pools]
      summary: List reservations across a pool's member resources.
      operationId: resource_pools_list_reservations
      responses:
        '200':
          description: Page of reservations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [resource_pools]
      summary: Reserve (checkout) an eligible pool member.
      operationId: resource_pools_create_reservation
      description: |
        Opens a reservation against an eligible pool member. The
        FIFO `pick_candidate` allocation strategy chooses the
        member unless the body supplies an explicit `resource_id`
        target or a `preferred_member` hint. The chosen resource
        is reserved through the conflict evaluator -- a vetoed
        reserve returns `409`. A pool with no eligible (AVAILABLE)
        member also returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoolReservationRequest' }
      responses:
        '201':
          description: Reservation granted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /resource-pools/{pool_id}/reservations/{reservation_id}:
    parameters:
      - in: path
        name: pool_id
        required: true
        schema: { type: string, format: uuid }
        description: Resource-pool identifier.
      - in: path
        name: reservation_id
        required: true
        schema: { type: string, format: uuid }
        description: Reservation identifier.
    delete:
      tags: [resource_pools]
      summary: Release a reservation.
      operationId: resource_pools_release_reservation
      description: Idempotent on already-released reservations.
      responses:
        '204': { description: Reservation released. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /resources:
    get:
      tags: [resources]
      summary: List a project's resources.
      operationId: resources_list
      description: |
        Returns a paginated `{items, meta}` page of the project's resources,
        oldest registration first. Retired resources are left out unless
        `include_retired` is true or `state=retired` is asked for.
      parameters:
        - in: query
          name: project_id
          required: true
          schema: { type: string, format: uuid }
          description: Owning project identifier.
        - in: query
          name: kind
          schema: { type: string }
          description: Only resources of this kind (for example `device`).
        - in: query
          name: state
          schema: { type: string, enum: [available, leased, quarantined, maintenance, retired] }
        - in: query
          name: tag
          schema: { type: string }
          description: Only resources that carry this tag.
        - in: query
          name: include_retired
          schema: { type: boolean, default: false }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200':
          description: Page of resources.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [resources]
      summary: Register a resource.
      operationId: resources_register
      description: |
        Registers an externally owned resource (a device, for example) so it
        can be put in a pool and used by jobs. The kind validates and
        normalises `attributes`; the resource starts `available`.
        Needs `system:resources.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceRegisterRequest' }
            example:
              project_id: 8f0c1f2e-7a55-4e0b-9d5e-2f3f5f6c7d80
              kind: device
              display_name: Bench phone 1
              attributes: { hostname: phone-01, mac_address: "aa:bb:cc:dd:ee:01", vendor: ACME }
              tags: [android, lab]
      responses:
        '201':
          description: Resource registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '400':
          description: |
            The `kind` is not loaded. The problem's `loaded_kinds` member lists
            the kinds that are.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /resources/{resource_id}:
    parameters:
      - in: path
        name: resource_id
        required: true
        schema: { type: string, format: uuid }
        description: Resource identifier.
    get:
      tags: [resources]
      summary: Read a resource.
      operationId: resources_read
      responses:
        '200':
          description: Resource.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [resources]
      summary: Change a resource's name, description or tags.
      operationId: resources_update
      description: |
        Changes `display_name`, `description` and/or `tags`; a field left out is
        not touched. The kind, the identity and the attributes cannot be changed
        here (`422` names them), and a retired resource is refused with `409`
        (retirement is terminal). A change that alters nothing records nothing;
        otherwise `entity.resource.updated` names the fields that changed.
        Needs `system:resources.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceUpdateRequest' }
      responses:
        '200':
          description: The resource after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The resource is retired.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Nothing to change, a field that cannot be changed here, or an invalid value.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /resources/{resource_id}/state:
    parameters:
      - in: path
        name: resource_id
        required: true
        schema: { type: string, format: uuid }
        description: Resource identifier.
    post:
      tags: [resources]
      summary: Transition a resource's lifecycle state.
      operationId: resources_transition_state
      description: |
        Applies a lifecycle state transition (quarantine, move to
        maintenance, mark available, retire, ...). Legal transitions
        are validated by the inventory service -- an impermissible
        move (retired is terminal; un-retiring requires a fresh
        registration) returns `409` with a
        `reason: transition_not_permitted` extension. Idempotent on
        same-state moves.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceStateTransitionRequest' }
      responses:
        '200':
          description: Updated resource.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /resources/{resource_id}/health:
    parameters:
      - in: path
        name: resource_id
        required: true
        schema: { type: string, format: uuid }
        description: Resource identifier.
    get:
      tags: [resources]
      summary: Read the current health record for a resource.
      operationId: resources_read_health
      description: |
        Health records are seeded on `entity.resource.registered`
        -- a resource that has never been seeded returns `404`.
      responses:
        '200':
          description: Resource health record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /resources/{resource_id}/usage-history:
    parameters:
      - in: path
        name: resource_id
        required: true
        schema: { type: string, format: uuid }
        description: Resource identifier.
    get:
      tags: [resources]
      summary: List the usage-history timeline for a resource.
      operationId: resources_list_usage_history
      description: |
        Returns the usage timeline newest-first as a `{items, meta}`
        page. A `resource_id` that is not a UUID names nothing and
        answers `404`.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Page of usage records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/blast-radius-guards:
    parameters:
      - in: path
        name: project_id
        required: true
        schema: { type: string, format: uuid }
        description: Project identifier.
    get:
      tags: [blast_radius_guards]
      summary: List blast-radius guards for an environment.
      operationId: blast_radius_guards_list
      description: >-
        The guards domain is environment scoped; the
        `environment_id` query param is required and must be a
        complete environment UUID (a missing one answers 400, a
        malformed or partial one 422). A malformed `project_id`
        answers 404. Returns guard attachments as an
        `{items, meta}` page.
      parameters:
        - in: query
          name: environment_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: enabled_only
          schema: { type: boolean, default: false }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200':
          description: Page of blast-radius guards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlastRadiusGuardPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [blast_radius_guards]
      summary: Attach a blast-radius guard onto an environment.
      operationId: blast_radius_guards_create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlastRadiusGuardCreate' }
      responses:
        '201':
          description: Blast-radius guard attached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlastRadiusGuard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/blast-radius-guards:evaluate:
    parameters:
      - in: path
        name: project_id
        required: true
        schema: { type: string, format: uuid }
        description: Project identifier.
    post:
      tags: [blast_radius_guards]
      summary: Evaluate a proposed change against the guards.
      operationId: blast_radius_guards_evaluate
      description: >-
        Previews whether a proposed change would be blocked.
        Walks every registered guard rule regardless of attachment
        state and returns the per-rule verdict trace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlastRadiusGuardEvaluationRequest'
      responses:
        '200':
          description: Guard evaluation trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlastRadiusGuardEvaluation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/blast-radius-guards/{guard_id}:
    parameters:
      - in: path
        name: project_id
        required: true
        schema: { type: string, format: uuid }
        description: Project identifier.
      - in: path
        name: guard_id
        required: true
        schema: { type: string }
        description: >-
          Composite guard identifier (`{environment_id}.{rule_id}`).
    get:
      tags: [blast_radius_guards]
      summary: Read a blast-radius guard.
      operationId: blast_radius_guards_read
      responses:
        '200':
          description: Blast-radius guard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlastRadiusGuard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [blast_radius_guards]
      summary: Toggle a blast-radius guard's enabled flag.
      operationId: blast_radius_guards_patch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlastRadiusGuardPatch' }
      responses:
        '200':
          description: Updated blast-radius guard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlastRadiusGuard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [blast_radius_guards]
      summary: Disable a blast-radius guard.
      operationId: blast_radius_guards_delete
      description: >-
        The guards domain has no hard delete -- the attachment
        row is flipped to a disabled state.
      responses:
        '204':
          description: Blast-radius guard disabled.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/slos:
    parameters:
      - in: path
        name: project_id
        required: true
        schema: { type: string, format: uuid }
        description: Project identifier.
    get:
      tags: [slos]
      summary: List SLO definitions for a project.
      operationId: slos_list
      parameters:
        - in: query
          name: kind
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200':
          description: Page of SLO definitions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SloPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [slos]
      summary: Create an SLO definition.
      operationId: slos_create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SloCreate' }
      responses:
        '201':
          description: SLO definition created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/slos/{slo_id}:
    parameters:
      - in: path
        name: project_id
        required: true
        schema: { type: string, format: uuid }
        description: Project identifier.
      - in: path
        name: slo_id
        required: true
        schema: { type: string, format: uuid }
        description: SLO identifier.
    get:
      tags: [slos]
      summary: Read an SLO definition with current status.
      operationId: slos_read
      description: >-
        Returns the SLO definition with an embedded `status`
        block carrying the current achieved ratio, error-budget
        remaining, and burn-rate state.
      responses:
        '200':
          description: SLO definition with status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SloWithStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [slos]
      summary: Replace an SLO definition.
      operationId: slos_update
      description: |
        Replaces the editable definition (the create body: name, target, window, description, definition
        config, notification route, auto-attach). The `kind` is required and must be the SLO's own: a
        different kind is a different objective, so it is created anew (`422`). The same rules as create
        apply (`409` for a name another SLO in the project has; `422` for a target outside 0..1, a
        window that is not positive, or a config the kind refuses). A change that alters nothing records
        nothing; otherwise the version goes up and `entity.slo.updated` names the fields that changed.
        Needs `system:slos.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SloCreate' }
      responses:
        '200':
          description: The SLO after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [slos]
      summary: Delete an SLO definition.
      operationId: slos_delete
      description: >-
        Idempotent delete -- the burn-rate-state row cascades via
        the foreign key.
      responses:
        '204':
          description: SLO definition deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /release-channels:
    get:
      tags: [release_channels]
      summary: List published release-channel entries.
      operationId: release_channels_list
      description: >-
        A release-channel entry is a published release row. The
        M1 release domain ships publish + read only; promotion and
        rollback are M2 milestones.
      parameters:
        - in: query
          name: component
          schema: { type: string, enum: [service, agent] }
        - in: query
          name: channel
          schema: { type: string, enum: [canary, beta, stable] }
        - in: query
          name: status
          schema:
            type: string
            enum: [active, superseded, rolled_back, withdrawn]
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200':
          description: Page of release-channel entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseChannelEntryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [release_channels]
      summary: Publish a release onto a channel.
      operationId: release_channels_create
      description: >-
        Publishes a Pychestrate service or agent release onto an update
        channel. Publishing signs the release manifest; when the server
        has no release-signing key the request answers 503 with
        `reason: signing_key_missing` and a detail explaining it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseChannelEntryCreate' }
      responses:
        '201':
          description: Release published onto the channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseChannelEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503':
          description: No release-signing key is installed, so the release cannot be signed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /release-channels/{channel_id}:
    parameters:
      - in: path
        name: channel_id
        required: true
        schema: { type: string, format: uuid }
        description: Release-channel entry identifier (release UUID).
    get:
      tags: [release_channels]
      summary: Read a release-channel entry.
      operationId: release_channels_read
      responses:
        '200':
          description: Release-channel entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseChannelEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =====================================================================
  # webhooks (inbound + outbound)
  # =====================================================================

  /webhooks/in/{provider}/{hook_name}:
    parameters:
      - in: path
        name: provider
        required: true
        description: Provider key the integration was registered under.
        schema: { type: string }
      - in: path
        name: hook_name
        required: true
        description: Logical hook name within the provider.
        schema: { type: string }
    post:
      tags: [webhooks]
      summary: Receive an inbound webhook delivery.
      operationId: webhooks_in_receive
      description: |
        The unauthenticated inbound receiver. External systems POST
        provider-native events here. The handler runs per-integration
        signature verification, replay-cache de-duplication,
        normalization, and dispatch. This endpoint is NOT cookie/RBAC
        gated -- it authenticates via the integration's signature
        verification. Answers in webhook-conventional terms.
      security: []
      requestBody:
        required: true
        description: Provider-native event payload (opaque to this contract).
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Delivery accepted and dispatched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInReceiveResult' }
        '404':
          description: No integration is configured for this provider / hook.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInReceiveResult' }
        '401':
          description: Signature verification failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInReceiveResult' }
        '409':
          description: Delivery was already seen (replay ignored).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInReceiveResult' }
        '503':
          description: |
            The service cannot verify the delivery: no database session,
            or (`reason: secret_unavailable`) the integration's shared
            secret no longer resolves in the secrets vault.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInReceiveResult' }

  /webhooks/in/integrations:
    get:
      tags: [webhooks]
      summary: List inbound webhook integration configurations.
      operationId: webhooks_in_list_integrations
      parameters:
        - in: query
          name: project_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: enabled_only
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Page of inbound integration configurations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInIntegrationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [webhooks]
      summary: Register an inbound webhook integration configuration.
      operationId: webhooks_in_create_integration
      description: |
        The integration's shared secret is stored only in the secrets
        vault. Send the key itself as the write-only `secret` (it is
        stored as a project secret on the caller's behalf, which needs
        `system:secrets.admin` or project membership plus
        `system:project_secrets.write`), or name an existing vault
        secret the caller may read in `secret_ref`. No response ever
        contains the key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookInIntegrationCreate' }
      responses:
        '201':
          description: Integration configuration registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInIntegration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            The caller lacks `system:webhooks.write`, may not store the
            secret in the project's vault scope, or may not read the
            vault secret named by `secret_ref`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /webhooks/in/integrations/{webhook_id}:
    parameters:
      - in: path
        name: webhook_id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [webhooks]
      summary: Enable or disable an inbound webhook integration.
      operationId: webhooks_in_update_integration
      description: |
        The only mutable field is `enabled` -- provider / hook /
        secret are immutable in M1 (the rotate-secret path lands
        in M2). Idempotent in both directions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookInIntegrationUpdate' }
      responses:
        '200':
          description: Integration updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInIntegration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /webhooks/in/deliveries:
    get:
      tags: [webhooks]
      summary: List recent inbound webhook deliveries.
      operationId: webhooks_in_list_deliveries
      description: |
        Recent inbound deliveries (the replay-cache ledger) for
        audit / debug, newest-first.
      parameters:
        - in: query
          name: provider
          schema: { type: string }
        - in: query
          name: hook_name
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Page of inbound delivery ledger rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInDeliveryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /webhooks/out/subscriptions:
    get:
      tags: [webhooks]
      summary: List outbound webhook subscriptions.
      operationId: webhooks_out_list_subscriptions
      parameters:
        - in: query
          name: project_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: enabled_only
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Page of outbound subscriptions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookOutSubscriptionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [webhooks]
      summary: Register an outbound webhook subscription.
      operationId: webhooks_out_create_subscription
      description: |
        When the request supplies no `secret_ref`, the service
        generates an HMAC signing secret for the subscription and
        returns it ONCE as `signing_secret` on the 201 response.
        It is never readable again through the API -- receivers
        use it to verify the `X-Pychestrate-Signature` header on
        deliveries.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookOutSubscriptionCreate' }
      responses:
        '201':
          description: Subscription registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookOutSubscriptionCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /webhooks/out/subscriptions/{subscription_id}:
    parameters:
      - in: path
        name: subscription_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [webhooks]
      summary: Read an outbound webhook subscription.
      operationId: webhooks_out_read_subscription
      responses:
        '200':
          description: Outbound subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookOutSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [webhooks]
      summary: Enable or disable an outbound webhook subscription.
      operationId: webhooks_out_update_subscription
      description: |
        The only mutable field is `enabled` -- name / URL / topic
        filters are immutable in M1 (recreate the subscription to
        change them). Idempotent in both directions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookOutSubscriptionUpdate' }
      responses:
        '200':
          description: Subscription updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookOutSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [webhooks]
      summary: Disable an outbound webhook subscription.
      operationId: webhooks_out_delete_subscription
      description: |
        Disables the subscription (idempotent). The domain retains
        the row for the delivery-history audit trail.
      responses:
        '200':
          description: Subscription disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookOutSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/out/subscriptions/{subscription_id}/deliveries:
    parameters:
      - in: path
        name: subscription_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [webhooks]
      summary: List delivery history for an outbound subscription.
      operationId: webhooks_out_list_deliveries
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Page of outbound delivery attempts, newest-first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookOutDeliveryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/out/subscriptions/{subscription_id}/test:
    parameters:
      - in: path
        name: subscription_id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [webhooks]
      summary: Send a test event for an outbound subscription.
      operationId: webhooks_out_test_subscription
      description: |
        Builds a signed test event for the subscription, POSTs it to
        the subscription URL and records the attempt with its real
        outcome: `succeeded` for a 2xx answer, `failed` otherwise
        (with the receiver's status and a response excerpt, or why
        the request was not sent). The server does not call
        loopback, link-local, unspecified, multicast or reserved
        addresses (or `localhost`) and does not follow redirects.
        Exposed as a trailing `/test` sub-resource because the route
        matcher cannot place a literal `:test` action suffix on a
        param segment.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookOutTestRequest' }
      responses:
        '200':
          description: Test event sent (or refused) and recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookOutTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # =====================================================================
  # backups
  # =====================================================================

  /backups:
    get:
      tags: [backups]
      summary: List backup records.
      operationId: backups_list
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, running, completed, failed]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of backup records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [backups]
      summary: Trigger a backup.
      operationId: backups_create
      description: |
        Runs a backup now: a consistent database snapshot (SQLite
        online backup, or `pg_dump --format=custom`) and the run
        artifacts into an archive written through the configured
        `BackupStorageBackend`, and the key material into a separate
        key bundle in the key-bundle directory. Returns the backup
        record with its terminal status synchronously. A failed run
        is recorded with status `failed`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupCreateRequest' }
      responses:
        '201':
          description: Backup completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRecord' }
        '202':
          description: Backup accepted and recorded (terminal state pending).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500':
          description: A substrate failed (e.g. a key file could not be read); the run is recorded as failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: The storage backend could not accept the archive.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /backups/{backup_id}:
    parameters:
      - in: path
        name: backup_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [backups]
      summary: Read a backup record's status and manifest.
      operationId: backups_read
      responses:
        '200':
          description: Backup record with status and manifest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /backups/{backup_id}:restore:
    parameters:
      - in: path
        name: backup_id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [backups]
      summary: Verify a backup / get its restore command.
      operationId: backups_restore
      description: |
        Same operation as `POST /backups/{backup_id}/restore`. The
        service's router only matches a parameter that fills a whole
        path segment, so this `:restore` spelling is not reachable
        until the router supports it; use `/restore`.

        With `{"dry_run": true}`, verifies the backup end to end --
        archive checksum, manifest, database snapshot integrity and
        row counts, artifact count, key-bundle fingerprints, and that
        the KEK unwraps the stored data keys -- and returns the checks
        plus the command that restores it.

        A restore replaces the database, the run artifacts and the
        keys the running service has loaded, so the service cannot
        perform it on itself: without `dry_run` the answer is `409`
        with the command to run with the service stopped
        (`restore_command` in the problem document).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupRestoreRequest' }
      responses:
        '200':
          description: Verification result (dry run).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRestoreResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Restore must run offline; the problem document carries
            `restore_command`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /backups/{backup_id}/restore:
    parameters:
      - in: path
        name: backup_id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [backups]
      summary: Verify a backup / get its restore command (reachable spelling of :restore).
      operationId: backups_restore_subresource
      description: |
        With `{"dry_run": true}`, verifies the backup end to end --
        archive checksum, manifest, database snapshot integrity and
        row counts, artifact count, key-bundle fingerprints, and that
        the KEK unwraps the stored data keys -- and returns the checks
        plus the command that restores it.

        A restore replaces the database, the run artifacts and the
        keys the running service has loaded, so the service cannot
        perform it on itself: without `dry_run` the answer is `409`
        with the command to run with the service stopped
        (`restore_command` in the problem document).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupRestoreRequest' }
      responses:
        '200':
          description: Verification result (dry run).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRestoreResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Restore must run offline; the problem document carries
            `restore_command`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ---------------------------------------------------------------------------
  # rpa -- 6-rpa-orchestration (Phase 11)
  # ---------------------------------------------------------------------------

  /rpa/execution-modes:
    get:
      tags: [rpa]
      summary: List the registered RPA execution-mode drivers.
      operationId: rpa_execution_modes_list
      responses:
        '200':
          description: Execution modes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  execution_modes:
                    type: array
                    items: { $ref: '#/components/schemas/RpaExecutionMode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /rpa/job-types:
    get:
      tags: [rpa]
      summary: List RPA job types with their versions.
      operationId: rpa_job_types_list
      description: Requires `system:rpa.read`. Code-defined job types shipped by extensions are mirrored into the registry on read.
      parameters:
        - in: query
          name: state
          schema: { type: string, enum: [active, retired] }
      responses:
        '200':
          description: Job types.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJobTypeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [rpa]
      summary: Register an RPA job type.
      operationId: rpa_job_types_create
      description: Requires `system:rpa.job_types.manage`. The `type_id` is a lowercase slug of 3 to 64 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RpaJobTypeCreateRequest' }
      responses:
        '201':
          description: Job type registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJobType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /rpa/job-types/{type_id}:
    parameters:
      - $ref: '#/components/parameters/RpaTypeIdParam'
    get:
      tags: [rpa]
      summary: Read an RPA job type.
      operationId: rpa_job_types_read
      responses:
        '200':
          description: Job type with versions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJobType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [rpa]
      summary: Edit display fields, schema, secret fields, or capabilities.
      operationId: rpa_job_types_update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RpaJobTypeUpdateRequest' }
      responses:
        '200':
          description: Updated job type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJobType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /rpa/job-types/{type_id}/retire:
    parameters:
      - $ref: '#/components/parameters/RpaTypeIdParam'
    post:
      tags: [rpa]
      summary: Retire a job type; new runs are refused, existing jobs stay readable.
      operationId: rpa_job_types_retire
      responses:
        '200':
          description: Retired job type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJobType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rpa/job-types/{type_id}/versions:
    parameters:
      - $ref: '#/components/parameters/RpaTypeIdParam'
    post:
      tags: [rpa]
      summary: Publish a version of a job type.
      operationId: rpa_job_type_versions_publish
      description: The execution-mode driver validates `entrypoint` (`command` for process jobs; `workflow` or `tasking` for tasker jobs).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RpaJobTypeVersionPublishRequest' }
      responses:
        '201':
          description: Version published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJobTypeVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /rpa/job-types/{type_id}/versions/{version}/deprecate:
    parameters:
      - $ref: '#/components/parameters/RpaTypeIdParam'
      - $ref: '#/components/parameters/RpaVersionParam'
    post:
      tags: [rpa]
      summary: Deprecate a version (excluded from latest-active resolution).
      operationId: rpa_job_type_versions_deprecate
      responses:
        '200':
          description: Version state changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJobTypeVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rpa/job-types/{type_id}/versions/{version}/retire:
    parameters:
      - $ref: '#/components/parameters/RpaTypeIdParam'
      - $ref: '#/components/parameters/RpaVersionParam'
    post:
      tags: [rpa]
      summary: Retire a version.
      operationId: rpa_job_type_versions_retire
      responses:
        '200':
          description: Version state changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJobTypeVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/rpa/specs:
    parameters:
      - $ref: '#/components/parameters/RpaProjectRefParam'
    get:
      tags: [rpa]
      summary: List a project's RPA specifications.
      operationId: rpa_specs_list
      parameters:
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Specifications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaSpecList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [rpa]
      summary: Create an RPA specification binding a job type to the project.
      operationId: rpa_specs_create
      description: Requires `system:rpa.create`. The referenced job type must have an active version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RpaSpecRequest' }
      responses:
        '201':
          description: Specification created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaSpec' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/rpa/specs/{spec_id}:
    parameters:
      - $ref: '#/components/parameters/RpaProjectRefParam'
      - $ref: '#/components/parameters/RpaSpecIdParam'
    get:
      tags: [rpa]
      summary: Read an RPA specification.
      operationId: rpa_specs_read
      responses:
        '200':
          description: Specification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaSpec' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [rpa]
      summary: Edit a specification (bumps its revision).
      operationId: rpa_specs_update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RpaSpecRequest' }
      responses:
        '200':
          description: Updated specification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaSpec' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [rpa]
      summary: Delete a specification with no active jobs.
      operationId: rpa_specs_delete
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  spec_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{project_id}/rpa/specs/{spec_id}/trigger:
    parameters:
      - $ref: '#/components/parameters/RpaProjectRefParam'
      - $ref: '#/components/parameters/RpaSpecIdParam'
    post:
      tags: [rpa]
      summary: Trigger an RPA job with a work packet.
      operationId: rpa_jobs_trigger
      description: |
        Merges `work_packet` over the specification's `default_packet`
        (packet keys win), validates it against the job type's JSON
        schema, redacts `secret_fields` in storage, mints a signed
        `job_kind=rpa` envelope, and dispatches it to an eligible pod.
        The packet is validated before any pod is chosen. An identical
        request within the idempotency window (60 s) returns the original
        job with `replayed: true` and status 200 instead of starting a new
        one; send `allow_duplicate: true` to start a new job anyway.
        Unknown body fields are refused with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RpaTriggerRequest' }
      responses:
        '200':
          description: An identical run was submitted within the idempotency window; the earlier job is returned with `replayed` set to true and no new job is started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJob' }
        '202':
          description: Job dispatched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: No eligible pod, capability mismatch, retired or inactive version, or dispatch failure.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Work packet exceeds the size limit.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Packet failed schema validation (`errors` lists `{path, message}` per failing JSON pointer), or the body has unknown fields (`unknown_fields`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Job dispatcher not wired.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{project_id}/rpa/jobs:
    parameters:
      - $ref: '#/components/parameters/RpaProjectRefParam'
    get:
      tags: [rpa]
      summary: List a project's RPA jobs, newest first.
      operationId: rpa_jobs_list
      parameters:
        - in: query
          name: spec_id
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/RpaJobStatus' }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Jobs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJobList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/rpa/jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/RpaProjectRefParam'
      - $ref: '#/components/parameters/RpaJobIdParam'
    get:
      tags: [rpa]
      summary: Read an RPA job (packet redacted).
      operationId: rpa_jobs_read
      responses:
        '200':
          description: Job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/rpa/jobs/{job_id}/logs:
    parameters:
      - $ref: '#/components/parameters/RpaProjectRefParam'
      - $ref: '#/components/parameters/RpaJobIdParam'
    get:
      tags: [rpa]
      summary: Read the job's streamed output.
      operationId: rpa_jobs_logs
      parameters:
        - in: query
          name: tail
          schema: { type: integer, minimum: 0 }
          description: Keep only the last N lines.
      responses:
        '200':
          description: Log text assembled from `rpa.process.v1` progress frames.
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status, text]
                properties:
                  job_id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/RpaJobStatus' }
                  text: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/rpa/jobs/{job_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RpaProjectRefParam'
      - $ref: '#/components/parameters/RpaJobIdParam'
    post:
      tags: [rpa]
      summary: Cancel an active RPA job.
      operationId: rpa_jobs_cancel
      responses:
        '200':
          description: Cancelled job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpaJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------------------
  # ui-profile -- 9-ui-profiles (Phase 11)
  # ---------------------------------------------------------------------------

  /admin/ui-profile:
    get:
      tags: [ui-profile]
      summary: Read the deployment UI profile.
      operationId: ui_profile_read
      description: Requires `system:ui.profile.manage`.
      responses:
        '200':
          description: Deployment surfaces.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiProfileDeployment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [ui-profile]
      summary: Set the deployment UI profile.
      operationId: ui_profile_update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UiSurfacesRequest' }
      responses:
        '200':
          description: Updated deployment surfaces.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiProfileDeployment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /me/preferences/ui.surfaces:
    get:
      tags: [me, ui-profile]
      summary: Read the caller's surface override.
      operationId: me_ui_surfaces_read
      responses:
        '200':
          description: Override, effective, and deployment surfaces.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiSurfacesPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [me, ui-profile]
      summary: Save the caller's surface override.
      operationId: me_ui_surfaces_update
      description: The effective set is the override intersected with the deployment surfaces; an empty intersection falls back to the deployment set and flags `override_reset`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UiSurfacesRequest' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiSurfacesPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [me, ui-profile]
      summary: Remove the caller's override (use the deployment default).
      operationId: me_ui_surfaces_delete
      responses:
        '200':
          description: Reset to the deployment default.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiSurfacesPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }


components:

  securitySchemes:
    pychestrate_session:
      type: apiKey
      in: cookie
      name: pych_session
      description: |
        HMAC-signed session cookie issued by the local-login flow at
        `/login` (HTML form, not part of the REST surface). The
        webworks `PychestrateSessionMiddleware` resolves this cookie
        to a request-scoped actor on every request.
    pychestrate_bearer:
      type: http
      scheme: bearer
      description: |
        An API token (`pyc_...`) sent as `Authorization: Bearer <token>`.
        Personal tokens are issued at Account > API tokens (or
        `POST /me/api-tokens`); service-account tokens by an
        administrator at Admin > API Tokens. A token acts with its
        account's permissions (never more; a `read-only` token only
        reads), expires, and can be revoked. Also accepted on the MCP
        endpoint.
    pychestrate_api_key:
      type: apiKey
      in: header
      name: X-Pychestrate-Api-Key
      description: |
        The same API token as `pychestrate_bearer`, sent in the
        `X-Pychestrate-Api-Key` header instead.
    pychestrate_mtls:
      type: mutualTLS
      description: |
        Mutual TLS using the client certificate issued by
        `POST /enrollment-tokens/redeem`. Required on every endpoint
        the pod client agent calls (`dispatch-ack`, `progress`,
        `results/complete`, plus any future client-pull endpoints).

  parameters:

    PageParam:
      in: query
      name: page
      description: One-based page index for paginated list endpoints.
      schema: { type: integer, minimum: 1, default: 1 }
    PerPageParam:
      in: query
      name: per_page
      description: Page size for paginated list endpoints.
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    UserIdParam:
      in: path
      name: user_id
      required: true
      schema: { type: string, format: uuid }
    ApiTokenIdParam:
      in: path
      name: token_id
      required: true
      schema: { type: string, format: uuid }
    ProjectIdParam:
      in: path
      name: project_id
      required: true
      schema: { type: string, format: uuid }
    ProjectSlugParam:
      in: path
      name: slug
      required: true
      description: Project slug — kebab-case, globally unique.
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
    ClientIdParam:
      in: path
      name: client_id
      required: true
      schema: { type: string, format: uuid }
    PodIdParam:
      in: path
      name: pod_id
      required: true
      schema: { type: string, format: uuid }
    ReleaseProjectIdParam:
      in: path
      name: project_id
      required: true
      description: >
        Integer id of a project in the consumer web UI's project store
        (the release-template routes key on it, not on a slug).
      schema: { type: integer, minimum: 1 }
    ReleaseTemplateIdParam:
      in: path
      name: template_id
      required: true
      schema: { type: integer, minimum: 1 }
    RunIdParam:
      in: path
      name: run_id
      required: true
      schema: { type: string, format: uuid }
    FlagKeyParam:
      in: path
      name: flag_key
      required: true
      schema: { type: string }
    VariableScopeParam:
      in: path
      name: scope
      required: true
      description: Variable scope kind.
      schema:
        type: string
        enum: [global, project, pod, run]
    VariableScopeIdParam:
      in: path
      name: scope_id
      required: true
      schema: { type: string }
    EntityKindParam:
      in: path
      name: entity_kind
      required: true
      description: Type of entity the tag is attached to.
      schema:
        type: string
        enum: [project, pod, client, run, resource, artifact, run_artifact]
    EntityIdParam:
      in: path
      name: entity_id
      required: true
      schema: { type: string }

    RpaTypeIdParam:
      in: path
      name: type_id
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{2,63}$' }
      description: RPA job type slug.
    RpaVersionParam:
      in: path
      name: version
      required: true
      schema: { type: string }
    RpaSpecIdParam:
      in: path
      name: spec_id
      required: true
      schema: { type: string, format: uuid }
    RpaJobIdParam:
      in: path
      name: job_id
      required: true
      schema: { type: string, format: uuid }
    RpaProjectRefParam:
      in: path
      name: project_id
      required: true
      schema: { type: string }
      description: Project reference -- an orchestration project UUID or a consumer-UI integer project id.
  responses:
    BadRequest:
      description: Request was malformed or failed validation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Caller is not authenticated.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Caller is authenticated but lacks the required permission.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Target resource was not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Request was well-formed but semantically invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: The target resource is no longer available.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: The caller is over its request budget; wait and retry.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Request body exceeds the server-side size cap.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Server-side dependency unavailable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    # ----------------------------------------------------------------
    # system
    # ----------------------------------------------------------------

    SystemHealth:
      type: object
      required: [status, generated_at]
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          description: Worst subsystem status.
        version:
          type: string
          description: The running service release (`pyproject.toml`). Present with `subsystems`, not in the restricted form.
        generated_at: { type: string, format: date-time }
        details:
          type: string
          enum: [restricted]
          description: Present (instead of `subsystems`) for callers without system:ui.admin.view.
        subsystems:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              label: { type: string }
              status: { type: string, enum: [ok, degraded, error] }
              detail: { type: string }
              backends:
                type: array
                description: The individual checks inside the subsystem, when it has them.
                items:
                  type: object
                  required: [name, status]
                  properties:
                    name: { type: string, description: Stable identifier. }
                    label: { type: string, description: What the check is called for people. }
                    status: { type: string, enum: [ok, degraded, error] }
                    reason: { type: string }

    # ----------------------------------------------------------------
    # Error / pagination envelopes
    # ----------------------------------------------------------------

    Problem:
      type: object
      description: |
        RFC 7807 Problem Document. Every 4xx / 5xx response in this API
        is served as `application/problem+json` with this shape.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem class (`about:blank` for generic statuses).
          default: about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code generated by the origin server.
        detail:
          type: string
          description: Occurrence-specific explanation.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this specific occurrence.

    PageMeta:
      type: object
      description: Pagination metadata returned alongside every paged `items` array.
      required: [page, per_page, total]
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total:
          type: integer
          minimum: 0
          description: Total number of items across all pages (when known).
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page (when cursor-based).

    # ----------------------------------------------------------------
    # auth / me
    # ----------------------------------------------------------------

    LogoutRequest:
      type: object
      required: [session_id]
      properties:
        session_id: { type: string }
    LogoutResponse:
      type: object
      required: [session_id, status]
      properties:
        session_id: { type: string }
        status:
          type: string
          enum: [closed]

    MeIdentity:
      type: object
      required: [user_id, login_name, account_kind, authentication]
      properties:
        user_id: { type: string, format: uuid }
        login_name: { type: string }
        display_name: { type: string }
        primary_email: { type: string }
        status: { type: string, enum: [ACTIVE, DEACTIVATED, PENDING] }
        account_kind: { type: string, enum: [user, service_account] }
        authentication:
          type: object
          required: [method]
          properties:
            method: { type: string, enum: [session, api_token] }
            token_id: { type: string, format: uuid }
            token_name: { type: string }
            token_scope: { type: string, enum: [read-write, read-only] }
            token_expires_at: { type: string, format: date-time }

    ApiTokenCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: What the token is for.
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 366
          default: 90
          description: Every token expires.
        scope:
          type: string
          enum: [read-write, read-only]
          default: read-write
          description: |
            `read-write` acts with every permission the account holds;
            `read-only` additionally refuses every non-GET/HEAD/OPTIONS
            request with 403.

    ApiToken:
      type: object
      required: [token_id, user_id, name, token_hint, scope, status, expires_at]
      properties:
        token_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        login_name: { type: string }
        is_service_account: { type: boolean }
        name: { type: string }
        token_hint:
          type: string
          description: The token's first characters (`pyc_` + 6), for recognition only.
        scope: { type: string, enum: [read-write, read-only] }
        status: { type: string, enum: [active, expired, revoked] }
        created_at: { type: string, format: date-time }
        created_by_user_id: { type: [string, 'null'], format: uuid }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }

    IssuedApiToken:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The secret. Returned only in this response; store it now.

    ApiTokenList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiToken' }
        total: { type: integer }

    ServiceAccountCreateRequest:
      type: object
      required: [login_name]
      properties:
        login_name:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,62}$'
        display_name: { type: string }

    ServiceAccount:
      type: object
      required: [user_id, login_name, status, active_token_count]
      properties:
        user_id: { type: string, format: uuid }
        login_name: { type: string }
        display_name: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        active_token_count: { type: integer }

    ServiceAccountList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ServiceAccount' }
        total: { type: integer }

    MePermissions:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          description: Every permission key the caller holds, sorted.
          items: { type: string }

    MeNavigation:
      type: object
      required: [groups]
      description: |
        Permission-filtered navigation manifest. Only groups and
        entries the calling actor may see are present.
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/NavManifestGroup' }

    NavManifestGroup:
      type: object
      required: [group_id, label, entries]
      properties:
        group_id: { type: string }
        label: { type: string }
        icon:
          type: string
          nullable: true
        required_permissions:
          type: array
          items: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/NavManifestEntry' }

    NavManifestEntry:
      type: object
      required: [entry_id, label, route]
      properties:
        entry_id: { type: string }
        label: { type: string }
        route: { type: string }
        icon:
          type: string
          nullable: true
        required_permissions:
          type: array
          items: { type: string }

    # ----------------------------------------------------------------
    # users / rbac
    # ----------------------------------------------------------------

    User:
      type: object
      required: [user_id, username, status, created_at]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        email: { type: string, format: email }
        status:
          type: string
          enum: [active, suspended, deleted]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserCreateRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }
        display_name: { type: string }
        email: { type: string, format: email }
        initial_password:
          type: string
          description: Optional initial password for local-auth users.

    RbacPermission:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    RbacRole:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
    RbacRoleBinding:
      type: object
      required: [binding_id, user_id, role_name]
      properties:
        binding_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role_name: { type: string }
        project_id:
          type: string
          format: uuid
          nullable: true
          description: Project scope of the binding; `null` for site-wide bindings.
        created_at: { type: string, format: date-time }
    RbacRoleBindingCreateRequest:
      type: object
      required: [user_id, role_name]
      properties:
        user_id: { type: string, format: uuid }
        role_name: { type: string }
        project_id:
          type: string
          format: uuid
          nullable: true
    RbacCheckRequest:
      type: object
      required: [principal_id, permission_key]
      properties:
        principal_id:
          type: string
          format: uuid
          description: The account to check. Required; the check does not default to the caller.
        permission_key:
          type: string
          description: "`system:<action>` or `project:<project_id>:<action>`."
          example: system:runs.read
    RbacCheckResponse:
      type: object
      required: [allowed, reason, permission_key]
      properties:
        allowed: { type: boolean }
        reason:
          type: string
          description: Why (for example `binding_allow`).
        permission_key: { type: string }

    # ----------------------------------------------------------------
    # audit
    # ----------------------------------------------------------------

    AuditRecord:
      type: object
      description: One entry in the tamper-evident audit log.
      required: [sequence_number, record_id, kind, written_at]
      properties:
        sequence_number: { type: integer, minimum: 0 }
        record_id: { type: string, format: uuid }
        kind:
          type: string
          description: 'What happened (e.g. `audit.api_token.created`).'
        source_topic:
          type: string
          description: 'The internal event that produced the record (e.g. `entity.api_token.created`).'
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        target_ref:
          type: string
          nullable: true
          description: 'What it happened to, as `kind:id` (e.g. `api_token:<uuid>`).'
        payload_json:
          type: object
          additionalProperties: true
          description: Event-specific details.
        record_hash_hex:
          type: string
          description: Hash that chains this record to the one before it.
        written_at: { type: string, format: date-time }

    # ----------------------------------------------------------------
    # secrets
    # ----------------------------------------------------------------

    SecretScopeKind:
      type: string
      description: >-
        Ownership scope of a secret. `ORG` is service-wide; `PROJECT`
        is bound to a project_id; `USER` is a personal secret bound to
        a user_id.
      enum: [ORG, PROJECT, USER]

    Secret:
      type: object
      description: >-
        Secret metadata. NEVER carries the secret value — use the
        dedicated value-read endpoint for plaintext.
      required: [secret_ref, backend_name, scope_kind, created_at, updated_at]
      properties:
        secret_ref:
          type: string
          description: Canonical secret reference (e.g. `vault/myteam/api-token`).
        backend_name: { type: string }
        scope_kind: { $ref: '#/components/schemas/SecretScopeKind' }
        scope_ref:
          type: string
          nullable: true
          description: >-
            The project_id (PROJECT scope) or user_id (USER scope);
            null for ORG-scoped secrets.
        current_version_id:
          type: string
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SecretCreateRequest:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          description: Canonical secret reference for the new secret.
        scope_kind:
          allOf: [ { $ref: '#/components/schemas/SecretScopeKind' } ]
          default: ORG
        scope_ref:
          type: string
          nullable: true
          description: >-
            Required for PROJECT / USER scope (project_id or user_id);
            must be omitted / null for ORG scope.
        value:
          type: string
          description: The plaintext secret value. KEK-encrypted at rest.

    SecretUpdateRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: The new plaintext secret value. KEK-encrypted at rest.

    SecretValue:
      type: object
      description: >-
        The decrypted secret value. Returned ONLY by the value-read
        endpoint, ONLY to authorized callers, and the read is audited.
      required: [secret_ref, version_number, value]
      properties:
        secret_ref: { type: string }
        version_number: { type: integer }
        value: { type: string }

    # ----------------------------------------------------------------
    # variables
    # ----------------------------------------------------------------

    Variable:
      type: object
      required: [name, scope, scope_id, value_type, value]
      properties:
        name: { type: string }
        scope:
          type: string
          enum: [global, project, pod, run]
        scope_id: { type: string }
        value_type:
          type: string
          enum: [string, integer, float, boolean, json, secret_ref]
        value: {}
        description: { type: string }
        sensitive: { type: boolean, default: false }
        updated_at: { type: string, format: date-time }
    VariableUpsertRequest:
      type: object
      required: [value_type, value]
      properties:
        value_type:
          type: string
          enum: [string, integer, float, boolean, json, secret_ref]
        value: {}
        description: { type: string }
        sensitive: { type: boolean, default: false }
    VariableEffectiveSet:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VariableEffectiveEntry' }
    VariableEffectiveEntry:
      type: object
      required: [name, value_type, value, resolved_from]
      properties:
        name: { type: string }
        value_type:
          type: string
          enum: [string, integer, float, boolean, json, secret_ref]
        value: {}
        resolved_from:
          type: string
          enum: [global, project, pod, run]
          description: Scope that won inheritance for this variable.

    # ----------------------------------------------------------------
    # flags
    # ----------------------------------------------------------------

    FeatureFlag:
      type: object
      required: [flag_key, enabled, created_at]
      properties:
        flag_key: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        rollout_percent:
          type: integer
          minimum: 0
          maximum: 100
        retired: { type: boolean, default: false }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FeatureFlagCreateRequest:
      type: object
      required: [flag_key]
      properties:
        flag_key: { type: string }
        description: { type: string }
        enabled: { type: boolean, default: false }
        rollout_percent: { type: integer, minimum: 0, maximum: 100 }
    FeatureFlagUpdateRequest:
      type: object
      properties:
        description: { type: string }
        enabled: { type: boolean }
        rollout_percent: { type: integer, minimum: 0, maximum: 100 }
    FeatureFlagBackend:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        active: { type: boolean }
    FeatureFlagHistoryEntry:
      type: object
      required: [recorded_at, action]
      properties:
        recorded_at: { type: string, format: date-time }
        actor_id:
          type: string
          format: uuid
          nullable: true
        action: { type: string }
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
    FeatureFlagEvaluateRequest:
      type: object
      properties:
        context:
          type: object
          additionalProperties: true
          description: Evaluation context bag (user_id, project_id, attrs).
    FeatureFlagEvaluateResponse:
      type: object
      required: [flag_key, value]
      properties:
        flag_key: { type: string }
        value: { type: boolean }
        reason: { type: string }

    # ----------------------------------------------------------------
    # tagging
    # ----------------------------------------------------------------

    Tag:
      type: object
      required: [tag, entity_kind, entity_id]
      properties:
        tag: { type: string }
        entity_kind: { type: string }
        entity_id: { type: string }
        taxonomy: { type: string }
        attached_at: { type: string, format: date-time }
    TagAttachRequest:
      type: object
      required: [tag]
      properties:
        tag: { type: string }
        taxonomy: { type: string }
    TagTaxonomy:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    # ----------------------------------------------------------------
    # retention
    # ----------------------------------------------------------------

    RetentionPolicy:
      type: object
      required: [policy_id, name, data_class, action, status, created_at]
      properties:
        policy_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        data_class: { type: string }
        action:
          type: string
          enum: [archive, cold_tier, delete, custom]
        retention_period_days: { type: integer, minimum: 0 }
        status:
          type: string
          enum: [draft, published, archived]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RetentionPolicyCreateRequest:
      type: object
      required: [name, data_class, action]
      properties:
        name: { type: string }
        description: { type: string }
        data_class: { type: string }
        action:
          type: string
          enum: [archive, cold_tier, delete, custom]
        retention_period_days: { type: integer, minimum: 0 }

    # ----------------------------------------------------------------
    # notifications
    # ----------------------------------------------------------------

    NotificationChannel:
      type: object
      required: [channel_id, name, kind, scope_level, disabled, created_at]
      properties:
        channel_id: { type: string, format: uuid }
        name: { type: string }
        kind:
          type: string
          enum: [smtp_email, slack_webhook, ms_teams_webhook, pagerduty_events_v2, generic_webhook]
        scope_level:
          type: string
          enum: [SYSTEM, PROJECT]
        project_id: { type: [string, 'null'], format: uuid }
        disabled: { type: boolean }
        config:
          type: object
          description: >-
            The channel's settings. A secret setting is its `secret://` reference; a
            secret still held as plain text (a channel made before secrets moved to the
            vault) is masked.
          additionalProperties: true
        unprotected_secret_fields:
          type: array
          description: Secret settings still held as plain text; replace each with `PATCH` and `secrets`.
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotificationChannelCreateRequest:
      type: object
      required: [name, kind, scope_level]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [smtp_email, slack_webhook, ms_teams_webhook, pagerduty_events_v2, generic_webhook]
        scope_level:
          type: string
          enum: [SYSTEM, PROJECT]
        project_id:
          type: [string, 'null']
          format: uuid
          description: Required when `scope_level` is PROJECT.
        config:
          type: object
          description: >-
            The plain settings, and `secret://<name>` references to existing vault secrets.
          additionalProperties: true
        secrets:
          type: object
          description: A new value for each secret setting; stored in the secrets vault.
          additionalProperties: { type: string }
    NotificationRoutingRule:
      type: object
      required: [rule_id, event_pattern, template_name, channel_ids, recipients, disabled]
      properties:
        rule_id: { type: string, format: uuid }
        project_id: { type: [string, 'null'], format: uuid }
        event_pattern:
          type: string
          example: entity.run.failed
        template_name:
          type: string
          example: run_failed
        channel_ids:
          type: array
          items: { type: string, format: uuid }
        recipients:
          type: array
          items: { type: string }
        rate_limit_per_minute: { type: [integer, 'null'] }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotificationRoutingRuleCreateRequest:
      type: object
      required: [event_pattern, template_name, channel_ids, recipients]
      properties:
        event_pattern:
          type: string
          description: >-
            The event to be told about, `entity.run.failed` or `entity.run.completed`,
            or a glob such as `entity.run.*`.
        template_name:
          type: string
          description: The message template, `run_failed` or `run_succeeded`.
        channel_ids:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, format: uuid }
        recipients:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string }
          description: Addresses the channel understands (email addresses for an email channel).
        project_id:
          type: string
          format: uuid
          description: Only this project's runs; leave out for every project.
        rate_limit_per_minute:
          type: integer
          minimum: 1
          maximum: 10000
          description: At most this many messages per minute from this rule in one worker; leave out for no limit.

    # ----------------------------------------------------------------
    # project_templates
    # ----------------------------------------------------------------

    ProjectTemplate:
      type: object
      required: [template_id, name]
      properties:
        template_id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        provided_by: { type: string }

    # ----------------------------------------------------------------
    # projects
    # ----------------------------------------------------------------

    Project:
      type: object
      required: [project_id, slug, display_name, state, created_at]
      properties:
        project_id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        description: { type: string }
        owning_group_id:
          type: string
          format: uuid
          nullable: true
        template_id:
          type: string
          nullable: true
        template_version:
          type: string
          nullable: true
        state:
          type: string
          enum: [ACTIVE, ARCHIVED]
        extension_fields:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at:
          type: string
          format: date-time
          nullable: true
    ProjectCreateRequest:
      type: object
      required: [slug, display_name]
      properties:
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
        display_name: { type: string }
        description: { type: string }
        owning_group_id:
          type: string
          format: uuid
          nullable: true
        template_id:
          type: string
          nullable: true
        template_version:
          type: string
          nullable: true
    ProjectPatchRequest:
      type: object
      properties:
        display_name: { type: string }
        description: { type: string }
        extension_fields:
          type: object
          additionalProperties: true
    ProjectMember:
      type: object
      required: [user_id, role_bindings]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role_bindings:
          type: array
          items: { $ref: '#/components/schemas/RbacRoleBinding' }
    ProjectMemberAddRequest:
      type: object
      required: [user_id, role_name]
      properties:
        user_id: { type: string, format: uuid }
        role_name: { type: string }
    ProjectPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ----------------------------------------------------------------
    # clients / enrollment / agents
    # ----------------------------------------------------------------

    Client:
      type: object
      description: An enrolled pod client.
      required: [client_id, pod_name, status, liveness_state, enrolled_at]
      properties:
        client_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        pod_name: { type: string }
        status:
          type: string
          description: Enrollment lifecycle. A revoked client stays listed.
          enum: [ACTIVE, SUSPENDED, REVOKED]
        liveness_state:
          type: string
          description: >-
            Driven by heartbeats: `ALIVE` after enrollment, `DEGRADED` after
            missed heartbeats, `LOST` once the pod has been unreachable past
            the configured threshold.
          enum: [ALIVE, DEGRADED, LOST]
        enrolled_at: { type: string, format: date-time }
        last_seen:
          type: string
          format: date-time
          nullable: true
        last_agent_version:
          type: string
          nullable: true
        transport_name:
          type: string
          nullable: true
        degraded_at:
          type: string
          format: date-time
          nullable: true
        revision_token:
          type: string
          description: Opaque token identifying the current version of the client's attributes.
        attributes:
          type: object
          additionalProperties: true
    ClientRevokeRequest:
      type: object
      properties:
        reason: { type: string }
    ClientAttributesUpdateRequest:
      type: object
      required: [attributes]
      properties:
        attributes:
          type: object
          additionalProperties: true
    ClientInventory:
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Client' }
        generated_at: { type: string, format: date-time }
    ClientCapabilities:
      type: object
      required: [client_id, capabilities, advertised_at]
      properties:
        client_id: { type: string, format: uuid }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/CapabilityEntry' }
        advertised_at: { type: string, format: date-time }
    CapabilityAdvertisement:
      type: object
      required: [kind]
      properties:
        kind: { type: string, description: Registered capability kind name. }
        value: { description: Kind-specific value validated by the kind's schema. }
        revision_token: { type: string }
        updated_at: { type: [string, 'null'], format: date-time }
    CapabilityAdvertisementRequest:
      type: object
      required: [advertisements]
      properties:
        advertisements:
          type: array
          items: { $ref: '#/components/schemas/CapabilityAdvertisement' }
    CapabilityEntry:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          description: Capability kind name (resolves a `CapabilityKindExtension`).
        name: { type: string }
        version: { type: string }
        attributes:
          type: object
          additionalProperties: true

    EnrollmentToken:
      type: object
      required: [token_id, created_at]
      properties:
        token_id: { type: string, format: uuid }
        description: { type: string }
        expires_at:
          type: string
          format: date-time
          nullable: true
        max_redemptions: { type: integer, minimum: 1 }
        redeemed_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        revoked_at:
          type: string
          format: date-time
          nullable: true
    EnrollmentTokenCreateRequest:
      type: object
      required: [project_id, pod_name, ttl_seconds]
      properties:
        project_id:
          type: string
          format: uuid
          description: Project the enrolled pod belongs to.
        pod_name:
          type: string
          description: |
            Pod name the token commits to; the pod must enroll with the
            same name (`pychestrate-client enroll --name`).
        ttl_seconds:
          type: integer
          minimum: 1
          description: Lifetime in seconds (capped by the service).
        one_shot:
          type: boolean
          default: true
          description: Consume the token on its first redemption.
    EnrollmentTokenIssued:
      type: object
      required: [token_id, secret, project_id, pod_name, expires_at, algorithm_name]
      properties:
        token_id: { type: string, format: uuid }
        secret:
          type: string
          description: One-time bootstrap secret, returned only at issuance.
        project_id: { type: string, format: uuid }
        pod_name: { type: string }
        expires_at: { type: string, format: date-time }
        algorithm_name: { type: string }
        warnings:
          type: array
          items: { type: string }
          description: |
            Operator-facing warnings about the token. Present (non-empty)
            when a client that is not revoked still holds the pod name in
            this project: redeeming the token is refused with 409 until
            that client is revoked.
    EnrollmentRedeemRequest:
      type: object
      required: [bootstrap_secret, csr_pem]
      properties:
        bootstrap_secret: { type: string }
        csr_pem:
          type: string
          description: PEM-encoded PKCS#10 certificate signing request.
        display_name: { type: string }
        attributes:
          type: object
          additionalProperties: true
    EnrollmentRedeemResponse:
      type: object
      required: [client_id, client_certificate_pem, ca_chain_pem]
      properties:
        client_id: { type: string, format: uuid }
        client_certificate_pem:
          type: string
          description: |
            The issued client certificate as PEM text (not base64). Its
            Subject CN, and a `urn:uuid:` URI subject alternative name,
            carry `client_id` -- the identity the pod-facing routes
            compare with the `client_id` in their path. Empty when the
            request carried no CSR.
        ca_chain_pem:
          type: string
          description: |
            PEM text of the enrollment CA certificate that issued the
            client certificate. The TLS terminator in front of the
            service must trust this CA to accept the pod's certificate.
        not_after: { type: string, format: date-time }
        envelope_signing_keys:
          description: |
            The JWKS-style Ed25519 public-key set the service signs job
            envelopes with, bundled here so a freshly-enrolled client
            can verify signed envelopes without an extra call to
            `GET /envelope-signing-keys`. Empty when no signing key is
            provisioned; the client should refresh via the dedicated
            endpoint in that case.
          type: array
          items: { $ref: '#/components/schemas/SigningKey' }

    SigningKey:
      type: object
      description: |
        A single Ed25519 public key in the envelope-signing key set.
        Only the public half is ever serialized — the private signing
        key never leaves the service process.
      required: [key_id, algorithm, public_key_pem, status]
      properties:
        key_id:
          type: string
          description: JWKS-style identifier referenced by each signed envelope.
        algorithm:
          type: string
          enum: [Ed25519]
        public_key_pem:
          type: string
          description: PEM-encoded SubjectPublicKeyInfo public key.
        status:
          type: string
          description: |
            `active` — the key currently signing envelopes.
            `retiring` — a previous-generation key kept verifiable
            through the rotation grace window.
          enum: [active, retiring]

    SigningKeySet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: '#/components/schemas/SigningKey' }

    JsonWebKey:
      type: object
      description: |
        One Ed25519 verification key as an RFC 7517 JWK using the
        RFC 8037 `OKP` key type. Only the public half is ever
        serialized — the private `d` member is never emitted.
      required: [kty, crv, x, kid, use, alg]
      properties:
        kty:
          type: string
          description: CFRG octet key pair (RFC 8037 §2).
          enum: [OKP]
        crv:
          type: string
          enum: [Ed25519]
        x:
          type: string
          description: |
            The raw 32-byte public key in base64url with trailing
            `=` padding stripped (RFC 7515 §2).
        kid:
          type: string
          description: |
            The identifier a signed envelope carries in its `key_id`
            claim. Clients resolve an envelope's key by exact match.
        use:
          type: string
          enum: [sig]
        alg:
          type: string
          description: |
            The JOSE signature algorithm (RFC 8037 §3.1). `EdDSA`,
            not `Ed25519` — the curve travels in `crv`.
          enum: [EdDSA]

    JsonWebKeySet:
      type: object
      description: |
        RFC 7517 JWK Set. `keys[0]` is always the active signing key;
        rotation grace-window keys follow in `kid` order.
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: '#/components/schemas/JsonWebKey' }

    AgentRollout:
      type: object
      required: [rollout_id, status, created_at]
      properties:
        rollout_id: { type: string, format: uuid }
        agent_version: { type: string }
        targeting:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [draft, scheduled, running, completed, halted]
        created_at: { type: string, format: date-time }
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
    AgentRolloutCreateRequest:
      type: object
      required: [agent_version]
      properties:
        agent_version: { type: string }
        targeting:
          type: object
          additionalProperties: true

    # ----------------------------------------------------------------
    # pods
    # ----------------------------------------------------------------

    PodDefinition:
      type: object
      required: [pod_id, project_id, name, created_at]
      properties:
        pod_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        members:
          type: array
          items: { $ref: '#/components/schemas/PodMember' }
        attributes:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PodDefinitionCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        members:
          type: array
          items: { $ref: '#/components/schemas/PodMember' }
        attributes:
          type: object
          additionalProperties: true
    PodMember:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind:
          type: string
          description: Pod-member kind name (resolves a `PodMemberKindExtension`).
        attributes:
          type: object
          additionalProperties: true
    PodState:
      type: object
      required: [pod_id, state, updated_at]
      properties:
        pod_id: { type: string, format: uuid }
        state:
          type: string
          enum:
            - declared
            - provisioning
            - registering
            - ready
            - busy
            - draining
            - offline
            - error
            - retired
        updated_at: { type: string, format: date-time }
        last_message: { type: string }
    PodStateTransition:
      type: object
      required: [pod_id, from_state, to_state, occurred_at]
      properties:
        pod_id: { type: string, format: uuid }
        from_state: { type: string }
        to_state: { type: string }
        occurred_at: { type: string, format: date-time }
        actor_id:
          type: string
          format: uuid
          nullable: true
        reason: { type: string }
    PodRegistration:
      type: object
      required: [pod_id, client_id, registered_at]
      properties:
        pod_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        registered_at: { type: string, format: date-time }
        attributes:
          type: object
          additionalProperties: true
    PodTopology:
      type: object
      required: [pod_id, members, links]
      properties:
        pod_id: { type: string, format: uuid }
        members:
          type: array
          items: { $ref: '#/components/schemas/PodMember' }
        links:
          type: array
          items: { $ref: '#/components/schemas/PodTopologyLink' }
    PodTopologyLink:
      type: object
      required: [from_member, to_member, kind]
      properties:
        from_member: { type: string }
        to_member: { type: string }
        kind: { type: string }
        attributes:
          type: object
          additionalProperties: true
    PodTemplate:
      type: object
      required: [template_id, project_id, name]
      properties:
        template_id: { type: string }
        project_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        parameters:
          type: object
          additionalProperties: true
    PodTemplateCreateRequest:
      type: object
      required: [template_id, name]
      properties:
        template_id: { type: string }
        name: { type: string }
        description: { type: string }
        parameters:
          type: object
          additionalProperties: true
    PodTemplateMaterializeRequest:
      type: object
      properties:
        name:
          type: string
          description: Optional name override for the materialized pod.
        parameters:
          type: object
          additionalProperties: true

    # ----------------------------------------------------------------
    # plugin_api
    # ----------------------------------------------------------------

    PluginApiProtocol:
      type: object
      required: [protocol_name]
      properties:
        protocol_name: { type: string }
        description: { type: string }
        schema_version: { type: string }
        implementations:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              precedence: { type: integer }
              package: { type: string }
    PluginApiMount:
      type: object
      required: [mount_path]
      properties:
        mount_path: { type: string }
        extension_name: { type: string }
        capabilities:
          type: array
          items: { type: string }

    ExtensionPack:
      type: object
      description: What became of one installed extension pack at startup.
      required: [name, target, loaded, error]
      properties:
        name:
          type: string
          description: "The entry point's name in the pack's pyproject.toml."
        target:
          type: string
          description: "The `module:attribute` the entry point names."
        loaded: { type: boolean }
        error:
          type: string
          description: "The failure, as `ExceptionType: message`, when the pack did not load; empty when it did."

    ExtensionRoute:
      type: object
      description: One route an extension contributes under /api/v1/ext.
      required: [ext_name, method, path_suffix, full_path, mounted]
      properties:
        ext_name: { type: string }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        path_suffix: { type: string }
        full_path: { type: string }
        handler_class: { type: string }
        required_permissions:
          type: array
          items: { type: string }
        required_capabilities:
          type: array
          items: { type: string }
        description: { type: string }
        mounted:
          type: boolean
          description: Whether the host mounted the route (its extension names a handler).

    # ----------------------------------------------------------------
    # embed (8-embeddable-views)
    # ----------------------------------------------------------------

    EmbedViewKind:
      type: object
      description: One row in the fixed embeddable-views catalog.
      required: [view_kind, component_tag, declared_read_scope, supports_anonymous]
      properties:
        view_kind:
          type: string
          description: Stable identifier in URLs and audit records.
        component_tag:
          type: string
          description: Layer 9 WebComponent tag the embed renderer hosts.
        declared_read_scope:
          type: array
          items: { type: string }
          description: Permission keys the embed's inline token is scoped to.
        supports_anonymous:
          type: boolean
          description: True iff the kind tolerates anonymous (kiosk) access.
    EmbedSignRequest:
      type: object
      description: >-
        Optional issuance inputs. Absent fields default: `resource_id`
        to the view key, `audience` to the calling principal's email,
        `ttl_seconds` to 3600 (capped at 86400).
      properties:
        resource_id: { type: string }
        audience: { type: string }
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 86400
    EmbedSignedUrl:
      type: object
      description: A minted signed embed URL plus ready-to-paste snippets.
      required:
        - url
        - key_id
        - expires_unix
        - expires_at
        - ttl_seconds
        - view_kind
        - resource_id
        - audience
        - iframe_snippet
        - webcomponent_snippet
      properties:
        url:
          type: string
          description: The fully-rendered signed `/embed/...` URL.
        key_id: { type: string }
        expires_unix: { type: integer }
        expires_at:
          type: string
          format: date-time
        ttl_seconds: { type: integer }
        view_kind: { type: string }
        resource_id: { type: string }
        audience: { type: string }
        iframe_snippet:
          type: string
          description: Ready-to-paste `<iframe>` snippet.
        webcomponent_snippet:
          type: string
          description: Ready-to-paste WebComponent snippet.

    # ----------------------------------------------------------------
    # JobEnvelope (planned — surfaced as a referenced schema, not a top-
    # level operation body, because it travels as the payload of a
    # signed dispatch and is not POST'd as JSON by clients of the
    # public REST surface.)
    # ----------------------------------------------------------------

    JobEnvelope:
      type: object
      description: |
        Canonical dispatch envelope. Matches the dataclass in
        `source/site/ccai/pychestrate/webservice/jobs/envelope/schema.py`.
        Serialized with RFC 8785 (JCS) canonical JSON; consumers MUST
        verify against the declared `schema_version`
        (current: `2026-04-24`).
      required:
        - schema_version
        - envelope_id
        - issued_at
        - issuer
        - project_id
        - job_id
        - job_name
        - job_type
        - run_id
        - client_id
        - pod_id
        - refs
        - params
        - scoped_secrets
        - results
        - forwarding
        - deadline
        - extension_claims
      properties:
        schema_version: { type: string }
        envelope_id: { type: string }
        issued_at: { type: string, format: date-time }
        issuer: { type: string }
        project_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        job_name: { type: string }
        job_type: { type: string }
        job_kind:
          type: string
          enum: [test, build, provision]
          default: test
          description: |
            Job-class discriminator. The client branches on this
            before resolving the kind-specific runner; `params` then
            carries the kind-specific payload. Optional for backward
            compatibility -- envelopes that omit it are treated as
            `test`.
        pipeline:
          nullable: true
          $ref: '#/components/schemas/JobPipelineRef'
        source:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/JobSourceRef'
          description: |
            Structured source-integration reference for a build job.
            `null` on envelopes that carry no resolved source
            integration (test / provision jobs, or build jobs that
            fall back to the client's `runner_inputs.git_url`
            convention). Optional for backward compatibility --
            envelopes minted before the structured source block was
            introduced omit it entirely and parse with `source` null.
        run_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        pod_id: { type: string, format: uuid }
        refs: { $ref: '#/components/schemas/JobRefs' }
        params:
          type: object
          additionalProperties: true
        scoped_secrets:
          type: array
          items: { $ref: '#/components/schemas/ScopedSecret' }
        results: { $ref: '#/components/schemas/JobResultsLocator' }
        forwarding: { $ref: '#/components/schemas/JobForwardingInfo' }
        deadline: { $ref: '#/components/schemas/JobDeadline' }
        extension_claims:
          type: object
          additionalProperties: true
    JobRefs:
      type: object
      required: [branch, build, flavor, release, commit_sha]
      properties:
        branch: { type: string }
        build: { type: string }
        flavor: { type: string }
        release: { type: string }
        commit_sha: { type: string }
    JobPipelineRef:
      type: object
      required: [pipeline_id, instance_id]
      properties:
        pipeline_id: { type: string }
        instance_id: { type: string }
    JobSourceRef:
      type: object
      description: |
        Structured source-integration reference embedded as the
        `source` block of a `job_kind=build` JobEnvelope. Resolved
        by the build service from the project's registered
        `source-integration`. Matches the `JobSourceRef` dataclass
        in `jobs/envelope/schema.py`.
      required: [kind, url, ref, integration_id]
      properties:
        kind:
          type: string
          enum: [git]
          description: |
            Source-integration kind discriminator. Only `git` is
            modeled today; the field is an enum so non-git kinds can
            be added without a schema-version bump.
        url:
          type: string
          description: Clone / fetch URL for the source repository.
        ref:
          type: string
          description: Default ref (branch / tag) the build checks out.
        integration_id:
          type: string
          description: |
            UUID of the registered `source-integration` the block was
            resolved from.
        credentials_ref:
          type: string
          default: ''
          description: |
            Symbolic secret reference (NOT the credential value) the
            client agent resolves to fetch a private repository. Empty
            string for a public repository. Public-repo sources are in
            scope today; private-repo credential vaulting is a
            documented follow-up -- the field is reserved so the
            follow-up needs no schema change.
    JobResultsLocator:
      type: object
      required: [backend_key_prefix, backend_driver]
      properties:
        backend_key_prefix: { type: string }
        backend_driver: { type: string }
    JobForwardingInfo:
      type: object
      required: [progress_url, summary_url, auth_method]
      properties:
        progress_url:
          type: string
          format: uri-reference
          description: |
            Where the pod POSTs run progress. Absolute under the service's
            configured public base URL (PYCHESTRATE_PUBLIC_BASE_URL);
            a service-relative path when none is configured.
        summary_url:
          type: string
          format: uri-reference
          description: |
            Where the pod reports the run's final result (the
            `results/complete` route). Absolute or service-relative, as
            for `progress_url`.
        auth_method:
          type: string
          enum: [bearer, mtls]
    JobDeadline:
      type: object
      required: [soft_deadline_at, hard_deadline_at]
      properties:
        soft_deadline_at: { type: string, format: date-time }
        hard_deadline_at: { type: string, format: date-time }

    PendingDispatch:
      type: object
      description: |
        Server response to `GET /api/v1/clients/{client_id}/dispatches:next`
        when a queued dispatch is available. Carries the signed
        `JobEnvelope` plus its detached Ed25519 signature and the
        ack-deadline the agent must beat. The signature is hex-encoded;
        agents re-verify against the canonical JSON serialization of the
        embedded `envelope` field.
      required:
        - dispatch_attempt_id
        - run_id
        - client_id
        - pod_id
        - envelope_id
        - enqueued_at
        - ack_deadline_at
        - envelope
        - signature
        - signature_key_id
        - signed_at
        - transport_name
      properties:
        dispatch_attempt_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        pod_id: { type: string, format: uuid }
        envelope_id: { type: string, format: uuid }
        enqueued_at: { type: string, format: date-time }
        ack_deadline_at: { type: string, format: date-time }
        envelope: { $ref: '#/components/schemas/JobEnvelope' }
        signature:
          type: string
          description: Hex-encoded Ed25519 detached signature.
        signature_key_id:
          type: string
          description: JWKS key id for the signing key.
        signed_at: { type: string, format: date-time }
        transport_name:
          type: string
          description: Stable transport identifier (`http-long-poll`).

    PendingCancellation:
      type: object
      description: |
        One operator-requested cancellation waiting for the pod
        client to collect. Delivered on the heartbeat response
        because the pod has no inbound channel — see the
        `clients_heartbeat` operation for why the dispatch long-poll
        cannot carry this.

        `request_id` identifies the `cancel_request` row the
        operator's `POST /runs/{run_id}/cancel` opened. The pod does
        not ack by id: it acks by reporting a terminal outcome of
        `cancelled` for `run_id` through
        `POST /runs/{run_id}/results/complete`, which is the only
        acknowledgement that proves the job actually stopped.
        Until then the entry is re-delivered on every heartbeat, so
        the pod must treat a repeat — or a cancellation for a run it
        does not recognize, or one that already finished — as a
        harmless no-op.
      required:
        - request_id
        - run_id
        - project_id
        - client_id
        - reason
        - requested_at
        - transport_name
      properties:
        request_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        reason:
          type: string
          description: Operator-supplied cancel reason, recorded for triage.
        requested_at: { type: string, format: date-time }
        transport_name:
          type: string
          description: >-
            Stable transport identifier
            (`client-heartbeat-cancel`).

    ClientHeartbeatAck:
      type: object
      description: |
        Server response to `GET /api/v1/clients/{client_id}/heartbeat`
        when the client has work waiting. A heartbeat with nothing
        queued answers 204 with no body instead, so this schema is
        only ever seen alongside a non-empty `cancellations` array.
      required:
        - client_id
        - cancellations
      properties:
        client_id: { type: string, format: uuid }
        cancellations:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PendingCancellation' }

    ScopedSecret:
      type: object
      required: [name, value, expires_at, token_type]
      properties:
        name: { type: string }
        value: { type: string }
        expires_at: { type: string, format: date-time }
        token_type: { type: string }

    # ----------------------------------------------------------------
    # RunState / Run
    # ----------------------------------------------------------------

    RunState:
      type: string
      description: |
        Run lifecycle state. Mirrors
        `jobs.run.state.enums.RunState`.
      enum:
        - pending
        - dispatching
        - dispatched
        - dispatch_unconfirmed
        - dispatch_lost
        - dispatch_failed
        - running
        - progress_stalled
        - cancel_requested
        - cancelling
        - cancelled
        - completing
        - completed
        - failed
        - needs_investigation

    TerminalOutcome:
      type: string
      enum:
        - success
        - failure
        - cancelled
        - dispatch_failed
        - dispatch_lost

    RunFailureClassification:
      type: string
      description: |
        Why a run ended the way it did, reported by the pod client
        and never inferred server-side.

        `TerminalOutcome` answers "did this run succeed" and is
        deliberately coarse — it drives state transitions, so the
        value set must stay small. That leaves `failure` covering
        every way a job can go wrong. The pod can tell those apart
        (a blown wall-clock cap, a binary that is not installed, a
        job that ran and exited non-zero) and this field is where
        that distinction is carried, so triage does not depend on
        parsing prose out of `notes`.
      enum:
        - timeout
        - executable_not_found
        - nonzero_exit
        - cancelled
        - launch_error
        - setup_error

    Run:
      type: object
      required: [run_id, project_id, pod_id, job_type, state, created_at]
      properties:
        run_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        pod_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Pod the run's latest dispatch attempt targeted. `null`
            until the run has been dispatched at least once.
        client_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Client the run's latest dispatch attempt targeted.
            `null` until the run has been dispatched at least once.
        job_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Job id from the archived dispatch envelope. `null`
            until the run has been dispatched.
        job_name:
          type: string
          nullable: true
          description: >-
            Human-readable job name from the archived dispatch
            envelope's canonical payload. `null` until the run has
            been dispatched.
        job_type: { type: string }
        state: { $ref: '#/components/schemas/RunState' }
        terminal_outcome:
          nullable: true
          $ref: '#/components/schemas/TerminalOutcome'
        outcome_reason:
          type: string
          nullable: true
          description: |
            Why the run ended as it did (run detail only): the pod's notes on its
            result manifest, else the reason recorded with the transition into
            the terminal state (a rejected dispatch, a passed hard deadline),
            else, while a cancel is pending, the cancel reason.
        assigned_client:
          type: object
          nullable: true
          description: |
            The client the latest dispatch attempt went to (run detail only),
            so a run waiting on an offline pod can say so. Liveness follows
            heartbeat silence: DEGRADED after 90 s, LOST after 5 minutes.
          properties:
            client_id: { type: string, format: uuid }
            pod_name: { type: string }
            status: { type: string, enum: [ACTIVE, SUSPENDED, REVOKED] }
            liveness_state: { type: string, enum: [ALIVE, DEGRADED, LOST] }
            last_seen: { type: string, format: date-time, nullable: true }
        warnings:
          type: array
          items: { type: string }
          description: |
            Trigger responses only. Present when the pod the run was queued for
            is not heartbeating: the run waits and starts when the pod
            reconnects.
        current_dispatch_attempt_id:
          type: string
          format: uuid
          nullable: true
        progress_summary:
          nullable: true
          $ref: '#/components/schemas/ProgressSummary'
        result_manifest:
          nullable: true
          $ref: '#/components/schemas/ResultManifest'
          description: >-
            The run's latest recorded result manifest -- the same
            block the `result_manifest` SSE RunEvent streams
            (artifact paths, lifted `files` / `artifact_count`,
            test counters). Populated only on the single-run read
            (`GET /runs/{run_id}`) once the pod client has posted
            `results/complete`; always `null` in list responses.
        created_at:
          type: string
          format: date-time
          description: >-
            Stable creation timestamp derived from the run's
            state-audit trail (first audit row, or the row's
            `entered_state_at` while the run has never
            transitioned).
        dispatched_at:
          type: string
          format: date-time
          nullable: true
          description: First transition into `dispatched`.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: First transition into `running`.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: First transition into a terminal state.
        labels:
          type: object
          additionalProperties: { type: string }
    RunPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Run' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ----------------------------------------------------------------
    # SSE events
    # ----------------------------------------------------------------

    RunEvent:
      type: object
      description: |
        One event emitted on the `/runs/{run_id}/events` SSE stream.
        The SSE `event:` field carries the event type tag; the SSE
        `data:` field carries this JSON object.

        A `result_manifest` event is published when the pod client
        posts `POST /runs/{run_id}/results/complete`; its
        `manifest` member echoes the posted `ResultManifest` with
        the testbase artifact-path defaults applied and the
        uploaded-file index lifted to `files` / `artifact_count`.
      required: [run_id, event_type, sequence, occurred_at]
      properties:
        run_id: { type: string, format: uuid }
        event_type:
          type: string
          enum: [state_changed, progress, result_manifest, heartbeat]
        sequence: { type: integer, minimum: 0 }
        occurred_at: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/RunState' }
        terminal_outcome:
          nullable: true
          $ref: '#/components/schemas/TerminalOutcome'
        progress:
          nullable: true
          $ref: '#/components/schemas/RunProgress'
        manifest:
          nullable: true
          $ref: '#/components/schemas/ResultManifest'

    RunProgress:
      type: object
      description: |
        The `progress` block of a `RunEvent`. Generalized across
        run kinds: the `frame_kind` discriminator (default `test`)
        selects the shape. A `test` block carries the per-test
        counter fields of a `ProgressSummary`; a `build` /
        `provision` block carries phase / status / a free-form
        `payload`. The run-detail UI renders whatever block arrives.
      required: [frame_kind]
      properties:
        run_id: { type: string, format: uuid, nullable: true }
        client_id: { type: string, format: uuid, nullable: true }
        frame_kind:
          type: string
          enum: [test, build, provision]
          default: test
        format_tag: { type: string }
        recorded_at: { type: string, format: date-time, nullable: true }
        tests_total: { type: integer, nullable: true }
        tests_passed: { type: integer, nullable: true }
        tests_failed: { type: integer, nullable: true }
        tests_skipped: { type: integer, nullable: true }
        tests_errored: { type: integer, nullable: true }
        percent_complete:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        frame_index: { type: integer, nullable: true }
        phase: { type: string, nullable: true }
        status: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        payload:
          type: object
          additionalProperties: true

    # ----------------------------------------------------------------
    # dispatch / progress / results
    # ----------------------------------------------------------------

    DispatchAck:
      type: object
      description: |
        Posted by the pod client agent to `POST /runs/{run_id}/dispatch-ack`
        to confirm receipt of a dispatched envelope.
      required: [envelope_id, dispatch_attempt_id, client_id, local_run_id, accepted_at]
      properties:
        envelope_id: { type: string }
        dispatch_attempt_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        local_run_id:
          type: string
          description: Local identifier minted by the client agent for reconciliation.
        accepted_at: { type: string, format: date-time }
        notes: { type: string }

    ProgressSummary:
      type: object
      description: |
        Roll-up the client agent emits at intervals. Matches the
        testbase `ForwardingInfo` shape; see
        `ingest.progress.schema.ProgressSummary`.

        For a `build` / `provision` run the server maps the run's
        latest generalized progress frame into this shape instead:
        `format_tag` / `frame_kind` carry the frame kind, `phase` /
        `status` describe the current step, the per-test counters
        are zero, and `percent_complete` / `notes` come from the
        frame.
      required: [run_id, client_id, format_tag, tests_passed, tests_failed, tests_skipped, tests_errored, recorded_at]
      properties:
        run_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        format_tag:
          type: string
          description: Parser tag (`testbase` for the in-tree default).
        frame_kind:
          type: string
          nullable: true
          description: >-
            Present when the summary was derived from a `build` /
            `provision` progress frame.
        phase:
          type: string
          nullable: true
          description: >-
            Current phase / step name from a `build` / `provision`
            progress frame.
        status:
          type: string
          nullable: true
          description: >-
            Status of the current phase / step from a `build` /
            `provision` progress frame.
        tests_total:
          type: integer
          nullable: true
        tests_passed: { type: integer, minimum: 0 }
        tests_failed: { type: integer, minimum: 0 }
        tests_skipped: { type: integer, minimum: 0 }
        tests_errored: { type: integer, minimum: 0 }
        percent_complete:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        notes:
          type: string
          nullable: true
        recorded_at: { type: string, format: date-time }
        raw:
          type: object
          additionalProperties: true

    ProgressRecord:
      type: object
      description: |
        One progress record from the testbase
        `testrun_results_stream.jsos` stream — represents one test
        scope completion (or preview).
      required: [run_id, client_id, record_index, test_name, result]
      properties:
        run_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        record_index: { type: integer, minimum: 0 }
        test_name: { type: string }
        result:
          type: string
          enum: [PASSED, FAILED, SKIPPED, ERRORED, UNSET]
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: number
          nullable: true
        raw:
          type: object
          additionalProperties: true

    ProgressFrameEnvelope:
      type: object
      description: |
        One generalized progress frame for a `build` / `provision`
        run. Build and provision runs are not test-shaped — a build
        emits phase transitions + log-line excerpts, a provision run
        emits plan/apply step transitions — so they carry a free-form
        `payload` block the live hub forwards verbatim instead of the
        test-shaped `ProgressSummary` / `ProgressRecord` pair.
        See `ingest.progress.schema.ProgressFrameEnvelope`.
      required: [client_id, frame_index]
      properties:
        run_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        frame_kind:
          type: string
          enum: [build, provision]
          description: Frame-kind discriminator.
        frame_index:
          type: integer
          minimum: 0
          description: |
            Monotonically-increasing index of the frame within the
            run's stream. The `(run_id, frame_kind, frame_index)`
            triple is unique so a re-posted frame is a no-op.
        phase:
          type: string
          nullable: true
          description: |
            Current phase / step name (`cloning` / `building` /
            `packaging` for build; `plan` / `apply` for provision).
        status:
          type: string
          nullable: true
          description: Status of the current phase / step.
        percent_complete:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        notes:
          type: string
          nullable: true
        recorded_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
          description: |
            Untyped kind-specific passthrough — build log-line
            excerpts, provision step detail, etc.

    ProgressFrame:
      type: object
      description: |
        Body of `POST /runs/{run_id}/progress`. The optional
        `frame_kind` discriminator selects the frame shape:

        * `test` (the default when `frame_kind` is absent) — the
          test-shaped frame carrying a `summary` roll-up and / or a
          `records` array of per-test records. An unmodified
          testbase client posts this body unchanged.
        * `build` / `provision` — a generalized progress frame
          (a single `frame` object, or a `frames` array) carrying
          phase / status / log-line excerpts. Persisted by the
          progress ingest service without testbase parsing and
          streamed onto the run's SSE events route as a `progress`
          `RunEvent`.
      properties:
        frame_kind:
          type: string
          enum: [test, build, provision]
          default: test
          description: |
            Frame-kind discriminator. Absent / `test` selects the
            legacy test-shaped `summary` / `records` body.
        summary:
          nullable: true
          $ref: '#/components/schemas/ProgressSummary'
        records:
          type: array
          items: { $ref: '#/components/schemas/ProgressRecord' }
        frame:
          nullable: true
          $ref: '#/components/schemas/ProgressFrameEnvelope'
        frames:
          type: array
          items: { $ref: '#/components/schemas/ProgressFrameEnvelope' }

    ResultManifest:
      type: object
      description: |
        Body of `POST /runs/{run_id}/results/complete`. Signals that
        the agent has finished writing the full testbase result tree
        to the shared results backend and tells the server where the
        tree lives + how it should be classified.
      required:
        - run_id
        - client_id
        - format_tag
        - backend_key_prefix
        - completed_at
        - terminal_outcome
      properties:
        run_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        format_tag:
          type: string
          description: >-
            Job-kind tag selecting the server-side ingest path:
            `testbase` for a testbase result tree, `junit-xml` for a
            tree of JUnit / xUnit XML reports, `build` for a build
            artifact tree, `provision` for a provisioning artifact
            tree.
        backend_key_prefix:
          type: string
          description: Per-run prefix the agent wrote the tree under
            (echoes `JobResultsLocator.backend_key_prefix`).
        backend_driver:
          type: string
          description: Object-store driver name the agent used.
        completed_at: { type: string, format: date-time }
        terminal_outcome: { $ref: '#/components/schemas/TerminalOutcome' }
        summary_artifact_path:
          type: string
          description: Path (relative to `backend_key_prefix`) of
            `testrun_summary.json`.
          default: testrun_summary.json
        results_stream_artifact_path:
          type: string
          description: Path of `testrun_results_stream.jsos`.
          default: testrun_results_stream.jsos
        results_artifact_path:
          type: string
          description: Path of the consolidated `testrun_results.json`.
          default: testrun_results.json
        html_summary_artifact_path:
          type: string
          description: Path of `testsummary.html`.
          default: testsummary.html
        tests_passed: { type: integer, minimum: 0 }
        tests_failed: { type: integer, minimum: 0 }
        tests_skipped: { type: integer, minimum: 0 }
        tests_errored: { type: integer, minimum: 0 }
        notes: { type: string }
        extras:
          type: object
          description: |
            Client-supplied side-band members. Open by design, but
            the members named here are a real contract the server
            reads and validates — not free-form data.
          additionalProperties: true
          properties:
            failure_classification:
              allOf:
                - $ref: '#/components/schemas/RunFailureClassification'
              description: >-
                Why the run ended this way. Carried here rather than
                as a top-level `ResultManifest` member because the
                pod client reaches the service exclusively through
                the generated REST client, whose `ResultManifest`
                model has no such field but does carry `extras` as
                an open map. A value outside the enum is dropped by
                the server rather than stored, so the field stays
                queryable.
            files:
              type: array
              description: >-
                One entry per file the client PUT to the shared
                results backend. Lifted to the top-level `files` +
                `artifact_count` members on the `result_manifest`
                RunEvent.
              items:
                type: object
                properties:
                  relative_path: { type: string }
                  size_bytes: { type: integer, minimum: 0 }
                  sha256: { type: string }
        failure_classification:
          allOf:
            - $ref: '#/components/schemas/RunFailureClassification'
          description: >-
            Server-lifted convenience member on the
            `result_manifest` RunEvent: echoes
            `extras.failure_classification` after validation, or
            `null` when the client sent none. Not part of the client
            POST body.
          nullable: true
        artifact_count:
          type: integer
          minimum: 0
          description: >-
            Server-lifted convenience member on the
            `result_manifest` RunEvent: count of the uploaded
            artifact files the manifest's `extras.files` index
            recorded. Not part of the client POST body.
        files:
          type: array
          description: >-
            Server-lifted convenience member on the
            `result_manifest` RunEvent: the walked artifact-file
            index from `extras.files`, one entry per uploaded file.
            Not part of the client POST body.
          items:
            type: object
            properties:
              relative_path: { type: string }
              size_bytes: { type: integer, minimum: 0 }
              sha256: { type: string }

    # ----------------------------------------------------------------
    # artifacts
    # ----------------------------------------------------------------

    ArtifactEntry:
      type: object
      required: [path, size_bytes, content_type]
      properties:
        path:
          type: string
          description: Slash-delimited path relative to the run's results root.
        size_bytes: { type: integer, minimum: 0 }
        content_type: { type: string }
        artifact_type:
          type: string
          description: Logical category assigned by an `ArtifactClassifierExtension`.
        download_url:
          type: string
          format: uri
          description: Signed URL the caller can use to download the bytes.
        download_url_expires_at:
          type: string
          format: date-time
        sha256: { type: string }
        recorded_at: { type: string, format: date-time }
    ArtifactEntryPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ArtifactEntry' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    ArtifactPresignRequest:
      type: object
      description: |
        Body of `POST /runs/{run_id}/artifacts:presign`. Carries the
        relative artifact paths the agent discovered while walking
        its result tree and wants presigned upload URLs for.
      required: [paths]
      properties:
        paths:
          type: array
          description: |
            Relative artifact paths (relative to the run's result
            root). Must be non-empty; the server caps the count and
            the summed path length and rejects an over-cap batch
            with 422.
          minItems: 1
          maxItems: 512
          items:
            type: string
            description: A single slash-delimited relative path.
            maxLength: 1024

    ArtifactUploadTarget:
      type: object
      description: |
        One minted presigned upload target. The agent PUTs the
        artifact's bytes to `put_url`, sending `headers` verbatim.
      required: [path, put_url, expires_at, headers]
      properties:
        path:
          type: string
          description: The relative artifact path this target covers.
        put_url:
          type: string
          description: |
            URL the agent PUTs the artifact bytes to. For the
            local-filesystem fallback this is a path-absolute URL on
            this service carrying the upload signature in its query
            string; for an S3-backed deploy it is an absolute
            object-store URL.
        expires_at:
          type: string
          format: date-time
          description: UTC timestamp after which the URL is rejected.
        headers:
          type: object
          additionalProperties: { type: string }
          description: |
            Headers the agent must send verbatim on the PUT. Empty
            for the local-filesystem fallback (the signature travels
            in the URL query string).

    ArtifactPresignResponse:
      type: object
      description: |
        Body of a successful `POST /runs/{run_id}/artifacts:presign`.
        Carries one upload target per requested path, in request
        order.
      required: [run_id, uploads]
      properties:
        run_id: { type: string, format: uuid }
        uploads:
          type: array
          items: { $ref: '#/components/schemas/ArtifactUploadTarget' }

    ArtifactLocalUploadResult:
      type: object
      description: |
        Body of a successful
        `PUT /runs/{run_id}/artifacts/_local-upload`.
      required: [run_id, path, bytes_written, stored_at]
      properties:
        run_id: { type: string, format: uuid }
        path:
          type: string
          description: The relative artifact path the bytes were stored under.
        bytes_written: { type: integer, minimum: 0 }
        stored_at:
          type: string
          description: Server-side absolute path the bytes landed at.

    # ----------------------------------------------------------------
    # test_runs
    # ----------------------------------------------------------------

    TestRunCreateRequest:
      type: object
      description: |
        Body of `POST /projects/{project_id}/test-runs`. Either
        `catalog_entry_id` or `(importer_tag, entry_key)` MUST be
        provided so the server can resolve the catalog row.

        `pod_id` is optional. When supplied, the run targets that
        specific pod. When omitted, the orchestrator selects an
        eligible pod by matching the catalog entry's capability
        requirements against the enrolled, available pods in the
        project.
      properties:
        catalog_entry_id:
          type: string
          format: uuid
        importer_tag: { type: string }
        entry_key: { type: string }
        pod_id:
          type: string
          format: uuid
          description: |
            Optional target pod. When omitted, the orchestrator
            picks an eligible pod by capability match.
        params:
          type: object
          additionalProperties: true
        labels:
          type: object
          additionalProperties: { type: string }
        soft_deadline_seconds: { type: integer, minimum: 1 }
        hard_deadline_seconds: { type: integer, minimum: 1 }

    # ----------------------------------------------------------------
    # test_catalog
    # ----------------------------------------------------------------

    TestCatalogEntry:
      type: object
      description: |
        Matches the SQLAlchemy model in
        `orchestration.test.catalog.models.TestCatalogEntry`.
      required:
        - entry_id
        - project_id
        - importer_tag
        - entry_key
        - display_name
        - canonical_digest
        - retired
        - created_at
      properties:
        entry_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        importer_tag: { type: string }
        entry_key: { type: string }
        display_name: { type: string }
        description: { type: string }
        required_capability_tags:
          type: array
          items: { type: string }
        param_schema:
          type: object
          additionalProperties: true
        raw_metadata:
          type: object
          additionalProperties: true
        canonical_digest: { type: string }
        retired: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TestCatalogEntryPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TestCatalogEntry' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    TestCatalogEntryUpsertRequest:
      type: object
      required: [importer_tag, entry_key, display_name]
      properties:
        importer_tag: { type: string }
        entry_key: { type: string }
        display_name: { type: string }
        description: { type: string }
        required_capability_tags:
          type: array
          items: { type: string }
        param_schema:
          type: object
          additionalProperties: true
        raw_metadata:
          type: object
          additionalProperties: true
        retired: { type: boolean, default: false }
    TestCatalogImportRequest:
      type: object
      required: [importer_tag]
      properties:
        importer_tag:
          type: string
          description: Importer factory tag (e.g. `testbase-project`).
        source:
          type: object
          additionalProperties: true
          description: |
            Importer-specific source descriptor. For `testbase-project`:
            `includes` (array of testbase include expressions such as
            `ccai.tests.singlehost.feature.test_module` or
            `pkg.module@#test_name`), optional `root` (testbase root on
            the pod), `ref` (branch, stored as the entry's branch) and
            `required_capability_tags`; and / or `entries` (full entry
            objects with `entry_key`, `display_name`, `description`,
            `required_capability_tags`, `param_schema`, `raw_metadata`).
          example:
            includes:
              - ccai.tests.singlehost.feature.test_module
            root: source/testroots/ccai
            ref: main
    TestCatalogImportSummary:
      type: object
      required: [importer_tag, started_at]
      properties:
        importer_tag: { type: string }
        started_at: { type: string, format: date-time }
        entries_imported: { type: integer, minimum: 0 }
        entries_retired: { type: integer, minimum: 0 }
        errors:
          type: array
          items: { type: string }

    # ----------------------------------------------------------------
    # builds (6-build-orchestration PR p20a)
    # ----------------------------------------------------------------

    BuildToolchainSnapshot:
      type: object
      description: |
        One toolchain entry recorded against a build run. Matches
        `orchestration.build.models.BuildToolchainSnapshot`.
      required: [toolchain_key, version, fingerprint_sha256]
      properties:
        toolchain_key: { type: string }
        version: { type: string }
        fingerprint_sha256: { type: string }
    BuildRun:
      type: object
      description: |
        One build execution. Matches the SQLAlchemy model in
        `orchestration.build.models.BuildRun` plus its toolchain
        snapshot rows. The build domain models a build run
        directly -- there is no separate `BuildPlan` resource in
        the M1 scaffolding.
      required:
        - run_id
        - project_id
        - runner_kind
        - repro_digest_sha256
        - state
      properties:
        run_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        runner_kind:
          type: string
          description: Stable runner-kind identifier (e.g. `makefile`).
        repro_digest_sha256: { type: string }
        state:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        run_state:
          type: string
          nullable: true
          description: |
            Current state of the run-state machine row driving this
            build's dispatch lifecycle (`pending`, `dispatching`,
            `dispatched`, ...). `null` when the build was triggered
            before dispatch wiring landed. After a successful trigger
            this reads `dispatching`.
        dispatch_attempt_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The dispatch-attempt UUID recorded when the build job
            envelope was handed to the transport. `null` until the
            build has been dispatched.
        layer5_run_id:
          type: string
          format: uuid
          nullable: true
        pipeline_run_id:
          type: string
          format: uuid
          nullable: true
        pipeline_step_run_id:
          type: string
          format: uuid
          nullable: true
        actor_id:
          type: string
          format: uuid
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        final_state_reason: { type: string }
        inputs:
          type: object
          additionalProperties: true
        annotations:
          type: object
          additionalProperties: true
        toolchain:
          type: array
          items: { $ref: '#/components/schemas/BuildToolchainSnapshot' }
        source:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/JobSourceRef'
          description: |
            Structured source reference resolved from the
            `source_integration_id` supplied at trigger time and
            embedded in this build's job envelope. `null` when the
            build was triggered without a `source_integration_id`.
    BuildRunPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BuildRun' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    BuildToolchainEntryInput:
      type: object
      required: [key]
      properties:
        key: { type: string }
        version: { type: string }
        fingerprint_sha256: { type: string }
    BuildRunCreateRequest:
      type: object
      description: |
        Body of `POST /projects/{project_id}/builds`. The
        `runner_kind` must resolve to a registered
        `build_runner_kind` factory; `runner_inputs` is validated
        by that runner kind.
      required: [runner_kind]
      properties:
        runner_kind:
          type: string
          description: Stable runner-kind identifier (e.g. `makefile`).
        source_integration_id:
          type: string
          format: uuid
          description: |
            Optional UUID of a registered `source-integration`. When
            supplied, the build service resolves it into the
            structured `source` block of the build job envelope
            (repo URL, default ref, credentials reference). When
            omitted the envelope carries no `source` block and the
            client falls back to its `runner_inputs.git_url`
            convention. An unknown id answers `404`.
        runner_inputs:
          type: object
          additionalProperties: true
          description: Free-form inputs consumed by the runner kind.
        input_files:
          type: object
          additionalProperties: { type: string }
          description: '`{path: content_sha256}` material in the repro digest.'
        env:
          type: object
          additionalProperties: { type: string }
          description: '`{key: value}` material in the repro digest.'
        toolchain:
          type: array
          items: { $ref: '#/components/schemas/BuildToolchainEntryInput' }
        annotations:
          type: object
          additionalProperties: true
    BuildArtifact:
      type: object
      description: |
        One artifact-manifest entry produced by a build run.
        Matches `orchestration.build.artifacts.models.BuildArtifactEntryIndex`.
      required:
        - manifest_id
        - artifact_id
        - artifact_type
        - sha256
      properties:
        manifest_id: { type: string, format: uuid }
        artifact_id: { type: string }
        artifact_type: { type: string }
        artifact_name: { type: string }
        storage_uri: { type: string }
        sha256: { type: string }
        payload:
          type: object
          additionalProperties: true
    BuildArtifactPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BuildArtifact' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        manifest_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Manifest the entries belong to, or `null` when the
            build run has not synthesized a manifest yet.

    # ----------------------------------------------------------------
    # pipelines (6-pipeline-definition + 6-matrix-sharding PR p20k)
    # ----------------------------------------------------------------

    PipelineStep:
      type: object
      description: |
        One step inside a pipeline stage. Matches `StepSpec` in
        `orchestration.pipelines.definition.parser`.
      required: [step_id, kind_name]
      properties:
        step_id: { type: string }
        kind_name:
          type: string
          description: Registered `pipeline_step_kind` factory name.
        uses:
          type: string
          nullable: true
          description: Optional reference for extension step kinds.
        inputs:
          type: object
          additionalProperties: true
          description: Free-form inputs validated by the step kind.

    PipelineStage:
      type: object
      description: |
        One stage of a pipeline DAG. Matches `StageSpec` in
        `orchestration.pipelines.definition.parser`.
      required: [stage_id, steps]
      properties:
        stage_id: { type: string }
        when_clause:
          type: string
          enum: [succeeded, failed, always]
        needs:
          type: array
          items: { type: string }
          description: Stage ids this stage depends on.
        steps:
          type: array
          items: { $ref: '#/components/schemas/PipelineStep' }

    PipelineDefinition:
      type: object
      description: |
        A parsed + DAG-validated + canonicalized pipeline-definition
        document. Matches the `PipelineDocumentCache` row in
        `orchestration.pipelines.definition.models`. The pipeline
        domain has no separate `PipelineDefinition` ORM table; the
        cached canonical document is the definition resource.
      required:
        - pipeline_id
        - project_id
        - name
        - schema_version
        - stages
      properties:
        pipeline_id:
          type: string
          description: Canonical-document SHA-256 digest.
        project_id: { type: string, format: uuid }
        name: { type: string }
        schema_version: { type: integer }
        commit_sha: { type: string }
        filename: { type: string }
        stages:
          type: array
          items: { $ref: '#/components/schemas/PipelineStage' }
        cached_at:
          type: string
          format: date-time
          nullable: true
        other_sources:
          type: array
          description: |
            Present in list responses only. The same document (same
            `pipeline_id`) is cached once per commit and file it was saved from;
            the list shows it once, with the newest source in `commit_sha` and
            `filename`, and the older ones here (newest first).
          items:
            type: object
            required: [filename, commit_sha]
            properties:
              filename: { type: string }
              commit_sha: { type: string }
              cached_at:
                type: string
                format: date-time
                nullable: true

    PipelineDefinitionPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PipelineDefinition' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PipelineDefinitionCreateRequest:
      type: object
      description: |
        Body of `POST /projects/{project_id}/pipelines` and
        `:validate`. `document` is the raw pipeline document, sent
        either as a YAML/JSON string or as a JSON object.
      required: [commit_sha, filename, document]
      properties:
        commit_sha:
          type: string
          description: Commit SHA the definition is bound to.
        filename:
          type: string
          description: Document filename; selects the YAML/JSON parser.
        document:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          description: The raw pipeline-definition document.

    DagValidationResult:
      type: object
      description: |
        Outcome of a pure pipeline-definition DAG validation.
      required: [valid, stage_count]
      properties:
        valid:
          type: boolean
          description: True when parse + DAG checks all pass.
        stage_count: { type: integer }
        topological_order:
          type: array
          items: { type: string }
          description: Stage ids in a stable topological order.
        issues:
          type: array
          items: { type: string }
          description: Validation issues; empty when `valid` is true.

    MatrixDimensionFilter:
      type: object
      description: |
        A fully-specified dimension tuple used in `includes` /
        `excludes`.
      additionalProperties: { type: string }

    MatrixSpec:
      type: object
      description: |
        A caller-provided matrix specification. Matches `MatrixSpec`
        in `orchestration.pipelines.sharding.expansion`.
      required: [dimensions]
      properties:
        dimensions:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: Dimension name to its non-empty value list.
        includes:
          type: array
          items: { $ref: '#/components/schemas/MatrixDimensionFilter' }
        excludes:
          type: array
          items: { $ref: '#/components/schemas/MatrixDimensionFilter' }

    MatrixExpandRequest:
      type: object
      description: |
        Body of `POST /projects/{project_id}/pipelines/{id}:expand-matrix`.
      required: [matrix]
      properties:
        matrix: { $ref: '#/components/schemas/MatrixSpec' }
        strategy_name:
          type: string
          description: Registered sharding strategy. Defaults to `cartesian`.

    ShardExpansionShard:
      type: object
      description: One shard of a non-persisted matrix-expansion preview.
      required: [shard_id, parallel_group, sequence_in_group]
      properties:
        shard_id:
          type: string
          description: 16-char hex digest of the dimension tuple.
        parallel_group: { type: string }
        sequence_in_group: { type: integer }
        dimension_values:
          type: object
          additionalProperties: { type: string }

    ShardExpansion:
      type: object
      description: |
        A non-persisted matrix-expansion preview. Writes no rows
        and emits no events.
      required: [strategy_name, shard_count, shards]
      properties:
        strategy_name: { type: string }
        matrix_spec_canonical_sha256: { type: string }
        shard_count: { type: integer }
        shards:
          type: array
          items: { $ref: '#/components/schemas/ShardExpansionShard' }

    # ----------------------------------------------------------------
    # pipeline-runs (6-pipeline-execution PR p20q)
    # ----------------------------------------------------------------

    PipelineRunTriggerRequest:
      type: object
      description: |
        Body of `POST /projects/{project_id}/pipeline-runs`. The
        pipeline document is supplied inline; the DAG-walking
        orchestrator parses, DAG-checks, persists, and dispatches the
        root stages' jobs.
      oneOf:
        - required: [commit_sha, filename, document]
        - required: [pipeline_id]
      properties:
        pipeline_id:
          type: string
          description: |
            A pipeline saved in this project (`GET .../pipelines`): run it at the commit and
            file it was saved from. Cannot be combined with `document`; `404` when no saved
            pipeline has this id.
        commit_sha:
          type: string
          description: |
            Commit the pipeline document was read at. With `pipeline_id`, optional: it
            overrides the commit the pipeline was saved from.
        ref:
          type: string
          description: Git ref (branch / tag) the run targets.
        filename:
          type: string
          description: Pipeline-document filename (selects the parser).
        document:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          description: |
            The pipeline document inline -- a YAML/JSON string or a
            JSON object.
        matrix:
          type: object
          additionalProperties: true
          description: |
            Must be absent or empty. Matrix execution is not supported
            (a run executes each stage once), so a non-empty matrix is
            refused with 422 instead of being ignored; preview shards
            with `POST /projects/{project_id}/pipelines:expand-matrix`.

    PipelineStepStatus:
      type: object
      description: |
        Per-step status of a pipeline run. Matches `PipelineStepRun`
        in `orchestration.pipelines.definition.models`.
      required: [step_run_id, step_id, state]
      properties:
        step_run_id: { type: string, format: uuid }
        step_id: { type: string }
        step_index: { type: integer }
        kind_name: { type: string }
        job_kind:
          type: string
          description: |
            Dispatch route -- `build` / `test` / `infra` / `provision` /
            `rpa` / `script`. A `script` step is never executed (no
            executor runs scripts): it ends `failed` with a
            `final_state_reason` starting "not executed".
        layer5_run_id:
          type: string
          nullable: true
          description: |
            The dispatched build / test / provision orchestration run
            id, or `null` for a step that did not dispatch a job.
        state:
          type: string
          enum: [pending, dispatched, running, completed, failed, cancelled, skipped]
        final_state_reason: { type: string }
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true

    PipelineStageStatus:
      type: object
      description: |
        Per-stage status of a pipeline run. Matches
        `PipelineStageRun` in
        `orchestration.pipelines.definition.models`. A stage becomes
        eligible once every stage it `needs` has completed; a stage
        whose dependency failed is `skipped`.
      required: [stage_run_id, stage_id, state]
      properties:
        stage_run_id: { type: string, format: uuid }
        stage_id: { type: string }
        stage_index: { type: integer }
        state:
          type: string
          enum: [pending, running, skipped, completed, failed, cancelled]
        when_clause:
          type: string
          enum: [succeeded, failed, always]
        needs:
          type: array
          items: { type: string }
          description: Stage ids this stage depends on.
        steps:
          type: array
          items: { $ref: '#/components/schemas/PipelineStepStatus' }
        final_state_reason: { type: string }
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true

    PipelineRun:
      type: object
      description: |
        One execution of a pipeline definition. Matches the
        `PipelineRun` row in
        `orchestration.pipelines.definition.models`, walked by the
        `PipelineOrchestrator`.
      required:
        - run_id
        - project_id
        - state
        - stages
      properties:
        run_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        pipeline_id:
          type: string
          description: Canonical-document SHA-256 digest of the definition.
        commit_sha: { type: string }
        ref: { type: string }
        filename: { type: string }
        state:
          type: string
          enum: [pending, running, completed, failed, cancelled, rejected]
        trigger_cause:
          type: string
          enum: [manual, webhook, schedule, api]
        actor_id:
          type: string
          nullable: true
        stages:
          type: array
          items: { $ref: '#/components/schemas/PipelineStageStatus' }
        final_state_reason: { type: string }
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true

    PipelineRunPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PipelineRun' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ----------------------------------------------------------------
    # source_integrations (6-source-integrations PR p20a)
    # ----------------------------------------------------------------

    SourceIntegration:
      type: object
      description: |
        Per-project SCM configuration. Matches the SQLAlchemy
        model in `orchestration.source.models.ScmProjectConfig`.
        The `integration_id` equals the `project_id` -- a project
        owns a single source integration in the M1 scaffolding.
      required:
        - integration_id
        - project_id
        - provider_name
        - repo_key
        - pipeline_file_path
      properties:
        integration_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        provider_name:
          type: string
          description: Registered `scm_provider` factory name (e.g. `github`).
        repo_key:
          type: string
          description: Provider-specific repo identifier (e.g. `owner/repo`).
        pipeline_file_path: { type: string }
        use_polling: { type: boolean }
        polling_ref_glob: { type: string }
        last_poll_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SourceIntegrationPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SourceIntegration' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    SourceIntegrationRegisterRequest:
      type: object
      description: |
        Body of `POST /projects/{project_id}/source-integrations`.
      required: [provider_name, repo_key]
      properties:
        provider_name:
          type: string
          description: Registered `scm_provider` factory name (e.g. `github`).
        repo_key:
          type: string
          description: Provider-specific repo identifier (e.g. `owner/repo`).
        pipeline_file_path:
          type: string
          description: Defaults to `.pychestrate/pipeline.yaml`.
        use_polling: { type: boolean, default: false }
        polling_ref_glob: { type: string }

    # ----------------------------------------------------------------
    # environments (6-environment-registry PR p20b)
    # ----------------------------------------------------------------

    Environment:
      type: object
      description: |
        One target environment. Matches the SQLAlchemy model in
        `orchestration.infra.environment.models.Environment`.
      required:
        - environment_id
        - project_id
        - kind_name
        - name
        - state
      properties:
        environment_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        kind_name:
          type: string
          description: Registered `environment_kind` factory name.
        name: { type: string }
        state:
          type: string
          enum: [active, frozen, archived, destroyed]
        attrs:
          type: object
          additionalProperties: true
        frozen_by:
          type: string
          format: uuid
          nullable: true
        frozen_reason:
          type: string
          nullable: true
        frozen_at:
          type: string
          format: date-time
          nullable: true
        last_applied_run_id:
          type: string
          format: uuid
          nullable: true
        last_output_digest_sha256: { type: string }
        last_applied_at:
          type: string
          format: date-time
          nullable: true
        archived_reason:
          type: string
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        destroyed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    EnvironmentPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Environment' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    EnvironmentCreateRequest:
      type: object
      description: |
        Body of `POST /projects/{project_id}/environments`. The
        `kind_name` must resolve to a registered
        `environment_kind` factory; `attrs` is validated by that
        kind.
      required: [name, kind_name]
      properties:
        name:
          type: string
          description: Human-facing environment name, unique per (project, kind).
        kind_name:
          type: string
          description: Registered `environment_kind` factory name.
        attrs:
          type: object
          additionalProperties: true
          description: Kind-specific environment attributes.

    # ----------------------------------------------------------------
    # provisioning (6-infra-orchestration PR p20b)
    # ----------------------------------------------------------------

    ProvisioningResourceOp:
      type: object
      description: One per-resource operation on a plan summary.
      required: [resource_address, op]
      properties:
        resource_address: { type: string }
        op:
          type: string
          enum: [add, change, destroy, no_op]
        module_path: { type: string }
    ProvisioningPlanSummary:
      type: object
      description: |
        Aggregate plan output recorded on a provisioning run.
      required:
        - resources_to_add
        - resources_to_change
        - resources_to_destroy
      properties:
        resources_to_add: { type: integer }
        resources_to_change: { type: integer }
        resources_to_destroy: { type: integer }
        resource_ops:
          type: array
          items: { $ref: '#/components/schemas/ProvisioningResourceOp' }
    ProvisioningRun:
      type: object
      description: |
        One infrastructure provisioning run. Matches the
        SQLAlchemy model in
        `orchestration.infra.runs.models.InfraRun`. The infra-runs
        domain models a run directly -- the `plan` / `apply` /
        `destroy` action is encoded on the run row, and a plan
        summary is recorded on the run itself; there is no
        separate provisioning-plan resource.
      required:
        - run_id
        - project_id
        - environment_id
        - driver_name
        - action
        - state
      properties:
        run_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        driver_name:
          type: string
          description: Registered `infra_tool_driver` factory name.
        action:
          type: string
          enum: [plan, apply, destroy]
        state:
          type: string
          enum: [pending, running, completed, failed, cancelled, rejected_by_guard]
        layer5_run_id:
          type: string
          format: uuid
          nullable: true
        actor_id:
          type: string
          format: uuid
          nullable: true
        actor_role_set:
          type: array
          items: { type: string }
        inputs:
          type: object
          additionalProperties: true
        inputs_canonical_sha256: { type: string }
        plan_summary:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProvisioningPlanSummary'
        plan_artifact_ref:
          type: string
          nullable: true
        plan_diff_digest_sha256: { type: string }
        plan_issued_at:
          type: string
          format: date-time
          nullable: true
        replay_of:
          type: string
          format: uuid
          nullable: true
        output_digest_sha256: { type: string }
        failing_guard_rule_id:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        final_state_reason: { type: string }
        run_state:
          type: string
          nullable: true
          description: |
            Run-state-machine state for the dispatched provisioning
            job (e.g. `dispatching`). `null` when the run was
            triggered before dispatch wiring landed.
        dispatch_attempt_id:
          type: string
          format: uuid
          nullable: true
          description: |
            UUID of the `dispatch_attempt` row recorded when the
            `job_kind=provision` envelope was dispatched.
    ProvisioningRunPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProvisioningRun' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    ProvisioningRunCreateRequest:
      type: object
      description: |
        Body of `POST /projects/{project_id}/provisioning-runs`.
        The `driver_name` must resolve to a registered
        `infra_tool_driver` factory; `driver_inputs` is validated
        by that driver.
      required: [environment_id, driver_name, action]
      properties:
        environment_id:
          type: string
          format: uuid
          description: Bound target environment.
        driver_name:
          type: string
          description: Registered `infra_tool_driver` factory name.
        action:
          type: string
          enum: [plan, apply, destroy]
        driver_inputs:
          type: object
          additionalProperties: true
          description: Free-form inputs consumed by the driver.

    # ----------------------------------------------------------------
    # drift (6-drift-detection PR p20b)
    # ----------------------------------------------------------------

    DriftReport:
      type: object
      description: |
        One drift run / report. Matches the SQLAlchemy model in
        `orchestration.infra.drift.models.DriftRun`.
      required:
        - run_id
        - project_id
        - environment_id
        - checker_name
        - state
        - trigger_kind
      properties:
        run_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        checker_name:
          type: string
          description: Registered `drift_checker` factory name.
        state:
          type: string
          enum: [pending, running, completed, failed, ingest_failed, skipped]
        trigger_kind:
          type: string
          enum: [schedule, manual]
        layer5_run_id:
          type: string
          format: uuid
          nullable: true
        scheduled_for:
          type: string
          format: date-time
          nullable: true
        ran_at:
          type: string
          format: date-time
          nullable: true
        drift_count:
          type: integer
          nullable: true
        added:
          type: integer
          nullable: true
        changed:
          type: integer
          nullable: true
        destroyed:
          type: integer
          nullable: true
        diff_digest_sha256: { type: string }
        report_blob_key:
          type: string
          nullable: true
        final_state_reason: { type: string }
        report_payload:
          type: object
          additionalProperties: true
          nullable: true
    DriftStatus:
      type: object
      description: |
        Current drift status of an environment -- the latest
        drift run, or `null` when none has been recorded -- with
        the environment's recent drift runs, its drift schedule,
        and whether a manual drift check can start. Drift
        detection is a preview: recorded checks are not processed
        yet (`dispatch_available: false`).
      required: [environment_id, has_report]
      properties:
        environment_id: { type: string, format: uuid }
        has_report: { type: boolean }
        latest_report:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DriftReport'
        history:
          type: array
          description: Up to 20 recent drift runs, newest first.
          items: { $ref: '#/components/schemas/DriftReport' }
        schedule:
          type: object
          nullable: true
          description: The environment's drift schedule, or null.
          properties:
            checker_name: { type: string }
            cron_expression: { type: string }
            enabled: { type: boolean }
            updated_at: { type: string, format: date-time, nullable: true }
        check_available:
          type: boolean
          description: >-
            Whether `POST .../drift:check` can start a check (it
            borrows the drift schedule's checker).
        check_unavailable_reason:
          type: string
          nullable: true
        dispatch_available:
          type: boolean
          description: Always `false` in this release.
        detail:
          type: string
          description: Why drift detection is a preview.

    # ----------------------------------------------------------------
    # metrics / dashboards / metric_alerts (7-* PR p20f)
    # ----------------------------------------------------------------

    DriftCheckAccepted:
      description: >-
        The 202 body of `POST .../drift:check` -- the recorded
        drift run plus honesty fields stating that automatic
        processing (the Layer-5 dispatch handoff) is not
        available in this release, so the run will remain
        PENDING.
      allOf:
        - $ref: '#/components/schemas/DriftReport'
        - type: object
          required: [dispatch_available, detail]
          properties:
            dispatch_available:
              type: boolean
              description: >-
                Always `false` in this release -- the recorded
                run is not handed to a processor.
            detail:
              type: string
              description: >-
                Human-readable statement that the check was
                recorded but will not progress automatically.

    MetricCatalogEntry:
      type: object
      description: One registered metric definition.
      required: [name, kind, label_names]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [counter, gauge, histogram]
        label_names:
          type: array
          items: { type: string }
        help_text: { type: string }
        cardinality_max: { type: integer, minimum: 0 }

    MetricCatalogPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MetricCatalogEntry' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    TimeseriesPoint:
      type: object
      description: One timestamped metric data point.
      required: [observed_at, value]
      properties:
        observed_at: { type: string, format: date-time }
        value: { type: number }
        labels:
          type: object
          additionalProperties: { type: string }
        label_signature: { type: string }

    TimeseriesQuery:
      type: object
      description: Result of a metric timeseries query.
      required: [metric, points, meta]
      properties:
        metric: { type: string }
        kind:
          type: string
          enum: [counter, gauge, histogram]
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        points:
          type: array
          items: { $ref: '#/components/schemas/TimeseriesPoint' }
        meta:
          type: object
          properties:
            point_count: { type: integer, minimum: 0 }
            limit: { type: integer, minimum: 1 }

    TestMetricsRollup:
      type: object
      description: Aggregate test-result rollup over recent runs.
      required: [run_count, tests_total]
      properties:
        run_count: { type: integer, minimum: 0 }
        tests_total: { type: integer, minimum: 0 }
        tests_passed: { type: integer, minimum: 0 }
        tests_failed: { type: integer, minimum: 0 }
        tests_skipped: { type: integer, minimum: 0 }
        tests_errored: { type: integer, minimum: 0 }
        pass_rate: { type: number, minimum: 0, maximum: 1 }
        fail_rate: { type: number, minimum: 0, maximum: 1 }
        runs_with_failures: { type: integer, minimum: 0 }
        failed_run_rate:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Share of runs with at least one failed or errored test
            (`runs_with_failures / run_count`). Not a flake rate: no
            flaky-test detection is performed. Replaces the misnamed
            `flake_run_rate`.
        average_run_duration_seconds: { type: number, minimum: 0 }

    TestMetricsRunEntry:
      type: object
      description: Per-run test-result breakdown entry.
      required: [run_id]
      properties:
        run_id: { type: string, format: uuid }
        parser_tag: { type: string }
        tests_total: { type: integer, minimum: 0 }
        tests_passed: { type: integer, minimum: 0 }
        tests_failed: { type: integer, minimum: 0 }
        tests_skipped: { type: integer, minimum: 0 }
        tests_errored: { type: integer, minimum: 0 }
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        ingested_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: number
          nullable: true

    TestMetricsSummary:
      type: object
      description: |
        Test-result metrics for a project -- an aggregate rollup
        plus a recent per-run breakdown. Computed on read from the
        result-ingest summary rows.
      required: [project_id, summary, recent_runs]
      properties:
        project_id: { type: string, format: uuid }
        summary: { $ref: '#/components/schemas/TestMetricsRollup' }
        recent_runs:
          type: array
          items: { $ref: '#/components/schemas/TestMetricsRunEntry' }
        meta:
          type: object
          properties:
            run_limit: { type: integer, minimum: 1 }
            run_count: { type: integer, minimum: 0 }
            source: { type: string }
            aggregation: { type: string }

    DashboardTile:
      type: object
      description: One placed metric tile within a dashboard grid.
      required: [tile_id, kind, x, y, w, h]
      properties:
        tile_id: { type: string }
        kind: { type: string }
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        w: { type: integer, minimum: 1 }
        h: { type: integer, minimum: 1 }
        config:
          type: object
          additionalProperties: true

    Dashboard:
      type: object
      description: A named per-project collection of metric tiles.
      required: [dashboard_id, project_id, name, tiles, version]
      properties:
        dashboard_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        owner_principal_id:
          type: string
          format: uuid
          nullable: true
        grid_columns_max: { type: integer, minimum: 1 }
        tiles:
          type: array
          items: { $ref: '#/components/schemas/DashboardTile' }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DashboardCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        grid_columns_max: { type: integer, minimum: 1 }
        tiles:
          type: array
          items: { $ref: '#/components/schemas/DashboardTile' }

    DashboardUpdateRequest:
      type: object
      description: >-
        In-place dashboard update. Every field is optional --
        omitted fields keep their persisted value. A supplied
        `tiles` array replaces the whole tile set.
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        grid_columns_max: { type: integer, minimum: 1 }
        tiles:
          type: array
          items: { $ref: '#/components/schemas/DashboardTile' }
        expected_version:
          type: integer
          minimum: 1
          description: >-
            Optimistic-concurrency guard -- when supplied it must
            match the persisted version or the update returns 409.

    DashboardPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Dashboard' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    MetricAlertRule:
      type: object
      description: A per-project metric-alert rule.
      required: [rule_id, project_id, name, kind, severity, enabled]
      properties:
        rule_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        kind: { type: string }
        config:
          type: object
          additionalProperties: true
        severity:
          type: string
          enum: [info, warning, critical]
        enabled: { type: boolean }
        notification_targets:
          type: array
          items: { type: string }
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        live_state: { $ref: '#/components/schemas/MetricAlertLiveState' }

    MetricAlertLiveState:
      type: object
      description: >-
        The alert evaluator's latest verdict for a rule. `unknown`
        until the evaluator (every 60 s) has run the rule.
      required: [state, fire_count, resolve_count]
      properties:
        state:
          type: string
          enum: [unknown, ok, firing]
        last_value: { nullable: true }
        last_threshold: { nullable: true }
        last_reason: { type: string }
        last_evaluated_at: { type: string, format: date-time, nullable: true }
        last_state_changed_at: { type: string, format: date-time, nullable: true }
        fired_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        fire_count: { type: integer }
        resolve_count: { type: integer }

    MetricAlertRuleCreateRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1 }
        kind: { type: string, minLength: 1 }
        description: { type: string }
        config:
          type: object
          additionalProperties: true
        severity:
          type: string
          enum: [info, warning, critical]
        enabled: { type: boolean }
        notification_targets:
          type: array
          items: { type: string }

    MetricAlertRuleUpdateRequest:
      type: object
      description: A change to a rule. Every field is optional; one left out keeps its stored value.
      properties:
        name: { type: string, minLength: 1 }
        kind:
          type: string
          description: Must be the rule's own kind if sent; a rule's kind cannot change.
        description: { type: string }
        config:
          type: object
          additionalProperties: true
        severity:
          type: string
          enum: [info, warning, critical]
        enabled: { type: boolean }
        notification_targets:
          type: array
          items: { type: string }

    MetricAlertRulePage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MetricAlertRule' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ----------------------------------------------------------------
    # 4-resources PR p20p: resource-management schemas
    # ----------------------------------------------------------------

    ResourcePool:
      type: object
      description: |
        A capability-tagged grouping of resources. Matches the
        SQLAlchemy model in `resources.pools.models.ResourcePool`.
      required:
        - pool_id
        - project_id
        - name
        - capability_tags
        - member_count
      properties:
        pool_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        capability_tags:
          type: array
          items: { type: string }
        member_count:
          type: integer
          minimum: 0
          description: Count of resource members attached to the pool.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ResourcePoolPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ResourcePool' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    ResourcePoolCreateRequest:
      type: object
      required: [project_id, name]
      properties:
        project_id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        description: { type: string }
        capability_tags:
          type: array
          items: { type: string }

    ResourcePoolMember:
      type: object
      description: |
        Resource-to-pool membership row. Matches
        `resources.pools.models.ResourcePoolMember`, enriched with
        read-only fields joined from the member's inventory
        `Resource` row and its current health record so pool-member
        listings can render a meaningful table without N follow-up
        resource reads.
      required:
        - membership_id
        - pool_id
        - resource_id
      properties:
        membership_id: { type: string, format: uuid }
        pool_id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        added_at: { type: string, format: date-time }
        resource_name:
          type: string
          nullable: true
          description: |
            Display name of the joined inventory resource; `null`
            when the resource row is unavailable.
        resource_kind:
          type: string
          nullable: true
          description: |
            Kind identifier of the joined inventory resource;
            `null` when the resource row is unavailable.
        resource_state:
          type: string
          enum: [available, leased, quarantined, maintenance, retired]
          nullable: true
          description: |
            Lifecycle state of the joined inventory resource;
            `null` when the resource row is unavailable.
        resource_health:
          type: string
          nullable: true
          description: |
            `last_outcome` of the resource's current health record
            (e.g. `pass` / `fail`); `null` when the resource has
            never been probed.

    ResourcePoolMemberPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ResourcePoolMember' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    ResourcePoolMemberAddRequest:
      type: object
      required: [resource_id]
      properties:
        resource_id: { type: string, format: uuid }

    Resource:
      type: object
      description: |
        An authoritative resource record. Matches the SQLAlchemy
        model in `resources.inventory.models.Resource`.
      required:
        - resource_id
        - project_id
        - kind
        - state
      properties:
        resource_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        kind:
          type: string
          description: Stable resource-kind identifier (e.g. `device`).
        display_name: { type: string }
        description: { type: string }
        identity_hash:
          type: string
          description: Per-kind canonical identity hash.
        state:
          type: string
          enum: [available, leased, quarantined, maintenance, retired]
        tags:
          type: array
          items: { type: string }
        attributes:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ResourcePage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    ResourceRegisterRequest:
      type: object
      required: [project_id, kind, display_name]
      properties:
        project_id: { type: string, format: uuid }
        kind:
          type: string
          description: A loaded resource kind (for example `device`).
        display_name: { type: string, minLength: 1 }
        description: { type: string }
        attributes:
          type: object
          additionalProperties: true
          description: |
            Validated and normalised by the kind. The `device` kind takes
            `hostname` (required), `mac_address`, `ipv4`, `ipv6`, `vendor`,
            `model`, `location` and `notes`.
        tags:
          type: array
          items: { type: string }

    ResourceUpdateRequest:
      type: object
      description: At least one of the three fields.
      properties:
        display_name: { type: string, minLength: 1 }
        description: { type: string }
        tags:
          type: array
          items: { type: string }

    ResourceStateTransitionRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [available, leased, quarantined, maintenance, retired]
          description: Target lifecycle state.
        reason:
          type: string
          description: |
            Optional operator-supplied reason, recorded on the
            `entity.resource.state_changed` event payload.

    ResourceHealth:
      type: object
      description: |
        The current health-probe record for a resource. Matches
        `resources.health.models.ResourceHealth`.
      required:
        - health_id
        - resource_id
        - project_id
        - probe_name
        - last_outcome
      properties:
        health_id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        probe_name: { type: string }
        probe_period_seconds: { type: integer, minimum: 1 }
        last_outcome:
          type: string
          enum: [pass, fail, unknown]
        last_probe_at:
          type: string
          format: date-time
          nullable: true
        last_pass_at:
          type: string
          format: date-time
          nullable: true
        last_fail_at:
          type: string
          format: date-time
          nullable: true
        next_probe_at: { type: string, format: date-time }
        pass_count: { type: integer, minimum: 0 }
        fail_count: { type: integer, minimum: 0 }
        consecutive_failures: { type: integer, minimum: 0 }
        last_error:
          type: string
          nullable: true
        last_payload:
          type: object
          additionalProperties: true

    Reservation:
      type: object
      description: |
        A resource reservation (checkout). Matches the SQLAlchemy
        model in `resources.checkout.models.Reservation`. The
        resources domain models reservations rather than free-form
        "allocations".
      required:
        - reservation_id
        - project_id
        - resource_id
        - mode
        - state
      properties:
        reservation_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        requested_by:
          type: string
          format: uuid
          nullable: true
        mode:
          type: string
          enum: [exclusive, shared]
        state:
          type: string
          enum: [pending, granted, released, rejected, forced_released]
        note: { type: string }
        requested_at: { type: string, format: date-time }
        granted_at:
          type: string
          format: date-time
          nullable: true
        released_at:
          type: string
          format: date-time
          nullable: true
        rejection_reason:
          type: string
          nullable: true

    ReservationPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Reservation' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PoolReservationRequest:
      type: object
      required: [project_id]
      properties:
        project_id: { type: string, format: uuid }
        mode:
          type: string
          enum: [exclusive, shared]
          default: exclusive
        requested_by:
          type: string
          format: uuid
          nullable: true
        note: { type: string }
        resource_id:
          type: string
          format: uuid
          description: |
            Explicit target resource. When omitted the FIFO
            allocation strategy picks an eligible pool member.
        preferred_member:
          type: string
          format: uuid
          description: |
            Pool-member hint -- returned ahead of FIFO order when
            it is an eligible (AVAILABLE) member.

    UsageRecord:
      type: object
      description: |
        One append-only resource usage-timeline event. Matches
        `resources.usage_history.models.ResourceTimelineEvent`.
      required:
        - event_id
        - source_event_id
        - resource_id
        - project_id
        - event_type
        - at_ts
      properties:
        event_id: { type: string, format: uuid }
        source_event_id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        event_type:
          type: string
          description: |
            Timeline-event type mirroring the originating bus topic
            (e.g. `resource.registered`, `reservation.granted`,
            `lease.attached`, `health.probed`).
        actor_id:
          type: string
          format: uuid
          nullable: true
        pod_event_group_id:
          type: string
          format: uuid
          nullable: true
        at_ts: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
        annotations:
          type: object
          additionalProperties: true

    UsageRecordPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UsageRecord' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ----------------------------------------------------------------
    # blast-radius guards (PR p21c)
    # ----------------------------------------------------------------

    BlastRadiusGuard:
      type: object
      description: >-
        A blast-radius guard -- the attachment of a registry-defined
        guard rule onto a single environment.
      required:
        - guard_id
        - project_id
        - environment_id
        - rule_id
        - enabled
      properties:
        guard_id:
          type: string
          description: Composite identifier (`{environment_id}.{rule_id}`).
        project_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        rule_id:
          type: string
          description: Registry-defined guard-rule identifier.
        enabled: { type: boolean }
        added_by:
          type: string
          format: uuid
          nullable: true
        added_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    BlastRadiusGuardCreate:
      type: object
      required: [environment_id, rule_id]
      properties:
        environment_id: { type: string, format: uuid }
        rule_id: { type: string }
        enabled: { type: boolean, default: true }

    BlastRadiusGuardPatch:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    BlastRadiusGuardPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BlastRadiusGuard' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    BlastRadiusGuardEvaluationRequest:
      type: object
      required: [environment_id, action]
      properties:
        environment_id: { type: string, format: uuid }
        action:
          type: string
          description: The proposed change action being evaluated.
        requester_id:
          type: string
        actor_role_set:
          type: array
          items: { type: string }

    BlastRadiusGuardEvaluationEntry:
      type: object
      required: [rule_id, verdict, reason]
      properties:
        rule_id: { type: string }
        verdict: { type: string }
        reason: { type: string }

    BlastRadiusGuardEvaluation:
      type: object
      required: [allowed, failing_rule_id, entries]
      properties:
        allowed: { type: boolean }
        failing_rule_id:
          type: string
          description: First rule that denied; empty when `allowed`.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/BlastRadiusGuardEvaluationEntry'

    # ----------------------------------------------------------------
    # SLO views (PR p21c)
    # ----------------------------------------------------------------

    Slo:
      type: object
      description: A per-project SLO definition.
      required:
        - slo_id
        - project_id
        - name
        - kind
        - target
        - window_seconds
      properties:
        slo_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        kind: { type: string }
        target: { type: number, minimum: 0.0, maximum: 1.0 }
        window_seconds: { type: integer, minimum: 1 }
        definition_config:
          type: object
          additionalProperties: true
        default_notification_route_key:
          type: string
          nullable: true
        auto_attach_burn_rate_alerts: { type: boolean }
        version: { type: integer }
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    SloCreate:
      type: object
      required: [name, kind, target]
      properties:
        name: { type: string }
        kind: { type: string }
        target: { type: number, minimum: 0.0, maximum: 1.0 }
        window_seconds: { type: integer, minimum: 1 }
        description: { type: string }
        definition_config:
          type: object
          additionalProperties: true
        default_notification_route_key:
          type: string
          nullable: true
        auto_attach_burn_rate_alerts: { type: boolean, default: false }

    SloStatus:
      type: object
      description: The current burn-rate / error-budget status for an SLO.
      required: [slo_id, target, breaching]
      properties:
        slo_id: { type: string, format: uuid }
        achieved_ratio:
          type: number
          nullable: true
        error_budget_remaining_ratio:
          type: number
          nullable: true
        target: { type: number }
        window_start:
          type: string
          format: date-time
          nullable: true
        window_end:
          type: string
          format: date-time
          nullable: true
        good_count: { type: integer }
        total_count: { type: integer }
        breaching: { type: boolean }
        reason: { type: string }

    SloWithStatus:
      allOf:
        - $ref: '#/components/schemas/Slo'
        - type: object
          properties:
            status:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/SloStatus'

    SloPage:
      type: object
      description: >-
        Page of SLO definitions. Each item embeds a `status`
        block (the same shape the detail read embeds) so list
        consumers can show burn-rate health without a per-item
        fetch; `status` is `null` for items past the server's
        per-page computation bound or whose kind is no longer
        registered.
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SloWithStatus' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ----------------------------------------------------------------
    # release channels (PR p21c)
    # ----------------------------------------------------------------

    ReleaseChannelEntry:
      type: object
      description: >-
        A published release-channel entry -- a release row
        advertised on a channel.
      required:
        - channel_id
        - release_id
        - component
        - version
        - channel
        - status
      properties:
        channel_id:
          type: string
          format: uuid
          description: Release-channel entry identifier (release UUID).
        release_id: { type: string, format: uuid }
        component: { type: string, enum: [service, agent] }
        version: { type: string }
        channel: { type: string, enum: [canary, beta, stable] }
        artifact_uri: { type: string }
        artifact_sha256: { type: string }
        issuer_key_id: { type: string }
        issued_at:
          type: string
          format: date-time
          nullable: true
        issued_by:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [active, superseded, rolled_back, withdrawn]
        rollout_fraction: { type: number, minimum: 0.0, maximum: 1.0 }
        stage_started_at:
          type: string
          format: date-time
          nullable: true
        previous_release_id:
          type: string
          format: uuid
          nullable: true

    ReleaseChannelEntryCreate:
      type: object
      required: [component, version, channel, artifact_uri, artifact_sha256]
      properties:
        component: { type: string, enum: [service, agent] }
        version: { type: string }
        channel: { type: string, enum: [canary, beta, stable] }
        artifact_uri: { type: string }
        artifact_sha256:
          type: string
          minLength: 64
          maxLength: 64
          description: 64-character hex digest of the artifact.

    ReleaseChannelEntryPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReleaseChannelEntry' }
        meta:
          allOf:
            - $ref: '#/components/schemas/PageMeta'
            - type: object
              properties:
                publishing_available:
                  type: boolean
                  description: >-
                    Whether this server can publish a release (it needs
                    an installed release-signing key).
                publishing_unavailable_reason:
                  type: string
                  nullable: true
                  description: Why publishing is unavailable, or null.

    # ----------------------------------------------------------------
    # webhooks (inbound + outbound)
    # ----------------------------------------------------------------

    WebhookInReceiveResult:
      type: object
      description: >-
        Accept / reject envelope returned by the unauthenticated
        inbound receiver.
      required: [status, provider, hook_name]
      properties:
        status:
          type: string
          enum: [accepted, replay_ignored, rejected]
        provider: { type: string }
        hook_name: { type: string }
        request_id: { type: string, nullable: true }
        delivery_id: { type: string, nullable: true }
        domain_event_count: { type: integer, minimum: 0 }
        reason:
          type: string
          nullable: true
          description: Rejection reason when `status` is `rejected`.

    WebhookInIntegration:
      type: object
      description: An inbound webhook integration configuration.
      required: [webhook_id, project_id, provider, hook_name, enabled]
      properties:
        webhook_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        provider: { type: string }
        hook_name: { type: string }
        secret_ref:
          type: string
          nullable: true
          description: |
            Secrets-vault reference the shared secret is stored under --
            never the secret itself. `null` when the reference no longer
            names a vault secret.
        secret_configured:
          type: boolean
          description: Whether the vault holds the integration's shared secret.
        mtls_required: { type: boolean }
        description: { type: string }
        enabled: { type: boolean }
        created_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        disabled_at: { type: string, format: date-time, nullable: true }
        receiver_path:
          type: string
          description: Relative path of the inbound receiver for this hook.

    WebhookInIntegrationCreate:
      type: object
      description: Exactly one of `secret` and `secret_ref` is required.
      required: [project_id, provider, hook_name]
      properties:
        project_id: { type: string, format: uuid }
        provider: { type: string }
        hook_name: { type: string }
        secret:
          type: string
          writeOnly: true
          description: |
            The shared HMAC key. Stored in the secrets vault; never
            returned.
        secret_ref:
          type: string
          description: Name of an existing vault secret the caller may read.
        mtls_required: { type: boolean, default: false }
        description: { type: string }

    WebhookInIntegrationUpdate:
      type: object
      description: >-
        Mutable inbound-integration fields. M1 supports toggling
        `enabled` only.
      required: [enabled]
      properties:
        enabled: { type: boolean }

    WebhookInIntegrationPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WebhookInIntegration' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    WebhookInDelivery:
      type: object
      description: An inbound delivery row from the replay-cache ledger.
      required: [provider, hook_name, delivery_id]
      properties:
        provider: { type: string }
        hook_name: { type: string }
        delivery_id: { type: string }
        first_seen_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }

    WebhookInDeliveryPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WebhookInDelivery' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    WebhookOutSubscription:
      type: object
      description: An outbound webhook subscription (a delivery target).
      required: [subscription_id, project_id, name, url, enabled]
      properties:
        subscription_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        signature_scheme: { type: string }
        topic_filters:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        custom_headers:
          type: object
          additionalProperties: { type: string }
        created_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    WebhookOutSubscriptionCreate:
      type: object
      required: [project_id, name, url]
      properties:
        project_id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, format: uri }
        description: { type: string }
        secret_ref: { type: string }
        topic_filters:
          type: array
          items: { type: string }
        custom_headers:
          type: object
          additionalProperties: { type: string }

    WebhookOutSubscriptionCreated:
      description: >-
        The create response. When the service generated the
        signing secret (no `secret_ref` supplied), the secret is
        present ONCE as `signing_secret` and is never readable
        again through the API.
      allOf:
        - $ref: '#/components/schemas/WebhookOutSubscription'
        - type: object
          properties:
            signing_secret:
              type: string
              description: >-
                Generated HMAC signing secret; shown only on this
                response. Receivers verify the
                `X-Pychestrate-Signature` header with it.

    WebhookOutSubscriptionUpdate:
      type: object
      description: >-
        Mutable outbound-subscription fields. M1 supports toggling
        `enabled` only.
      required: [enabled]
      properties:
        enabled: { type: boolean }

    WebhookOutSubscriptionPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WebhookOutSubscription' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    WebhookOutDelivery:
      type: object
      description: One outbound delivery attempt.
      required: [delivery_id, subscription_id, project_id, topic, outcome]
      properties:
        delivery_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        topic: { type: string }
        payload_digest_sha256: { type: string, nullable: true }
        signature: { type: string, nullable: true }
        outcome:
          type: string
          enum: [pending, succeeded, failed, rejected_disabled]
        response_status: { type: integer, nullable: true }
        response_excerpt:
          type: string
          nullable: true
          description: >-
            Start of the receiver's response body, or why the request
            was not sent (`not sent: ...`) or not answered
            (`not delivered: ...`).
        duration_ms: { type: integer, nullable: true }
        attempted_at: { type: string, format: date-time, nullable: true }

    WebhookOutDeliveryPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WebhookOutDelivery' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    WebhookOutTestRequest:
      type: object
      description: Optional payload for a test-event send.
      properties:
        topic: { type: string }
        payload:
          type: object
          additionalProperties: true

    WebhookOutTestResult:
      type: object
      required: [status, delivery]
      properties:
        status:
          type: string
          description: The recorded delivery outcome.
          enum: [succeeded, failed]
        delivery: { $ref: '#/components/schemas/WebhookOutDelivery' }

    # ----------------------------------------------------------------
    # backups / disaster-recovery
    # ----------------------------------------------------------------

    BackupManifest:
      type: object
      description: >-
        Inventory of what a completed backup archive contains (the
        archive's own manifest.json). Key bytes are never included --
        only their fingerprints.
      properties:
        format: { type: string }
        format_version: { type: integer }
        backup_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        database:
          type: object
          properties:
            included: { type: boolean }
            dialect: { type: string, enum: [sqlite, postgresql] }
            artifact: { type: string, nullable: true }
            size_bytes: { type: integer, minimum: 0, nullable: true }
            sha256: { type: string }
            table_count: { type: integer, minimum: 0 }
            alembic_revision: { type: string, nullable: true }
            row_counts:
              type: object
              additionalProperties: { type: integer }
        object_store:
          type: object
          properties:
            included: { type: boolean }
            artifact_root: { type: string }
            object_count: { type: integer, minimum: 0, nullable: true }
            size_bytes: { type: integer, minimum: 0 }
        secrets:
          type: object
          properties:
            included: { type: boolean }
            entry_count: { type: integer, minimum: 0, nullable: true }
            key_bundle: { type: string, description: File name of the separate key bundle. }
            keys:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  key_id: { type: string, nullable: true }
                  source: { type: string, enum: [file, env] }
                  origin: { type: string }
                  sha256: { type: string }
                  size_bytes: { type: integer }
            skipped:
              type: object
              additionalProperties: { type: string }

    BackupRecord:
      type: object
      description: A backup record describing a triggered backup run.
      required: [backup_id, status, created_at]
      properties:
        backup_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, running, completed, failed]
        backend: { type: string, description: Storage-backend kind. }
        archive_uri:
          type: string
          nullable: true
          description: Backend-resolved location of the backup archive.
        archive_sha256: { type: string, nullable: true }
        size_bytes: { type: integer, minimum: 0, nullable: true }
        manifest: { $ref: '#/components/schemas/BackupManifest' }
        error_detail: { type: string, nullable: true }
        created_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    BackupCreateRequest:
      type: object
      description: Optional knobs for a backup trigger.
      properties:
        include_database: { type: boolean, default: true }
        include_object_store: { type: boolean, default: true }
        include_secrets: { type: boolean, default: true }
        note: { type: string }

    BackupRecordPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BackupRecord' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    BackupRestoreRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          default: false
          description: >-
            Verify the backup and return its restore command. Without
            it the answer is 409 -- the restore runs offline.

    BackupRestoreResult:
      type: object
      required: [backup_id, status, checks, restore_command]
      properties:
        backup_id: { type: string, format: uuid }
        status:
          type: string
          enum: [verified, verification_failed]
        detail: { type: string }
        checks:
          type: array
          items:
            type: object
            required: [name, ok, detail]
            properties:
              name: { type: string }
              ok: { type: boolean }
              detail: { type: string }
        archive_path: { type: string, nullable: true }
        key_bundle_path: { type: string, nullable: true }
        restore_command:
          type: string
          description: Command to run on the host with the service stopped.

    RpaExecutionMode:
      type: object
      properties:
        execution_mode: { type: string, enum: [process, tasker] }
        description: { type: string }
        implementation: { type: string }

    RpaJobStatus:
      type: string
      enum: [pending, dispatching, running, succeeded, failed, timeout, cancelled]

    RpaSource:
      type: object
      properties:
        kind: { type: string, enum: [git, package, local] }
        ref: { type: string, description: 'git: `url#ref`; package: `name==version`; local: a directory on the pod.' }

    RpaJobTypeVersion:
      type: object
      required: [version_id, type_id, version, source, entrypoint, environment, timeout_minutes, state]
      properties:
        version_id: { type: string, format: uuid }
        type_id: { type: string }
        version: { type: string }
        source: { $ref: '#/components/schemas/RpaSource' }
        entrypoint:
          type: object
          description: 'process: `{command: [...], packet_delivery: file|stdin|env, working_dir}`; tasker: `{workflow: path}` or `{tasking: module@Class}`.'
        environment:
          type: object
          additionalProperties: { type: string }
        timeout_minutes: { type: integer }
        state: { type: string, enum: [active, deprecated, retired] }
        published_by_id: { type: [string, 'null'] }
        published_at: { type: [string, 'null'], format: date-time }

    RpaJobType:
      type: object
      required: [type_id, display_name, execution_mode, state, versions]
      properties:
        type_id: { type: string }
        display_name: { type: string }
        description: { type: string }
        execution_mode: { type: string, enum: [process, tasker] }
        capability_requirements:
          type: array
          items: { type: string }
        packet_schema: { type: [object, 'null'], description: JSON Schema draft 2020-12. }
        secret_fields:
          type: array
          items: { type: string }
          description: JSON pointers or dotted paths redacted in stored packets.
        state: { type: string, enum: [active, retired] }
        created_by_id: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        active_version_count: { type: integer }
        latest_active_version: { type: [string, 'null'] }
        versions:
          type: array
          items: { $ref: '#/components/schemas/RpaJobTypeVersion' }

    RpaJobTypeList:
      type: object
      required: [job_types, total]
      properties:
        job_types:
          type: array
          items: { $ref: '#/components/schemas/RpaJobType' }
        total: { type: integer }

    RpaJobTypeCreateRequest:
      type: object
      required: [type_id, display_name]
      properties:
        type_id: { type: string, pattern: '^[a-z][a-z0-9-]{2,63}$' }
        display_name: { type: string }
        description: { type: string }
        execution_mode: { type: string, enum: [process, tasker], default: process }
        capability_requirements:
          type: array
          items: { type: string }
        packet_schema: { type: [object, 'null'] }
        secret_fields:
          type: array
          items: { type: string }

    RpaJobTypeUpdateRequest:
      type: object
      properties:
        display_name: { type: string }
        description: { type: string }
        capability_requirements:
          type: array
          items: { type: string }
        packet_schema: { type: [object, 'null'] }
        secret_fields:
          type: array
          items: { type: string }

    RpaJobTypeVersionPublishRequest:
      type: object
      required: [version, entrypoint]
      properties:
        version: { type: string, description: Semantic versions sort highest for latest-active; other labels sort after them. }
        source: { $ref: '#/components/schemas/RpaSource' }
        source_kind: { type: string, enum: [git, package, local] }
        source_ref: { type: string }
        entrypoint: { type: object }
        environment:
          type: object
          additionalProperties: { type: string }
        timeout_minutes: { type: integer, default: 60 }

    RpaSpec:
      type: object
      required: [spec_id, project_id, name, type_id, version_selector, default_packet, revision]
      properties:
        spec_id: { type: string, format: uuid }
        project_id: { type: string }
        name: { type: string }
        type_id: { type: string }
        type_display_name: { type: string }
        execution_mode: { type: string, enum: [process, tasker] }
        version_selector: { type: string, description: '`latest-active` or an exact version label.' }
        resolved_version: { type: [string, 'null'] }
        default_packet: { type: object }
        packet_schema: { type: [object, 'null'] }
        target_pod_id: { type: [string, 'null'] }
        required_capabilities:
          type: array
          items: { type: string }
        timeout_minutes: { type: [integer, 'null'] }
        description: { type: string }
        revision: { type: integer }
        created_by_id: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    RpaSpecList:
      type: object
      required: [specs, total, offset, limit]
      properties:
        specs:
          type: array
          items: { $ref: '#/components/schemas/RpaSpec' }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }

    RpaSpecRequest:
      type: object
      required: [name, type_id]
      properties:
        name: { type: string, maxLength: 128 }
        type_id: { type: string }
        version_selector: { type: string, default: latest-active }
        default_packet: { type: object }
        target_pod_id: { type: [string, 'null'] }
        required_capabilities:
          type: array
          items: { type: string }
        timeout_minutes: { type: [integer, 'null'] }
        description: { type: string }

    RpaTriggerRequest:
      type: object
      additionalProperties: false
      properties:
        work_packet: { type: object, description: Merged over the specification's default packet; packet keys win. }
        idempotency_key: { type: string }
        allow_duplicate: { type: boolean, default: false, description: Start a new job even when an identical one was submitted within the idempotency window. }

    RpaJob:
      type: object
      required: [job_id, project_id, spec_name, type_id, resolved_version, execution_mode, work_packet, status]
      properties:
        job_id: { type: string, format: uuid }
        project_id: { type: string }
        spec_id: { type: [string, 'null'], format: uuid }
        spec_name: { type: string }
        spec_revision: { type: integer }
        type_id: { type: string }
        resolved_version: { type: string }
        execution_mode: { type: string, enum: [process, tasker] }
        work_packet: { type: object, description: Secret fields are redacted. }
        packet_digest: { type: string }
        status: { $ref: '#/components/schemas/RpaJobStatus' }
        run_state: { type: [string, 'null'] }
        exit_code: { type: [integer, 'null'] }
        dispatch_attempt_id: { type: [string, 'null'], format: uuid }
        envelope_id: { type: [string, 'null'], format: uuid }
        client_id: { type: [string, 'null'], format: uuid }
        pod_id: { type: [string, 'null'], format: uuid }
        triggered_by_id: { type: [string, 'null'] }
        trigger_cause: { type: object }
        result_root_key: { type: [string, 'null'] }
        final_state_reason: { type: string }
        created_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        duration_seconds: { type: [integer, 'null'] }
        replayed: { type: boolean, description: True when this response returned an earlier identical job instead of starting a new one. }

    RpaJobList:
      type: object
      required: [jobs, total, offset, limit]
      properties:
        jobs:
          type: array
          items: { $ref: '#/components/schemas/RpaJob' }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }

    UiSurface:
      type: string
      enum: [build, testing, rpa, infra]

    UiSurfacesRequest:
      type: object
      required: [surfaces]
      properties:
        surfaces:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/UiSurface' }

    UiSurfaceCatalogEntry:
      type: object
      properties:
        surface: { $ref: '#/components/schemas/UiSurface' }
        label: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        allowed: { type: boolean }

    UiProfileDeployment:
      type: object
      required: [surfaces]
      properties:
        surfaces:
          type: array
          items: { $ref: '#/components/schemas/UiSurface' }
        governed_entries:
          type: object
          additionalProperties: { type: integer }
        catalog:
          type: array
          items: { $ref: '#/components/schemas/UiSurfaceCatalogEntry' }
        variable_name: { type: string }

    UiSurfacesPreference:
      type: object
      required: [effective, deployment]
      properties:
        surfaces:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/UiSurface' }
          description: The caller's override, or null when using the deployment default.
        effective:
          type: array
          items: { $ref: '#/components/schemas/UiSurface' }
        deployment:
          type: array
          items: { $ref: '#/components/schemas/UiSurface' }
        override_reset: { type: boolean }
        catalog:
          type: array
          items: { $ref: '#/components/schemas/UiSurfaceCatalogEntry' }

    ReleaseTemplate:
      type: object
      required: [template_id, project_id, name]
      properties:
        template_id: { type: integer }
        project_id: { type: integer }
        name: { type: string }
        description: { type: string }
        default_channel: { type: [string, 'null'] }
        version_pattern:
          type: [string, 'null']
          description: A regular expression a release version must match.
        default_repo_ids:
          type: array
          items: { type: integer }
        default_pipeline: { type: [object, 'null'], additionalProperties: true }
        default_schedule: { type: [object, 'null'], additionalProperties: true }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    ReleaseTemplateWrite:
      type: object
      description: >
        Body of a create or a change. `name` is required when creating; a
        change carries only the fields it sets.
      properties:
        name: { type: string }
        description: { type: string }
        default_channel: { type: [string, 'null'] }
        version_pattern: { type: [string, 'null'] }
        default_repo_ids:
          type: [array, 'null']
          items: { type: integer }
        default_pipeline: { type: [object, 'null'], additionalProperties: true }
        default_schedule: { type: [object, 'null'], additionalProperties: true }

    ReleaseTemplatePage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReleaseTemplate' }
        meta: { $ref: '#/components/schemas/PageMeta' }
