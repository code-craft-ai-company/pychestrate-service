openapi: 3.1.0
info:
  title: Pychestrate Service API
  version: 0.0.15-preview
  description: |
    Authoritative REST contract for the **Pychestrate** continuous integration
    and orchestration service.

    This document is the single source of truth for the `/api/v1/*` HTTP
    surface. It is consumed by:

    * `automojo-restclient-base`'s `RestClientGenerator`, which produces the
      typed Python client `automojo-restclient-pychestrate`.
    * Server-side route implementations in the `pychestrate-service` repo
      (route handlers are expected to conform to the schemas declared here).
    * External integrators and tooling authors.

    ## Scope

    * Every endpoint currently implemented under
      `source/site/automojo/pychestrate/webservice/**/restapi/v1/*_routes.py`
      is described.
    * Endpoints planned for the Phase 3 minimum-viable test-run slice
      (runs, dispatch ack, progress, results, test catalog, artifacts,
      SSE events) are also described — these are flagged with the
      `x-pychestrate-status: planned` extension on the operation.

    The HTML admin / consumer UI surfaces under `/admin/*`, `/setup/*`,
    `/login`, and the projects / resources blueprints are **not** part of
    this contract; they are server-rendered HTML.

    ## Conventions

    * All paths are versioned under `/api/v1/`.
    * Path / query / request / response field names are `snake_case`.
    * Resource identifiers in paths use snake_case (`run_id`,
      `project_id`, `pod_id`, ...).
    * Non-CRUD verbs on a resource use the colon-action form
      (`/projects/{project_id}/test-catalog:import`).
    * All timestamps are ISO-8601 / RFC 3339 UTC strings
      (`2026-05-17T19:42:00Z`).
    * Every 4xx / 5xx response is a RFC 7807 Problem Document
      (`application/problem+json`) — see the `Problem` schema.
    * Paginated list endpoints return a `Page<T>` envelope (see the
      `Page` schema for the shape) so the codegen surfaces them through
      `automojo.restclient.base.pagedlist.PagedList`.
  contact:
    name: Automation Mojo LLC
    url: https://github.com/automationmojo/pychestrate-service
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://tc-app-server.tailb75ce6.ts.net/api/v1
    description: Author's live alpha deployment (Tailscale-fronted).
  - url: https://{host}/api/v1
    description: Generic templated server; supply the deployment host.
    variables:
      host:
        default: pychestrate.example.com
        description: Hostname of the Pychestrate service.

tags:
  - name: auth
    description: Local-credential authentication and session lifecycle.
  - name: me
    description: Permissions and identity of the currently-authenticated actor.
  - name: users
    description: User account administration.
  - name: rbac
    description: Roles, permissions, role bindings, and permission checks.
  - name: audit
    description: Append-only audit log access.
  - name: secrets
    description: >-
      Org / project / user-scoped encrypted-secrets management with full CRUD.
      Metadata responses never carry the secret value; only the dedicated
      value-read endpoint returns plaintext, and only to authorized callers.
  - name: variables
    description: Hierarchical typed configuration variables.
  - name: flags
    description: Feature flags (runtime toggles).
  - name: tagging
    description: Shared tag model across entities.
  - name: retention
    description: Per-data-class retention policies.
  - name: notifications
    description: Notification channels (email, Slack, webhook, ...).
  - name: project_templates
    description: Scaffolded new-project presets.
  - name: projects
    description: Project workspaces — the top-level entity that owns runs,
      pods, members, repositories, builds, and tests.
  - name: clients
    description: Registered pod client agents.
  - name: enrollment
    description: Client-enrollment bootstrap tokens (mTLS issuance).
  - name: agents
    description: Agent rollouts and per-client capability inventory.
  - name: pods
    description: Pod definitions, registrations, topology, and templates.
  - name: plugin_api
    description: Plugin-API catalog metadata for installed extensions.
  - name: runs
    description: Run-state reads (`GET /runs/...`).
  - name: test_runs
    description: Trigger a new test run on a project + pod.
  - name: test_catalog
    description: Per-project test-catalog entries.
  - name: dispatch
    description: Pod-client → server dispatch acknowledgements.
  - name: progress
    description: Pod-client → server live progress ingestion.
  - name: results
    description: Pod-client → server final-result manifests.
  - name: artifacts
    description: Artifact listings and browsing for a run.
  - name: builds
    description: Trigger and read build runs for a project.
  - name: pipelines
    description: >-
      Pipeline-definition documents (the DAG of build/test/script
      stages) plus DAG validation and matrix-sharding preview.
  - name: source_integrations
    description: Per-project source-integration (SCM) configuration.
  - name: environments
    description: Register and read named target environments for a project.
  - name: provisioning
    description: Trigger and read infrastructure provisioning runs.
  - name: drift
    description: Read drift status and trigger drift checks on environments.
  - name: metrics
    description: >-
      Metric catalog, timeseries queries, and test-result rollups
      for testbase / testplus runs.
  - name: dashboards
    description: Project metric dashboards (named tile collections).
  - name: metric_alerts
    description: Per-project metric-alert rules.
  - name: resource_pools
    description: >-
      Capability-tagged resource pools, pool membership, and pool
      reservations (checkout / release of eligible pool members).
  - name: resources
    description: >-
      Per-resource reads -- the resource record, current health
      probe state, and the resource usage-history timeline.
  - name: webhooks
    description: >-
      Inbound + outbound webhooks. The inbound receiver
      (POST /webhooks/in/{provider}/{hook_name}) is
      unauthenticated and verified by per-integration
      signature. The operator-facing integration, subscription,
      and delivery-history routes are cookie/RBAC gated.

security:
  - pychestrate_session: []
  - pychestrate_api_key: []

paths:

  # =====================================================================
  # auth
  # =====================================================================

  /auth/logout:
    post:
      tags: [auth]
      summary: Close the current session.
      operationId: auth_logout
      description: |
        Close the session named in the request body. Returns
        `{session_id, status: "closed"}` on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Session closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # =====================================================================
  # me
  # =====================================================================

  /me/permissions:
    get:
      tags: [me]
      summary: List the current actor's effective permissions.
      operationId: me_get_permissions
      description: |
        Returns the set of permission keys granted to the calling actor by
        the RBAC evaluator, plus the actor's user_id and a list of role
        bindings.
      responses:
        '200':
          description: Effective permission snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MePermissions'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # =====================================================================
  # users
  # =====================================================================

  /identity/users:
    post:
      tags: [users]
      summary: Create a user account.
      operationId: users_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /identity/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'
    get:
      tags: [users]
      summary: Read a user account.
      operationId: users_get_by_id
      responses:
        '200':
          description: User account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404': { $ref: '#/components/responses/NotFound' }

  # =====================================================================
  # rbac
  # =====================================================================

  /rbac/permissions:
    get:
      tags: [rbac]
      summary: List declared RBAC permission keys.
      operationId: rbac_list_permissions
      responses:
        '200':
          description: All declared permissions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RbacPermission' }
  /rbac/roles:
    get:
      tags: [rbac]
      summary: List declared roles.
      operationId: rbac_list_roles
      responses:
        '200':
          description: All declared roles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RbacRole' }
  /rbac/bindings:
    get:
      tags: [rbac]
      summary: List role bindings.
      operationId: rbac_list_bindings
      parameters:
        - in: query
          name: user_id
          schema: { type: string, format: uuid }
        - in: query
          name: project_id
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Matching role bindings.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RbacRoleBinding' }
    post:
      tags: [rbac]
      summary: Create a role binding.
      operationId: rbac_create_binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RbacRoleBindingCreateRequest'
      responses:
        '201':
          description: Role binding created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RbacRoleBinding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /rbac/bindings/{binding_id}:
    parameters:
      - in: path
        name: binding_id
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [rbac]
      summary: Delete a role binding.
      operationId: rbac_delete_binding
      responses:
        '204':
          description: Binding deleted.
        '404': { $ref: '#/components/responses/NotFound' }
  /rbac/check:
    post:
      tags: [rbac]
      summary: Check whether the actor has a permission in a scope.
      operationId: rbac_check_permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RbacCheckRequest'
      responses:
        '200':
          description: Permission decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RbacCheckResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # =====================================================================
  # audit
  # =====================================================================

  /audit:
    get:
      tags: [audit]
      summary: List audit-log records.
      operationId: audit_list
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - in: query
          name: after_sequence
          description: Only return records whose sequence_number is greater than this value.
          schema: { type: integer, minimum: 0 }
        - in: query
          name: actor_id
          schema: { type: string, format: uuid }
        - in: query
          name: action
          schema: { type: string }
      responses:
        '200':
          description: Audit records (ordered by sequence_number ascending).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditRecord' }
  /audit/{sequence_number}:
    parameters:
      - in: path
        name: sequence_number
        required: true
        schema: { type: integer, minimum: 0 }
    get:
      tags: [audit]
      summary: Read a single audit record by sequence number.
      operationId: audit_get_by_sequence
      responses:
        '200':
          description: Audit record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditRecord' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =====================================================================
  # secrets
  # =====================================================================

  /secrets:
    get:
      tags: [secrets]
      summary: List secret metadata (no plaintext), filtered by scope.
      operationId: secrets_list
      parameters:
        - in: query
          name: scope_kind
          description: Restrict the listing to one scope kind.
          schema: { $ref: '#/components/schemas/SecretScopeKind' }
        - in: query
          name: scope_ref
          description: >-
            Restrict the listing to one scope_ref (a project_id for
            PROJECT scope or a user_id for USER scope).
          schema: { type: string }
      responses:
        '200':
          description: Secret metadata records (never carries values).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Secret' }
    post:
      tags: [secrets]
      summary: Create a secret (value KEK-encrypted at rest).
      operationId: secrets_create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretCreateRequest' }
      responses:
        '201':
          description: The created secret metadata (never carries the value).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Secret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /secrets/value/{secret_ref}:
    parameters:
      - in: path
        name: secret_ref
        description: Slash-delimited secret reference path (e.g. `vault/myteam/api-token`).
        required: true
        schema: { type: string }
    get:
      tags: [secrets]
      summary: Read the decrypted secret value (permission-gated, audit-logged).
      operationId: secrets_get_value
      responses:
        '200':
          description: The decrypted secret value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretValue' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
  /secrets/{secret_ref}:
    parameters:
      - in: path
        name: secret_ref
        description: Slash-delimited secret reference path (e.g. `vault/myteam/api-token`).
        required: true
        schema: { type: string }
    get:
      tags: [secrets]
      summary: Read a single secret's metadata (never the value).
      operationId: secrets_get_by_ref
      responses:
        '200':
          description: Secret metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Secret' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [secrets]
      summary: Rotate / update a secret value.
      operationId: secrets_update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretUpdateRequest' }
      responses:
        '200':
          description: The updated secret metadata (never carries the value).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Secret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [secrets]
      summary: Delete a secret and every version.
      operationId: secrets_delete
      responses:
        '204':
          description: The secret was deleted.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =====================================================================
  # variables
  # =====================================================================

  /variables/effective:
    get:
      tags: [variables]
      summary: Resolve effective variable values for a project / pod / run scope.
      operationId: variables_get_effective
      parameters:
        - in: query
          name: project_id
          schema: { type: string, format: uuid }
        - in: query
          name: pod_id
          schema: { type: string, format: uuid }
        - in: query
          name: run_id
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Effective variable map with inheritance trace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariableEffectiveSet' }

  /variables/{scope}/{scope_id}:
    parameters:
      - $ref: '#/components/parameters/VariableScopeParam'
      - $ref: '#/components/parameters/VariableScopeIdParam'
    get:
      tags: [variables]
      summary: List variables declared at a specific scope.
      operationId: variables_list_scope
      responses:
        '200':
          description: Variables declared at the scope.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Variable' }

  /variables/{scope}/{scope_id}/{name}:
    parameters:
      - $ref: '#/components/parameters/VariableScopeParam'
      - $ref: '#/components/parameters/VariableScopeIdParam'
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [variables]
      summary: Read one variable at a specific scope.
      operationId: variables_get_one
      responses:
        '200':
          description: Variable definition at the scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variable' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [variables]
      summary: Upsert one variable at a specific scope.
      operationId: variables_put_one
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariableUpsertRequest' }
      responses:
        '200':
          description: Variable upserted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variable' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [variables]
      summary: Delete one variable at a specific scope.
      operationId: variables_delete_one
      responses:
        '204':
          description: Variable deleted.
        '404': { $ref: '#/components/responses/NotFound' }

  # =====================================================================
  # flags
  # =====================================================================

  /flags:
    get:
      tags: [flags]
      summary: List feature flags.
      operationId: flags_list
      responses:
        '200':
          description: Declared flags.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FeatureFlag' }
    post:
      tags: [flags]
      summary: Create a new feature flag.
      operationId: flags_create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeatureFlagCreateRequest' }
      responses:
        '201':
          description: Flag created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /flags/backends:
    get:
      tags: [flags]
      summary: List installed feature-flag backends.
      operationId: flags_list_backends
      responses:
        '200':
          description: Registered backends.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FeatureFlagBackend' }
  /flags/{flag_key}:
    parameters:
      - $ref: '#/components/parameters/FlagKeyParam'
    get:
      tags: [flags]
      summary: Read a feature flag.
      operationId: flags_get_by_key
      responses:
        '200':
          description: Flag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlag' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [flags]
      summary: Update a feature flag.
      operationId: flags_update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeatureFlagUpdateRequest' }
      responses:
        '200':
          description: Flag updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /flags/{flag_key}/retire:
    parameters:
      - $ref: '#/components/parameters/FlagKeyParam'
    post:
      tags: [flags]
      summary: Retire a feature flag.
      operationId: flags_retire
      responses:
        '200':
          description: Flag retired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlag' }
        '404': { $ref: '#/components/responses/NotFound' }
  /flags/{flag_key}/history:
    parameters:
      - $ref: '#/components/parameters/FlagKeyParam'
    get:
      tags: [flags]
      summary: Read change history for a feature flag.
      operationId: flags_get_history
      responses:
        '200':
          description: History entries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FeatureFlagHistoryEntry' }
  /flags/{flag_key}/evaluate:
    parameters:
      - $ref: '#/components/parameters/FlagKeyParam'
    post:
      tags: [flags]
      summary: Evaluate a feature flag against an actor / context.
      operationId: flags_evaluate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeatureFlagEvaluateRequest' }
      responses:
        '200':
          description: Evaluation result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlagEvaluateResponse' }

  # =====================================================================
  # tagging
  # =====================================================================

  /tags/search:
    get:
      tags: [tagging]
      summary: Search tag definitions.
      operationId: tagging_search
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: taxonomy
          schema: { type: string }
      responses:
        '200':
          description: Matching tags.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Tag' }
  /tags/taxonomies:
    get:
      tags: [tagging]
      summary: List declared tag taxonomies.
      operationId: tagging_list_taxonomies
      responses:
        '200':
          description: Taxonomies.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TagTaxonomy' }
  /tags/{entity_kind}/{entity_id}:
    parameters:
      - $ref: '#/components/parameters/EntityKindParam'
      - $ref: '#/components/parameters/EntityIdParam'
    get:
      tags: [tagging]
      summary: List tags attached to an entity.
      operationId: tagging_list_for_entity
      responses:
        '200':
          description: Tag attachments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Tag' }
    post:
      tags: [tagging]
      summary: Attach a tag to an entity.
      operationId: tagging_attach
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagAttachRequest' }
      responses:
        '201':
          description: Tag attached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
  /tags/{entity_kind}/{entity_id}/{tag}:
    parameters:
      - $ref: '#/components/parameters/EntityKindParam'
      - $ref: '#/components/parameters/EntityIdParam'
      - in: path
        name: tag
        required: true
        schema: { type: string }
    delete:
      tags: [tagging]
      summary: Detach a tag from an entity.
      operationId: tagging_detach
      responses:
        '204':
          description: Tag detached.
        '404': { $ref: '#/components/responses/NotFound' }

  # =====================================================================
  # retention
  # =====================================================================

