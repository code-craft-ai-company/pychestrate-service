      summary: Read a single build run.
      operationId: builds_read
      responses:
        '200':
          description: Build run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
