  /projects/{project_id}/builds:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [builds]
      summary: List build runs for a project.
      operationId: builds_list
      description: |
        Returns a paginated page of build runs for the project,
        newest-first. The optional `state` query param filters by
        build-run lifecycle state.
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of build runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildRunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [builds]
      summary: Trigger a new build run on a project.
      operationId: builds_trigger
      description: |
        Resolves the named `runner_kind` (via the
        `build_runner_kind` factory protocol), validates the
        runner inputs, computes the reproducibility digest,
        persists the build run and dispatches a `job_kind=build`
        envelope to an eligible pod.

        A build must name its source: a registered
        `source_integration_id`, or `runner_inputs.git_url` (with an
        optional `git_ref`), or `runner_inputs.source_dir` for a tree
        already present on the pod. A trigger naming none of these is
        refused with 422 instead of dispatching a build the pod cannot
        run.
      requestBody:
        required: true
        content:
          application/json:
            example:
              runner_kind: makefile
              runner_inputs:
                git_url: https://git.example.com/acme/shop.git
                git_ref: main
                targets:
                - all
            schema: { $ref: '#/components/schemas/BuildRunCreateRequest' }
      responses:
        '202':
          description: Build run accepted and dispatched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Request conflicts with current resource state.
          content:
            application/problem+json:
              example:
                type: /errors/conflict
                title: Conflict
                status: 409
                detail: No enrolled pod matches the build job's requirements -- enroll a client/pod first.
                instance: /api/v1/projects/5dcb26cd-4085-42ea-90ea-18891c42e818/builds
                project_id: 5dcb26cd-4085-42ea-90ea-18891c42e818
                reason: no_eligible_pod
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }

