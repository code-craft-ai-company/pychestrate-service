  /projects/{project_id}/test-catalog:import:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    post:
      tags: [test_catalog]
      summary: Run a test-catalog importer (e.g., testbase project discovery).
      operationId: test_catalog_import
      description: |
        Invokes the named importer (resolved via the
        `test_catalog_importer` factory protocol) against the project.
        Each import overwrites entries with the same
        `(project_id, importer_tag, entry_key)` key in place.

        The service cannot walk a testbase project on the pods, so the
        `testbase-project` importer catalogs the tests the source
        names: `includes` (testbase include expressions, one entry
        each, with optional `root`, `ref` and
        `required_capability_tags`) and / or full `entries`. An import
        that would add nothing -- an empty source, a malformed include
        or entry, or an importer that finds no entries -- answers 422
        with the reason and `entries_imported: 0`; it is never
        reported as a successful import.
      requestBody:
