  # =====================================================================
  # notifications
  # =====================================================================

  /notifications/channels:
    get:
      tags: [notifications]
      summary: List notification channels.
      description: >-
        Lists the places notifications can be delivered to (an email server, a Slack
        or Teams webhook, PagerDuty, a generic webhook). A secret setting is shown as
        its `secret://` reference, never as its value. Requires
        `system:notifications.read`.
      operationId: notifications_list_channels
      responses:
        '200':
          description: Channels.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationChannel' }
    post:
      tags: [notifications]
      summary: Create a notification channel.
      description: >-
        Each kind has settings, some of them secret (an SMTP `password`, the `url` of a
        Slack or Teams webhook, a PagerDuty `routing_key`, a generic webhook's
        `authorization`). Send a secret in `secrets`; it is stored in the secrets vault
        and the channel keeps a `secret://` reference. Or point `config` at an existing
        vault secret the caller may read, as `"secret://<name>"` (a pinned version is
        refused). A secret given as plain text in `config` is refused. A missing or
        unknown setting, a wrong shape, or an address that is not `http://` or `https://`
        is a 400 whose `problems` member lists every one. Requires
        `system:notifications.write`.
      operationId: notifications_create_channel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelCreateRequest' }
      responses:
        '201':
          description: Channel created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A channel with this name already exists in the scope.
  /notifications/channels/{channel_id}:
    parameters:
      - in: path
        name: channel_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [notifications]
      summary: Read a notification channel.
      description: Requires `system:notifications.read`.
      operationId: notifications_get_channel
      responses:
        '200':
          description: Channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [notifications]
      summary: Switch a notification channel on or off, change its settings, or replace its secrets.
      description: >-
        Any of `disabled`, `config` (the plain settings to change) and `secrets` (a new
        value for a secret setting). A new secret becomes a new version of the channel's
        own vault secret, so the channel follows it; for a setting that is unset, points
        at someone else's secret, or is still held as plain text, the value is stored
        under the channel's own name and the setting now points at it. Requires
        `system:notifications.write`.
      operationId: notifications_update_channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                disabled: { type: boolean }
                config: { type: object, additionalProperties: true }
                secrets:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: The channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [notifications]
      summary: Delete a notification channel.
      description: >-
        Deletes the channel and the vault secrets the service stored for it (never a
        vault secret it merely pointed at). Refused with 409 while a routing rule still
        sends through it. Requires `system:notifications.write`.
      operationId: notifications_delete_channel
      responses:
        '204':
          description: Channel deleted.
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A routing rule still sends through the channel.
  /notifications/channels/{channel_id}/test:
    parameters:
      - in: path
        name: channel_id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [notifications]
      summary: Send a test message through a notification channel.
      description: >-
        Sends one test message so an administrator learns whether the channel's settings
        work before a real event needs them. A message that could not be delivered is
        still a 200, with `delivered` false and the reason. Requires
        `system:notifications.write`.
      operationId: notifications_test_channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient]
              additionalProperties: false
              properties:
                recipient:
                  type: string
                  description: Who or where to send it (for email, an address).
      responses:
        '200':
          description: How the send went.
          content:
            application/json:
              schema:
                type: object
                required: [delivered, error_message, latency_ms]
                properties:
                  delivered: { type: boolean }
                  error_message: { type: string }
                  latency_ms: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/routing-rules:
    get:
      tags: [notifications]
      summary: List notification routing rules.
      description: >-
        Lists the rules that turn a run event into messages, optionally only
        those of one project. Requires `system:notifications.read`.
      operationId: notifications_list_routing_rules
      parameters:
        - in: query
          name: project_id
          schema: { type: string, format: uuid }
          description: Only the rules of this project.
      responses:
        '200':
          description: Routing rules, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationRoutingRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [notifications]
      summary: Create a notification routing rule.
      description: >-
        When a run fails or completes (the events `entity.run.failed` and
        `entity.run.completed`), send the template through each channel to each
        recipient. A rule with a `project_id` applies to that project's runs; one
        without it applies to every project. A rule that could never fire is
        refused with the reason: a pattern that matches neither event, an unknown
        template, a channel that does not exist, no recipient. Requires
        `system:notifications.write`.
      operationId: notifications_create_routing_rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationRoutingRuleCreateRequest' }
      responses:
        '201':
          description: Rule created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationRoutingRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /notifications/routing-rules/{rule_id}:
    parameters:
      - in: path
        name: rule_id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [notifications]
      summary: Turn a notification routing rule off or on.
      operationId: notifications_update_routing_rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              additionalProperties: false
              properties:
                disabled: { type: boolean }
      responses:
        '200':
          description: The rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationRoutingRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [notifications]
      summary: Delete a notification routing rule.
      operationId: notifications_delete_routing_rule
      responses:
        '204':
          description: Rule deleted.
        '404': { $ref: '#/components/responses/NotFound' }

