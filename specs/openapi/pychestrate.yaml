        Recent inbound deliveries (the replay-cache ledger) for
        audit / debug, newest-first.
      parameters:
        - in: query
          name: provider
          schema: { type: string }
        - in: query
          name: hook_name
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Page of inbound delivery ledger rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInDeliveryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /webhooks/out/subscriptions:
    get:
