        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---- 8-webhooks-in / 8-webhooks-out PR p21a ----
  /webhooks/in/{provider}/{hook_name}:
    parameters:
      - in: path
        name: provider
        required: true
        schema: { type: string }
      - in: path
        name: hook_name
        required: true
        schema: { type: string }
    post:
      tags: [webhooks]
      summary: Inbound webhook receiver.
      operationId: webhooks_in_receive
      x-pychestrate-status: planned
      security: []
      description: |
        The unauthenticated inbound receiver. External systems
        POST provider-native events here. The handler runs the
        domain's signature verification, replay-cache de-dup,
        normalization, and dispatch. Authentication is the
        per-integration signature compare -- no cookie/RBAC gate
        applies. Answers `202` on accept, `401` on a bad or
        missing signature, `409` on a replayed delivery, `404`
        for an unknown provider/integration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Event accepted (dispatched or replay-ignored).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInReceiveResult' }
        '401':
          description: Signature verification failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInReceiveResult' }
        '404':
          description: No configured integration for provider/hook_name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInReceiveResult' }
        '409':
          description: Replayed delivery -- already seen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookInReceiveResult' }

  /webhooks/in/integrations:
    get:
      tags: [webhooks]
      summary: List inbound webhook integrations.
      operationId: webhooks_in_integrations_list
      x-pychestrate-status: planned
      parameters:
        - in: query
          name: project_id
          required: true
