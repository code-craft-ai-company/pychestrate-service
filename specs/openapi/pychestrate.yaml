  /projects/{project_id}/pipeline-runs:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [pipelines]
      summary: List pipeline runs for a project.
      operationId: pipeline_runs_list
      x-pychestrate-status: planned
      description: |
        Returns a paginated page of pipeline runs for the project,
        newest-started first. Each run carries its per-stage and
        per-step status.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of pipeline runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [pipelines]
      summary: Trigger a pipeline run.
      operationId: pipeline_runs_trigger
      x-pychestrate-status: planned
      description: |
        Triggers a pipeline run from a supplied pipeline-definition
        document. The DAG-walking `PipelineOrchestrator` parses and
        DAG-checks the document, persists a `PipelineRun` plus its
        per-stage and per-step rows, and dispatches the root stages'
        jobs through the existing build / test / provision dispatch.
        A stage becomes eligible once every stage it `needs` has
        completed successfully; a stage failure skips its dependents
        and fails the run. An optional `matrix` object requests
        matrix expansion of the stage set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineRunTriggerRequest' }
      responses:
        '201':
          description: Pipeline run triggered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{project_id}/pipeline-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - in: path
        name: run_id
        required: true
        schema: { type: string, format: uuid }
        description: Pipeline-run UUID.
    get:
      tags: [pipelines]
      summary: Read a single pipeline run.
      operationId: pipeline_runs_read
      x-pychestrate-status: planned
      description: |
