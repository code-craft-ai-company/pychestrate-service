      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled, rejected_by_guard]
        - in: query
          name: environment_id
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Page of provisioning runs.
          content:
