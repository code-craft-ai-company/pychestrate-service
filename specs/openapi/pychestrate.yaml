      responses:
        '200':
          description: Resource pool.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePool' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [resource_pools]
      summary: Delete a resource pool.
      operationId: resource_pools_delete
      x-pychestrate-status: planned
      description: |
        Hard-deletes the pool. Pool-membership rows cascade through
        the `resources_resource_pool_member` foreign key.
      responses:
        '204': { description: Resource pool deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /resource-pools/{pool_id}/resources:
