      operationId: projects_create_release_template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseTemplateWrite' }
      responses:
        '201':
          description: Template created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{project_id}/release-templates/{template_id}:
    parameters:
      - $ref: '#/components/parameters/ReleaseProjectIdParam'
      - $ref: '#/components/parameters/ReleaseTemplateIdParam'
    get:
      tags: [projects]
      summary: Read a release template.
      description: Requires system:release_templates.read.
      operationId: projects_get_release_template
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [projects]
      summary: Change a release template.
      description: >
        Requires system:release_templates.write. Only the fields present in
        the body are changed.
      operationId: projects_update_release_template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseTemplateWrite' }
      responses:
        '200':
          description: Template updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [projects]
      summary: Delete a release template.
      description: Requires system:release_templates.write.
      operationId: projects_delete_release_template
      responses:
        '204':
          description: Template deleted.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{project_id}/release-templates/{template_id}/create-release:
    parameters:
      - $ref: '#/components/parameters/ReleaseProjectIdParam'
      - $ref: '#/components/parameters/ReleaseTemplateIdParam'
    post:
      tags: [projects]
      summary: Create a draft release from a release template.
      description: >
        Requires system:release_templates.read and system:projects.write.
        The template's channel, version pattern, repositories, pipeline and
        schedule are copied into the release metadata together with
        template_id and template_name; keys in the request's metadata
        overwrite them. The version must be a semantic version and, when the
        template has a version pattern, match it.
      operationId: projects_create_release_from_template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, example: 1.4.0 }
                name:
                  type: string
                  description: Defaults to "<template name> <version>".
                description:
                  type: string
                  description: Defaults to the template's description.
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Draft release created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  release_id: { type: integer }
                  project_id: { type: integer }
                  version: { type: string }
                  name: { type: string }
                  description: { type: string }
                  status: { type: string, example: draft }
                  metadata: { type: object, additionalProperties: true }
                  created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

