[tool.poetry]
name = "pychestrate-service"
description = "Code Craft AI - Pychestrate Service"
version = "0.0.7-preview"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX",
    "Private :: Do Not Upload"
]
keywords = [
    "python"
]
packages = [
    {include="ccai", from="source/packages"},
    {include="ccai", from="source/site"},
]

[tool.poetry.scripts]
pyc = "ccai.pychestrate.cli.entry:console_main"
pychestrate-admin = "ccai.pychestrate.admin.__main__:console_main"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-foundations = { version = "<2.0.0", source = "codecraftai" }
codecraftai-runtime = { version = "<2.0.0", source = "codecraftai" }
codecraftai-credentials = { version = "<2.0.0", source = "codecraftai" }
codecraftai-dataprofiles = { version = "<2.0.0", source = "codecraftai" }
codecraftai-storage-database = { version = "<2.0.0", source = "codecraftai" }
codecraftai-testbase = { version = "<2.0.0", source = "codecraftai" }
codecraftai-webworks = { version = "<2.0.0", source = "codecraftai" }
# NOTE: pychestrate-core was previously a git-source dep but it
# ships an empty ``ccai/pychestrate/__init__.py`` that
# converts ``ccai.pychestrate`` from a PEP-420 namespace
# package into a regular package, blocking access to
# ``ccai.pychestrate.webservice`` (which lives at
# ``source/site/ccai/pychestrate/webservice/``). The repo
# provides the ``ccai.pychestrate.core.*`` modules it
# actually consumes (``orm``, ``defaults``, ``managers``,
# ``migrations``) from ``source/packages/ccai/pychestrate/
# core/`` directly, so the external dep was redundant -- the
# only file that referenced pychestrate-core's installed content
# was ``source/packages/ccai/pychestrate/core/dbio.py``, which
# has since been deleted along with
# ``source/site/ccai/pychestrate/webservice/dbio.py``. Both were
# dead code duplicating ``ccai.storage.database.dbio``, which
# arrives with ``codecraftai-storage-database`` (a webworks
# dependency) and exposes the same five functions.
psycopg2-binary = "^2.9.10"
aiosmtpd = "^1.4.6"
alembic = "^1.13.0"
gunicorn = "^23.0.0"

[tool.poetry.group.dev.dependencies]
myst-parser = "^0.18.1"
sphinx = ">=1.6,<6"
sphinx-rtd-theme = "^1.1.1"
# OpenAPI 3.1 validator used by ``make openapi-validate`` to guard the
# authoritative REST contract at ``specs/openapi/pychestrate.yaml``.
openapi-spec-validator = "^0.7"

[tool.poetry.group.test.dependencies]
# Browser-driven UI tests (testbase + Playwright, no pytest plugin).
# After ``poetry install`` run ``playwright install chromium`` once
# to download the browser binary; on minimal Linux containers add
# ``--with-deps`` to install the X11 / font system libs.
playwright = "^1.45"
# HTTP-level smoke tests against the deployed service (login
# round-trips, form posts, redirect chains, JSON API contracts).
httpx = "^0.27"
# HTML parsing for the httpx-based tests (CSRF token extraction,
# rendered-page assertions). Kept out of the runtime deps.
beautifulsoup4 = "^4.12"

[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
