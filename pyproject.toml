[tool.poetry]
name = "pychestrate-service"
description = "Automation Mojo - Pychestrate Service"
version = "0.0.1"
authors = []
readme = "README.md"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="automojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
authlib = "^1.6.0"
flask = "^2.2.3"
flask-restx = "^1.1.0"
sqlalchemy = "^2.0.30"
sqlalchemy-utils = "^0.41.2"
gunicorn = "^20.1.0"
itsdangerous = "<2.0.1"
automojo-errors = { git = "https://github.com/automationmojo/automojo-errors.git", branch = "main" }
automojo-runtime = { git = "https://github.com/automationmojo/automojo-runtime.git", branch = "main" }
automojo-credentials = { git = "https://github.com/automationmojo/automojo-credentials.git", branch = "main" }
automojo-dataprofiles = { git = "https://github.com/automationmojo/automojo-dataprofiles.git", branch = "main" }
pychestrate-core = { git = "https://github.com/automationmojo/pychestrate-core.git", branch = "main" }
authlib-provider-support = "^0.0.1"
psycopg2-binary = "^2.9.10"
aiosmtpd = "^1.4.6"

[tool.poetry.group.dev.dependencies]
myst-parser = "^0.18.1"
sphinx = ">=1.6,<6"
sphinx-rtd-theme = "^1.1.1"

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
