[tool.poetry]
name = "pychestrate-service"
description = "Automation Mojo - Pychestrate Service"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [
    {include="automojo", from="source/packages"},
    {include="automojo", from="source/site"},
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
automojo-errors = { git = "https://github.com/automationmojo/automojo-errors.git", branch = "main" }
automojo-runtime = { git = "https://github.com/automationmojo/automojo-runtime.git", branch = "main" }
automojo-credentials = { git = "https://github.com/automationmojo/automojo-credentials.git", branch = "main" }
automojo-dataprofiles = { git = "https://github.com/automationmojo/automojo-dataprofiles.git", branch = "main" }
automojo-storage-database = { git = "https://github.com/automationmojo/automojo-storage-database.git", branch = "main" }
automojo-testbase = { git = "https://github.com/automationmojo/automojo-testbase.git", branch = "main" }
automojo-webworks = { git = "https://github.com/automationmojo/automojo-webworks.git", branch = "main" }
# NOTE: pychestrate-core was previously a git-source dep but it
# ships an empty ``automojo/pychestrate/__init__.py`` that
# converts ``automojo.pychestrate`` from a PEP-420 namespace
# package into a regular package, blocking access to
# ``automojo.pychestrate.webservice`` (which lives at
# ``source/site/automojo/pychestrate/webservice/``). The repo
# provides the ``automojo.pychestrate.core.*`` modules it
# actually consumes (``orm``, ``defaults``, ``managers``,
# ``migrations``) from ``source/packages/automojo/pychestrate/
# core/`` directly, so the external dep was redundant -- the
# only file that referenced pychestrate-core's installed content
# was ``source/packages/automojo/pychestrate/core/dbio.py``,
# which is dead code (no consumer in the codebase). When dbio
# is retired (post-alpha cleanup) it can be deleted; for now
# leaving it in place is harmless because nothing imports it.
psycopg2-binary = "^2.9.10"
aiosmtpd = "^1.4.6"
alembic = "^1.13.0"

[tool.poetry.group.dev.dependencies]
myst-parser = "^0.18.1"
sphinx = ">=1.6,<6"
sphinx-rtd-theme = "^1.1.1"

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
