<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <!-- codecraftai-webworks mj-* component library: design tokens,
         base stylesheet, and the barrel module that registers every
         <mj-*> custom element. Loaded BEFORE the pyc-* bundles so
         the components are available when the bundles run. -->
    <link rel="stylesheet" href="/mj/styles/tokens.css">
    <!-- Pychestrate design tokens: defines every --pyc-* custom
         property the shell and bundles consume, with light + dark
         palettes that flip on the same data-theme / OS-preference
         guards as the mj tokens above. Loaded AFTER /mj/styles/
         tokens.css so the cascade between the packs stays
         deterministic. -->
    <link rel="stylesheet" href="/static/styles/pyc-tokens.css">
    <link rel="stylesheet" href="/mj/styles/base.css">
    <script type="module" src="/static/javascript/pyc-mj-lib/index.js"></script>
    <link rel="stylesheet" href="/static/javascript/pyc-site-shell/pyc-site-shell.css">
    {%- for bundle_name in bundle_names %}
    <script type="module" src="/static/javascript/{{ bundle_name }}/index.js"></script>
    {%- endfor %}
</head>
<body>
    <pyc-site-shell
        initial-route="{{ initial_route }}"
        permissions-endpoint="/api/v1/me/permissions"
        navigation-endpoint="/api/v1/me/navigation"
        palette-timeout-ms="5000"
        aria-label="Pychestrate site shell"
        brand-label="Pychestrate">
        {%- if content_html %}
        {{ content_html|safe }}
        {%- endif %}
    </pyc-site-shell>
</body>
</html>
