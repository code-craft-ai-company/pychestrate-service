{% extends "resources/base.html" %}

{% block title %}Not Found - Pychestrate Resources{% endblock %}

{% block content %}
<div style="text-align: center; padding: 60px 20px;">
    <span class="material-icons" style="font-size: 96px; color: #6c757d;" aria-hidden="true">search_off</span>
    <h2 style="margin: 20px 0 10px; color: #1a1a2e;">Page Not Found</h2>
    <p style="color: #6c757d; margin-bottom: 30px;">The page you're looking for doesn't exist or has been moved.</p>
    <div style="display: flex; gap: 10px; justify-content: center;">
        <a href="{{ url_for('resources.dashboard') }}" class="btn btn-primary">
            <span class="material-icons" aria-hidden="true">home</span> Go to Dashboard
        </a>
        <a href="javascript:history.back()" class="btn btn-secondary">
            <span class="material-icons" aria-hidden="true">arrow_back</span> Go Back
        </a>
    </div>
</div>
{% endblock %}
