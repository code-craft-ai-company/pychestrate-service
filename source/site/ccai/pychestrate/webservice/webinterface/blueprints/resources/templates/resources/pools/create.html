{% extends "resources/base.html" %}

{% block title %}Create Pool - Pychestrate Resources{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Create Resource Pool</h2>
    <p>Create a new pool to organize resources</p>
</div>

<div class="card" style="max-width: 600px;">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div class="form-group">
            <label for="name">Pool Name *</label>
            <input type="text" id="name" name="name" class="form-control" required
                   value="{{ form_data.name if form_data else '' }}"
                   pattern="[a-zA-Z0-9][a-zA-Z0-9_\-]*">
            <p class="form-text">Alphanumeric characters, underscores, and hyphens only</p>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="3">{{ form_data.description if form_data else '' }}</textarea>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary">
                <span class="material-icons">save</span> Create Pool
            </button>
            <a href="{{ url_for('resources.pool_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
