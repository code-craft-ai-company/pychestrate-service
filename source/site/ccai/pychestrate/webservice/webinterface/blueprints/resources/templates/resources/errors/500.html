{% extends "resources/base.html" %}

{% block title %}Server Error - Pychestrate Resources{% endblock %}

{% block content %}
<div style="text-align: center; padding: 60px 20px;">
    <span class="material-icons" style="font-size: 96px; color: #dc3545;">error</span>
    <h2 style="margin: 20px 0 10px; color: #1a1a2e;">Server Error</h2>
    <p style="color: #6c757d; margin-bottom: 30px;">An unexpected error occurred. Please try again later.</p>
    <div style="display: flex; gap: 10px; justify-content: center;">
        <a href="{{ url_for('resources.dashboard') }}" class="btn btn-primary">
            <span class="material-icons">home</span> Go to Dashboard
        </a>
        <a href="javascript:history.back()" class="btn btn-secondary">
            <span class="material-icons">arrow_back</span> Go Back
        </a>
    </div>
</div>
{% endblock %}
