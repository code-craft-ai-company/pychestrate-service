{% extends "config/chromeless_base.html" %}

{% block title %}Login - Pychestrate Configuration{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        max-width: 400px;
        margin: 100px auto;
        padding: 40px;
        background: var(--pyc-color-surface);
        border-radius: 8px;
        box-shadow: var(--pyc-shadow-elevated, 0 4px 20px rgba(0, 0, 0, 0.1));
    }
    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }
    .login-header h2 {
        margin: 0 0 10px;
        color: var(--pyc-color-on-surface);
    }
    .login-header p {
        color: var(--pyc-color-on-surface-muted);
        margin: 0;
    }
    .login-form .form-group {
        margin-bottom: 20px;
    }
    .login-form .btn {
        width: 100%;
        padding: 12px;
        font-size: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-header">
        <h2>Welcome Back</h2>
        <p>Sign in to access the configuration panel</p>
    </div>
    
    <form method="post" action="/login" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        {% if next_target %}
        <input type="hidden" name="next" value="{{ next_target }}">
        {% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control"
                   required autofocus autocomplete="username" placeholder="Enter your username">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control"
                   required autocomplete="current-password" placeholder="Enter your password">
        </div>
        
        <button type="submit" class="btn btn-primary">Sign In</button>
    </form>
</div>
{% endblock %}
