{% extends "config/base.html" %}

{% block title %}Edit Scope - Pychestrate Configuration{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Edit Secret Scope</h2>
    <p>Update the description for scope "{{ scope.name }}"</p>
</div>

<div class="card" style="max-width: 600px;">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
            <label for="name">Scope Name</label>
            <input type="text" id="name" class="form-control" disabled
                   value="{{ scope.name }}">
            <p class="form-text">Scope names are immutable &mdash; secrets reference their scope by name.</p>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="3">{{ scope.description or '' }}</textarea>
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary">
                <span class="material-icons">save</span> Save Changes
            </button>
            <a href="{{ url_for('config.scope_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
