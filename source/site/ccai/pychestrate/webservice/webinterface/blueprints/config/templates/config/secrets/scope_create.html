{% extends "config/base.html" %}

{% block title %}Create Scope - Pychestrate Configuration{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Create Secret Scope</h2>
    <p>Add a new scope for organizing secrets</p>
</div>

<div class="card" style="max-width: 600px;">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div class="form-group">
            <label for="name">Scope Name *</label>
            <input type="text" id="name" name="name" class="form-control" required
                   value="{{ form_data.name if form_data else '' }}"
                   pattern="[a-zA-Z][a-zA-Z0-9_-]*">
            <p class="form-text">Alphanumeric, underscores, and hyphens. Must start with a letter.</p>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="3">{{ form_data.description if form_data else '' }}</textarea>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary">
                <span class="material-icons">save</span> Create Scope
            </button>
            <a href="{{ url_for('config.scope_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
