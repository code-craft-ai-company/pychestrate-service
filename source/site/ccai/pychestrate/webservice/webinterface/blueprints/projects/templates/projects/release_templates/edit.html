{% extends "projects/base.html" %}

{% block title %}Edit {{ template.name }} - Release Templates - {{ project.name }}{% endblock %}

{% block content %}
<div class="breadcrumb">
    <a href="{{ url_for('projects.project_list') }}">Projects</a>
    <span>/</span>
    <a href="{{ url_for('projects.project_detail', project_id=project.id) }}">{{ project.name }}</a>
    <span>/</span>
    <a href="{{ url_for('projects.release_template_list', project_id=project.id) }}">Release Templates</a>
    <span>/</span>
    <a href="{{ url_for('projects.release_template_detail', project_id=project.id, template_id=template.id) }}">{{ template.name }}</a>
    <span>/</span>
    <span>Edit</span>
</div>

<div class="page-header">
    <h2>Edit Release Template</h2>
</div>

<form method="post" action="{{ url_for('projects.release_template_edit', project_id=project.id, template_id=template.id) }}" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" class="form-control" required
               value="{{ form_data.get('name') if form_data else template.name }}" maxlength="128">
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" class="form-control" rows="2">{{ form_data.get('description') if form_data else (template.description or '') }}</textarea>
    </div>

    <div class="form-group">
        <label for="default_channel">Default Channel</label>
        <input type="text" id="default_channel" name="default_channel" class="form-control"
               value="{{ form_data.get('default_channel') if form_data else (template.default_channel or '') }}" maxlength="128">
    </div>

    <div class="form-group">
        <label for="version_pattern">Version Pattern</label>
        <input type="text" id="version_pattern" name="version_pattern" class="form-control"
               value="{{ form_data.get('version_pattern') if form_data else (template.version_pattern or '') }}" maxlength="128">
    </div>

    <div class="form-group">
        <label for="default_repo_ids">Default Repository IDs</label>
        <input type="text" id="default_repo_ids" name="default_repo_ids" class="form-control"
               value="{{ form_data.get('default_repo_ids') if form_data else default_repo_ids_csv }}" placeholder="comma-separated">
    </div>

    <div class="form-group">
        <label for="default_pipeline">Default Pipeline (JSON object)</label>
        <textarea id="default_pipeline" name="default_pipeline" class="form-control" rows="6" style="font-family: monospace;">{{ form_data.get('default_pipeline') if form_data else default_pipeline_json }}</textarea>
    </div>

    <div class="form-group">
        <label for="default_schedule">Default Schedule (JSON object)</label>
        <textarea id="default_schedule" name="default_schedule" class="form-control" rows="4" style="font-family: monospace;">{{ form_data.get('default_schedule') if form_data else default_schedule_json }}</textarea>
    </div>

    <div style="display: flex; gap: 10px;">
        <button type="submit" class="btn btn-primary">
            <span class="material-icons">save</span> Save Changes
        </button>
        <a href="{{ url_for('projects.release_template_detail', project_id=project.id, template_id=template.id) }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
