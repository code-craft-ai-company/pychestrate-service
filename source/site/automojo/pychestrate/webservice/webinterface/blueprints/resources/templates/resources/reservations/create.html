{% extends "resources/base.html" %}

{% block title %}Create Reservation - Pychestrate Resources{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Create Reservation</h2>
    <p>Reserve a resource for future use</p>
</div>

<div class="card" style="max-width: 700px;">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div class="form-group">
            <label for="resource_id">Resource *</label>
            <select id="resource_id" name="resource_id" class="form-control" required>
                <option value="">Select a resource</option>
                {% for resource in resources %}
                <option value="{{ resource.id }}" {% if form_data and form_data.resource_id|string == resource.id|string %}selected{% endif %}>{{ resource.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="start_time">Start Time *</label>
            <input type="datetime-local" id="start_time" name="start_time" class="form-control" required
                   value="{{ form_data.start_time if form_data else '' }}">
        </div>
        
        <div class="form-group">
            <label for="end_time">End Time *</label>
            <input type="datetime-local" id="end_time" name="end_time" class="form-control" required
                   value="{{ form_data.end_time if form_data else '' }}">
        </div>
        
        <div class="form-group">
            <label for="mode">Allocation Mode</label>
            <select id="mode" name="mode" class="form-control">
                <option value="exclusive" {% if not form_data or form_data.mode == 'exclusive' %}selected{% endif %}>Exclusive</option>
                <option value="shared" {% if form_data and form_data.mode == 'shared' %}selected{% endif %}>Shared</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="job_id">Job ID (optional)</label>
            <input type="text" id="job_id" name="job_id" class="form-control"
                   value="{{ form_data.job_id if form_data else '' }}">
        </div>
        
        <div class="form-group">
            <label for="reason">Reason</label>
            <textarea id="reason" name="reason" class="form-control" rows="3">{{ form_data.reason if form_data else '' }}</textarea>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary">
                <span class="material-icons">save</span> Create Reservation
            </button>
            <a href="{{ url_for('resources.reservation_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
