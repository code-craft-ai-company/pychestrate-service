{% extends "config/base.html" %}

{% block title %}Create Role - Pychestrate Configuration{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Create Role</h2>
    <p>Add a new role with specific permissions</p>
</div>

<div class="card" style="max-width: 600px;">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div class="form-group">
            <label for="name">Role Name *</label>
            <input type="text" id="name" name="name" class="form-control" required
                   value="{{ form_data.name if form_data else '' }}">
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="3">{{ form_data.description if form_data else '' }}</textarea>
        </div>
        
        {% if permissions %}
        <div class="form-group">
            <label>Permissions</label>
            <div style="max-height: 300px; overflow-y: auto; border: 1px solid #ced4da; border-radius: 4px; padding: 10px;">
                {% for permission in permissions %}
                <div style="margin: 5px 0;">
                    <label style="font-weight: normal;">
                        <input type="checkbox" name="permission_ids" value="{{ permission.id }}"
                               {% if form_data and permission.id|string in form_data.getlist('permission_ids') %}checked{% endif %}>
                        {{ permission.name }}
                        {% if permission.description %}<span style="color: #6c757d;"> - {{ permission.description }}</span>{% endif %}
                    </label>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}
        
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary">
                <span class="material-icons">save</span> Create Role
            </button>
            <a href="{{ url_for('config.role_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
