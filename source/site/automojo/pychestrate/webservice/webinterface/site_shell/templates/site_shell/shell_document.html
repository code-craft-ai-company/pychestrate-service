<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="/static/javascript/pyc-site-shell/pyc-site-shell.css">
    {%- for bundle_name in bundle_names %}
    <script type="module" src="/static/javascript/{{ bundle_name }}/index.js"></script>
    {%- endfor %}
</head>
<body>
    <pyc-site-shell
        initial-route="{{ initial_route }}"
        permissions-endpoint="/api/v1/me/permissions"
        navigation-endpoint="/api/v1/me/navigation"
        palette-timeout-ms="5000"
        aria-label="Pychestrate site shell"
        brand-label="Pychestrate">
        {%- if content_html %}
        {{ content_html|safe }}
        {%- endif %}
    </pyc-site-shell>
</body>
</html>
