[alembic]
# Path to migration scripts. Relative to where alembic is invoked
# (the repo root, via ``make db-*`` targets).
script_location = alembic

# Path-separated list of additional template files (default uses
# script.py.mako under script_location).
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Encoding for migration script files generated by autogenerate.
output_encoding = utf-8

# sqlalchemy.url is intentionally left blank. The runtime URL is
# read from PYCHESTRATE_DATABASE_URL inside alembic/env.py so the
# same Makefile target works for dev SQLite and production
# Postgres without editing this file. Operators who need to run
# alembic against a one-off URL can pass --x or set
# PYCHESTRATE_DATABASE_URL inline.
sqlalchemy.url =

# Treat datetime columns as timezone-aware in autogenerate
# diffs. Pychestrate uses ``DateTime(timezone=True)`` consistently
# (per the persistence layer), so this avoids spurious "type
# changed" diffs on every revision.
timezone = UTC

# ---------------------------------------------------------------------------
# Logging — alembic delegates to Python's stdlib logging. The
# defaults below mirror the ``alembic init`` template; raise
# ``alembic`` to DEBUG to see the migration step-by-step.
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
