[alembic]
# Path to the migration scripts directory.
script_location = alembic

# Template used to generate migration filenames.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Where to find migration scripts. Defaults to the script_location.
prepend_sys_path = .

# Timezone for new migration timestamps. UTC keeps file ordering
# deterministic across operator timezones.
timezone = UTC

# Truncate the slug component of the filename so historical
# revisions stay readable.
truncate_slug_length = 60

# Required by alembic >= 1.4 to opt in to the canonical revision-id
# generator that includes a timestamp + uniqueness check.
revision_environment = false

# DB URL is read at runtime from PYCHESTRATE_DATABASE_URL via env.py
# rather than hard-coded here, so the same alembic.ini works against
# every deployment target.
sqlalchemy.url = driver://user:pass@host/dbname


[post_write_hooks]
# No post-write hooks today. When formatting becomes a concern,
# wire ruff or black here.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
