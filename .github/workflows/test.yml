name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-build:
    name: poetry install + sanity import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        run: |
          pipx install poetry
          poetry --version

      - name: Cache poetry virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Configure poetry to use in-tree venv
        run: |
          poetry config virtualenvs.in-project true

      - name: Configure git to clone private automojo-* deps
        env:
          AUTOMOJO_REPO_TOKEN: ${{ secrets.AUTOMOJO_REPO_TOKEN }}
        run: |
          if [ -z "${AUTOMOJO_REPO_TOKEN}" ]; then
            echo "::error::AUTOMOJO_REPO_TOKEN secret is not set." \
                 "The pyproject.toml git-source deps (automojo-errors," \
                 "automojo-runtime, automojo-arcli, automojo-credentials," \
                 "automojo-dataprofiles, automojo-storage-database," \
                 "automojo-testbase, automojo-webworks, pychestrate-core)" \
                 "live in private repos under the automationmojo org and the" \
                 "default GITHUB_TOKEN cannot read sibling private repos." \
                 "Add a fine-grained PAT (Contents: Read on the automationmojo" \
                 "org private repos) to this repo's secrets as AUTOMOJO_REPO_TOKEN."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${AUTOMOJO_REPO_TOKEN}@github.com/automationmojo/".insteadOf \
            "https://github.com/automationmojo/"

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Sanity import — modern auth + RBAC
        env:
          PYTHONPATH: source/site:source/packages:source/service:source/testroots/testbase
        run: |
          poetry run python -c "
          from automojo.pychestrate.webservice.security.auth import local_flow, session_service
          from automojo.pychestrate.webservice.security.rbac import rbac_evaluator
          from automojo.pychestrate.webservice.webinterface.blueprints.config.auth_adapter import (
              ConsumerUISecurityAdapter,
          )
          print('OK: modern auth + RBAC + adapter import cleanly')
          "

  alembic-upgrade-sqlite:
    name: alembic upgrade head against fresh SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        run: pipx install poetry

      - name: Configure poetry to use in-tree venv
        run: poetry config virtualenvs.in-project true

      - name: Configure git to clone private automojo-* deps
        env:
          AUTOMOJO_REPO_TOKEN: ${{ secrets.AUTOMOJO_REPO_TOKEN }}
        run: |
          if [ -z "${AUTOMOJO_REPO_TOKEN}" ]; then
            echo "::error::AUTOMOJO_REPO_TOKEN secret is not set" \
                 "(see lint-and-build job for setup instructions)."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${AUTOMOJO_REPO_TOKEN}@github.com/automationmojo/".insteadOf \
            "https://github.com/automationmojo/"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run alembic upgrade head against tempfile sqlite
        env:
          PYCHESTRATE_DATABASE_URL: "sqlite:///./pych-ci-alembic.sqlite"
        run: |
          poetry run alembic upgrade head

      - name: Confirm both metadata trees produced tables
        env:
          PYCHESTRATE_DATABASE_URL: "sqlite:///./pych-ci-alembic.sqlite"
        run: |
          poetry run python <<'PY'
          import sqlite3
          db = sqlite3.connect("./pych-ci-alembic.sqlite")
          rows = db.execute(
              "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
          ).fetchall()
          names = [r[0] for r in rows]
          print("tables ({}):".format(len(names)))
          for n in names:
              print(" ", n)
          must_have_phase1 = ["identity_users", "auth_local_credentials", "auth_sessions",
                              "rbac_roles", "rbac_role_bindings", "rbac_role_permissions"]
          must_have_legacy = ["user", "password_history", "sessions", "permissions",
                              "system_roles", "role_permissions"]
          missing = [t for t in must_have_phase1 + must_have_legacy if t not in names]
          if len(missing) > 0:
              raise SystemExit("MISSING TABLES: {}".format(missing))
          print("OK: phase1 + legacy schema present")
          PY

  testbase-singlehost-sweep:
    name: testbase singlehost sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        run: pipx install poetry

      - name: Configure poetry to use in-tree venv
        run: poetry config virtualenvs.in-project true

      - name: Configure git to clone private automojo-* deps
        env:
          AUTOMOJO_REPO_TOKEN: ${{ secrets.AUTOMOJO_REPO_TOKEN }}
        run: |
          if [ -z "${AUTOMOJO_REPO_TOKEN}" ]; then
            echo "::error::AUTOMOJO_REPO_TOKEN secret is not set" \
                 "(see lint-and-build job for setup instructions)."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${AUTOMOJO_REPO_TOKEN}@github.com/automationmojo/".insteadOf \
            "https://github.com/automationmojo/"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run singlehost sweep (brittle phase10 e2e modules excluded)
        env:
          PYTHONPATH: source/site:source/packages:source/service:source/testroots/testbase
        run: |
          mkdir -p .output/ci-singlehost
          # The phase10 e2e modules p13q/p13r/p13u/p13v/p13ac/p13ae
          # are blocked by a pre-existing test-isolation issue in
          # the full-suite ordering -- they pass cleanly when run
          # alone (see "phase10 e2e (run alone)" job below).
          #
          # Cannot use ``--excludes`` to filter them: testbase
          # absolutizes ``--root`` (cli/cmdtree/testing/run.py:172
          # via ``os.path.abspath``) so candidate file paths used
          # by ``utilities.find_included_modules_under_root``'s
          # exclusion filter (line 226-228) are absolute, while
          # the prefix derived from a dotted ``--excludes``
          # argument can never have a leading ``/``. The exclusion
          # check ``candidate.startswith(prefix)`` therefore never
          # matches, and the flag is silently a no-op. (Tracked
          # for upstream fix in automojo-testbase.)
          #
          # Workaround: enumerate the includes explicitly so the
          # brittle modules never get picked up. phase1..phase9 +
          # restapi are broad-included as packages; phase10 is
          # enumerated by stable-prefix wildcards (p10*/p11*/p12*)
          # and the 17 stable p13 module names.
          poetry run testbase testing run \
            --root source/testroots/automojo \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase2 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase3 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase4 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase5 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase6 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase7 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase8 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase9 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.restapi \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p10 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p11 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p12 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13a_alembic_setup_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13ab_production_startup_smoke_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13b_webui_foundation_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13c_webui_session_csrf_flash_guard_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13d_config_webui_port_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13e_config_users_roles_routes_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13f_config_variables_scopes_routes_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13g_config_secrets_sessions_audit_routes_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13h_resources_core_port_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13i_resources_pools_ipools_port_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13j_resources_allocations_reservations_port_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13k_resources_health_tags_port_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13l_projects_core_members_port_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13m_projects_repositories_port_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13n_projects_builds_infra_port_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13o_projects_tests_releases_port_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13p_projects_calendar_watches_final_m1 \
            --output=./.output/ci-singlehost

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbase-singlehost-output
          path: .output/ci-singlehost
          retention-days: 7

  phase10-e2e-isolated:
    name: phase10 consumer-UI e2e (run alone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        run: pipx install poetry

      - name: Configure poetry to use in-tree venv
        run: poetry config virtualenvs.in-project true

      - name: Configure git to clone private automojo-* deps
        env:
          AUTOMOJO_REPO_TOKEN: ${{ secrets.AUTOMOJO_REPO_TOKEN }}
        run: |
          if [ -z "${AUTOMOJO_REPO_TOKEN}" ]; then
            echo "::error::AUTOMOJO_REPO_TOKEN secret is not set" \
                 "(see lint-and-build job for setup instructions)."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${AUTOMOJO_REPO_TOKEN}@github.com/automationmojo/".insteadOf \
            "https://github.com/automationmojo/"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run only the phase10 consumer-UI e2e modules
        env:
          PYTHONPATH: source/site:source/packages:source/service:source/testroots/testbase
        run: |
          mkdir -p .output/ci-e2e
          poetry run testbase testing run \
            --root source/testroots/automojo \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13q_consumer_ui_e2e_smoke_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13r_consumer_ui_e2e_authed_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13u_static_assets_e2e_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13v_consumer_ui_e2e_rbac_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13ac_consumer_ui_e2e_tier4_m1 \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13ae_alpha_acceptance_m1 \
            --output=./.output/ci-e2e

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-e2e-output
          path: .output/ci-e2e
          retention-days: 7

  alembic-upgrade-postgres:
    name: alembic upgrade head against Postgres 14
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: pychestrate_ci
          POSTGRES_PASSWORD: pychestrate_ci
          POSTGRES_DB: pychestrate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pychestrate_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        run: pipx install poetry

      - name: Configure poetry to use in-tree venv
        run: poetry config virtualenvs.in-project true

      - name: Configure git to clone private automojo-* deps
        env:
          AUTOMOJO_REPO_TOKEN: ${{ secrets.AUTOMOJO_REPO_TOKEN }}
        run: |
          if [ -z "${AUTOMOJO_REPO_TOKEN}" ]; then
            echo "::error::AUTOMOJO_REPO_TOKEN secret is not set" \
                 "(see lint-and-build job for setup instructions)."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${AUTOMOJO_REPO_TOKEN}@github.com/automationmojo/".insteadOf \
            "https://github.com/automationmojo/"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run alembic upgrade head against Postgres
        env:
          PYCHESTRATE_DATABASE_URL: "postgresql+psycopg2://pychestrate_ci:pychestrate_ci@127.0.0.1:5432/pychestrate_ci"
        run: |
          poetry run alembic upgrade head

      - name: Confirm both metadata trees produced tables on Postgres
        env:
          PGPASSWORD: pychestrate_ci
        run: |
          # Use the postgres CLI to dump the table list.
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U pychestrate_ci -d pychestrate_ci -At -c \
            "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename;" \
            | tee /tmp/pg-tables.txt
          for required in identity_users auth_local_credentials auth_sessions \
                          rbac_roles rbac_role_bindings rbac_role_permissions \
                          audit_records \
                          "user" password_history sessions permissions \
                          system_roles role_permissions; do
              if ! grep -qx "${required}" /tmp/pg-tables.txt; then
                  echo "MISSING TABLE on Postgres: ${required}" >&2
                  exit 1
              fi
          done
          echo "OK: phase1 + legacy schema present on Postgres"

  production-startup-smoke:
    name: production startup smoke (subprocess)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        run: pipx install poetry

      - name: Configure poetry to use in-tree venv
        run: poetry config virtualenvs.in-project true

      - name: Configure git to clone private automojo-* deps
        env:
          AUTOMOJO_REPO_TOKEN: ${{ secrets.AUTOMOJO_REPO_TOKEN }}
        run: |
          if [ -z "${AUTOMOJO_REPO_TOKEN}" ]; then
            echo "::error::AUTOMOJO_REPO_TOKEN secret is not set" \
                 "(see lint-and-build job for setup instructions)."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${AUTOMOJO_REPO_TOKEN}@github.com/automationmojo/".insteadOf \
            "https://github.com/automationmojo/"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run the production startup smoke (subprocess-isolated)
        env:
          PYTHONPATH: source/site:source/packages:source/service:source/testroots/testbase
        run: |
          mkdir -p .output/ci-smoke
          poetry run testbase testing run \
            --root source/testroots/automojo \
            --includes=automojo.tests.singlehost.pychestrate.webservice.phase10.test_p13ab_production_startup_smoke_m1 \
            --output=./.output/ci-smoke

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-output
          path: .output/ci-smoke
          retention-days: 7
