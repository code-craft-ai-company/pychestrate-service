# Publishes pychestrate-cli (the ``pyc`` command line) to PyPI.
#
# The CLI's sources live in this repository's service tree (source/site/ccai/pychestrate/cli), and
# packages/pychestrate-cli packages them on their own. This workflow is separate from publish.yml, which
# releases pychestrate-service: PyPI trusts a publisher by workflow file name, and the two projects are
# versioned independently (the CLI's version is PYC_VERSION in ccai/pychestrate/cli/version.py).
#
# Runs when PYC_VERSION changes on main, and on demand through workflow_dispatch (``force``). A release
# has to clear four gates, in this order:
#
# 1. ``test``   -- the repository's own tests (test.yml) must pass.
# 2. ``build``  -- the wheel is built and must pass ``twine check --strict``. Only a wheel is released:
#                  the package's source directory points two levels up, so a source archive of it would
#                  not contain the CLI's sources.
# 3. ``pypi``   -- the job waits for approval of the ``pypi`` environment (required reviewers;
#                  deployments are limited to main).
# 4. The upload uses PyPI trusted publishing: no token is stored anywhere.
#
# One-time setup on pypi.org (Account settings > Publishing > Add a new pending publisher), before the
# first release:
#
#     PyPI project name : pychestrate-cli
#     Owner             : code-craft-ai-company
#     Repository name   : pychestrate-service
#     Workflow name     : publish-cli.yml
#     Environment name  : pypi
#
# PyPI accepts a version once and never again. To release: raise PYC_VERSION, push to main, and approve
# the ``pypi`` deployment. To run the pipeline for the current version (a failed run, or the first
# release), run this workflow by hand with ``force`` set.
#
# pychestrate-service also installs these CLI files (the ``pyc`` command comes with it), so the two
# packages own the same files; do not install both into one environment.

name: Publish CLI

on:
  push:
    branches: [main]
    paths:
      - source/site/ccai/pychestrate/cli/version.py
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the version did not change"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      current: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD~1 is needed to tell whether the version actually changed.
          fetch-depth: 2

      - name: Determine whether PYC_VERSION changed
        id: version
        run: |
          VERSION_FILE=source/site/ccai/pychestrate/cli/version.py
          read_version () {
            python3 - "$1" <<'PY'
          import re, sys
          match = re.search(r'^PYC_VERSION: str = "([^"]+)"', sys.argv[1], re.M)
          print(match.group(1) if match else "")
          PY
          }

          current=$(read_version "$(cat "$VERSION_FILE")")
          if [ -z "$current" ]; then
            echo "::error::$VERSION_FILE declares no PYC_VERSION."
            exit 1
          fi

          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            previous=$(read_version "$(git show "HEAD~1:$VERSION_FILE" 2>/dev/null || true)")
          else
            previous=""
          fi

          echo "current=${current}" >> "$GITHUB_OUTPUT"

          if [ "${current}" = "${previous}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "PYC_VERSION is unchanged at ${current}; nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "PYC_VERSION ${previous:-<none>} -> ${current}; publishing."
          fi

  test:
    name: test
    needs: version
    if: needs.version.outputs.changed == 'true'
    uses: ./.github/workflows/test.yml

  build:
    name: build and check
    needs: [version, test]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build the wheel
        run: |
          python -m build --wheel --outdir dist packages/pychestrate-cli
          ls -l dist/

      - name: Check that the wheel carries the version being released
        run: |
          wheel=$(ls dist/*.whl)
          case "$wheel" in
            *"-${{ needs.version.outputs.current }}-"*) echo "wheel: $wheel" ;;
            *) echo "::error::$wheel does not carry PYC_VERSION ${{ needs.version.outputs.current }}"; exit 1 ;;
          esac

      - name: Check the distribution
        run: twine check --strict dist/*

      - name: Keep the distribution for the upload job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: upload to PyPI
    needs: [version, build]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pychestrate-cli/
    permissions:
      # Trusted publishing exchanges this job's OIDC token for a PyPI upload token.
      id-token: write
    steps:
      - name: Fetch the distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
