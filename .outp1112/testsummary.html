<!DOCTYPE html>
<html lang="en">
    <!--
        __author__ = "Myron Walker"
        __copyright__ = "Copyright 2025, Automation Mojo LLC"
        __version__ = "2.0.0"
    -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
        <meta name="description" content="Test execution summary report displaying test results, configuration, and artifacts">
        <title>Test Summary Report</title>

        <link rel="stylesheet" href="/static/v2/styles/prism.css" ></link>
        <link rel="stylesheet" href="/static/v2/styles/branding-theme.css" ></link>
        <link rel="stylesheet" href="/static/v2/styles/icon-styles.css" ></link>
        <link rel="stylesheet" href="/static/v2/styles/mojo-components.css" ></link>
        <link rel="stylesheet" href="/static/v2/styles/testsummary.css" ></link>
        <link rel="stylesheet" href="/static/v2/styles/testsummary-comparison.css" ></link>
        <link rel="stylesheet" href="/static/v2/styles/testsummary-responsive.css" ></link>
        <link rel="stylesheet" href="/static/v2/styles/testsummary-accessibility.css" ></link>

        <script type="text/javascript" src="/static/v2/javascript/prism.js"></script>
        <script type="text/javascript" src="/static/v2/javascript/webcomponent-helpers.js"></script>
        <script type="text/javascript" src="/static/v2/javascript/icon-components.js"></script>
        <script type="text/javascript" src="/static/v2/javascript/mojo-components.js"></script>
        <script type="text/javascript" src="/static/v2/javascript/testsummary-helpers.js"></script>
        <script type="text/javascript" src="/static/v2/javascript/testsummary.js" ></script>
        <script type="text/javascript" src="/static/v2/javascript/testsummary-components.js" ></script>
        <script type="text/javascript" src="/static/v2/javascript/testsummary-comparison.js" ></script>
        <script type="text/javascript" src="/static/v2/javascript/testsummary-responsive.js" ></script>
        <script type="text/javascript" src="/static/v2/javascript/testsummary-accessibility.js" ></script>



        <script type="text/javascript">
            function on_page_load() {

                register_testsummary_components()
                register_comparison_components()

                refresh_page().then(
                    function() {
                        console.log("Page loaded");
                        // Initialize responsive design after page content is loaded
                        init_responsive_design();
                        // Update navigation based on visible sections
                        update_responsive_navigation();
                        // Initialize accessibility features
                        init_accessibility();
                    }, function(err) {
                        console.log("ERROR:\n" + err);
                        console.log(err.stack);
                    }
                );

            }
        </script>

    </head>
    <body onload="on_page_load()" class="page-style">

        <header class='section-header' role="banner" aria-label="Test run summary banner">
            <testsummary-banner id="testsummary-banner" aria-label="Test execution summary"></testsummary-banner>
        </header>
            
        <main class='section-body ts_vertical_tiling_panel' role="main" aria-label="Test results and configuration">
            <testsummary-configuration id="testsummary-configuration" aria-label="Test configuration section"></testsummary-configuration>
            <testsummary-resultdetail id="testsummary-resultdetail" aria-label="Test result details section"></testsummary-resultdetail>
            <testsummary-comparison id="testsummary-comparison" aria-label="Test comparison section"></testsummary-comparison>
            <testsummary-trend-analysis id="testsummary-trend-analysis" aria-label="Trend analysis section"></testsummary-trend-analysis>
            <testsummary-artifacts id="testsummary-artifacts" aria-label="Test artifacts section"></testsummary-artifacts>
            <testsummary-importfailures id="testsummary-importfailures" aria-label="Import failures section"></testsummary-importfailures>
        </main>
          
        <footer class='section-footer' role="contentinfo" aria-label="Files and folders navigation">
            <testsummary-filesandfolders id="testsummary-filesandfolders" aria-label="Output directory navigation"></testsummary-filesandfolders>
        </footer>

    </body>
</html>
